name: ${HRMS_F1_PROJECT:?Set a unique HRMS_F1_PROJECT before use}

services:
  mysql:
    image: mysql:8.4.13
    hostname: ${HRMS_F1_MYSQL_HOSTNAME:?Set a unique disposable MySQL hostname}
    restart: "no"
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${HRMS_F1_MYSQL_HOST_PORT:-13307}:3306"
    secrets:
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - f1_private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    restart: "no"
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "127.0.0.1:${HRMS_F1_MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${HRMS_F1_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - f1_private

  bucket-init:
    image: amazon/aws-cli:2.38.6
    profiles: ["bootstrap"]
    restart: "no"
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/scripts/create-private-bucket.sh"]
    environment:
      HRMS_F1_BUCKET: ${HRMS_F1_BUCKET:?Set a unique private bucket name}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - ./create-private-bucket.sh:/scripts/create-private-bucket.sh:ro
    networks:
      - f1_private

secrets:
  mysql_root_password:
    file: "${HRMS_F1_MYSQL_PASSWORD_FILE:?Set an absolute path to a disposable MySQL password file}"
  minio_root_user:
    file: "${HRMS_F1_MINIO_USER_FILE:?Set an absolute path to a disposable MinIO user file}"
  minio_root_password:
    file: "${HRMS_F1_MINIO_PASSWORD_FILE:?Set an absolute path to a disposable MinIO password file}"

volumes:
  mysql_data:
    name: ${HRMS_F1_PROJECT}_mysql_data
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}
  minio_data:
    name: ${HRMS_F1_PROJECT}_minio_data
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}

networks:
  f1_private:
    name: ${HRMS_F1_PROJECT}_private
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    labels:
      com.hrms.disposable: "true"
      com.hrms.owner: "employee-bulk-import-f1"
      com.hrms.run-id: ${HRMS_F1_RUN_ID:?Set a unique HRMS_F1_RUN_ID before use}
