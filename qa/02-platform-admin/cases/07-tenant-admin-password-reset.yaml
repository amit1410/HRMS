sheet: Platform_Tenant_PasswordReset
submodule: Reset Tenant Administrator Password (Development only)
defaults:
  role: PLATFORM_ADMIN
  perm: PlatformTenant.Create
  tenant: None (platform identity domain)
  pre: "Development QA stack (ASPNETCORE_ENVIRONMENT=Development); Tenant A Active with a known set of TenantAdmin accounts."
  data: "ResetTenantAdminPasswordRequest {adminEmail?}."
  sev: High
  reg: true

cases:
  - id: PLAT-PWDRESET-001
    func: [F-PLAT-22]
    sc: Reset with exactly one active TenantAdmin
    t: When a tenant has exactly one active TenantAdmin, omitting adminEmail resets that one account
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync"]
    type: Positive
    pri: P0
    sev: Critical
    smoke: true
    pre: "Tenant A has exactly one active TenantAdmin user."
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Send {} (no adminEmail) => [200] data.adminEmail equals that admin's email, data.temporaryPassword is a non-empty string, message 'Temporary password generated. Copy it now; it will not be shown again.'"
      - "[POST /api/auth/login] Sign in at Tenant A's host with that admin's email and the returned password => [200]"
      - "[POST /api/auth/login] Sign in with the admin's OLD password => [401]"
    db: "Tenant shard Users.PasswordHash changed for that admin."
    auto: API
    ex: ["xU:PlatformTenantPasswordResetTests.Development_with_one_admin_resets_hash_and_returns_one_time_password"]

  - id: PLAT-PWDRESET-002
    func: [F-PLAT-22]
    sc: Reset is refused outside Development
    t: The endpoint is closed entirely in any non-Development environment
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (!_environment.IsDevelopment())"]
    type: Security
    tags: [Negative]
    pri: P0
    sev: Critical
    pre: "Requires a non-Development QA deployment; otherwise NOT EXECUTED - environment unavailable."
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Call against that instance => [403] 'Tenant administrator password reset is available only in Development.'"
    sec: "No production or staging path can mint a tenant admin password this way."
    auto: API

  - id: PLAT-PWDRESET-003
    func: [F-PLAT-22]
    sc: Zero active TenantAdmin accounts
    t: A tenant with no active TenantAdmin refuses the reset rather than silently doing nothing
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (admins.Count == 0)"]
    type: Negative
    pri: P1
    sev: High
    pre: "DB-assisted: deactivate or remove the TenantAdmin role from every admin in a disposable QA tenant."
    steps:
      - "[POST /api/platform/tenants/{that tenant id}/reset-admin-password] Send {} => [409] 'No active TenantAdmin account exists for this tenant.'"
    auto: DB-assisted
    ex: ["xU:PlatformTenantPasswordResetTests.No_admin_and_multiple_admins_fail_closed_until_an_email_is_selected"]

  - id: PLAT-PWDRESET-004
    func: [F-PLAT-22]
    sc: Multiple active TenantAdmins require an explicit selection
    t: Omitting adminEmail when more than one active TenantAdmin exists is refused
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (admins.Count != 1)"]
    type: Negative
    tags: [Boundary]
    pri: P1
    sev: High
    pre: "DB-assisted: ensure a disposable QA tenant has two or more active TenantAdmin users."
    steps:
      - "[POST /api/platform/tenants/{that tenant id}/reset-admin-password] Send {} (no adminEmail) => [409] 'Multiple active TenantAdmin accounts exist. Specify AdminEmail to select one.'"
      - "[POST /api/platform/tenants/{that tenant id}/reset-admin-password] Send {adminEmail: one of the two admins' emails} => [200] resets that one account; the other admin's password is unaffected"
    db: "Only the targeted admin's PasswordHash changes."
    auto: DB-assisted
    ex: ["xU:PlatformTenantPasswordResetTests.No_admin_and_multiple_admins_fail_closed_until_an_email_is_selected"]

  - id: PLAT-PWDRESET-005
    func: [F-PLAT-22]
    sc: Selecting a non-admin or unknown email is refused
    t: An adminEmail that does not belong to an active TenantAdmin is refused, even if it belongs to some other active user
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (Non_admin_cannot_be_selected)"]
    type: Negative
    tags: [Security]
    pri: P1
    sev: High
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Send {adminEmail: an existing Employee-role (non-TenantAdmin) user's email} => [404] 'The selected active TenantAdmin account was not found.'"
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Send {adminEmail: 'no-such-user@qa.example'} => [404] same"
    sec: "Cannot be used to reset an arbitrary employee's password by naming their email."
    auto: API
    ex: ["xU:PlatformTenantPasswordResetTests.Non_admin_cannot_be_selected_and_production_is_rejected"]

  - id: PLAT-PWDRESET-006
    func: [F-PLAT-22]
    sc: Selection is case-insensitive
    t: adminEmail matches the stored email regardless of case
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (StringComparison.OrdinalIgnoreCase)"]
    type: Positive
    tags: [Boundary]
    pri: P2
    sev: Medium
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Send {adminEmail: the admin's email in UPPER CASE} => [200] resets the matching account"
    auto: API

  - id: PLAT-PWDRESET-007
    func: [F-PLAT-22]
    sc: Reset requires an Active tenant
    t: Resetting the admin password of an Inactive or Suspended tenant is refused
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (tenant.Status != Active)"]
    type: Negative
    pri: P1
    sev: High
    steps:
      - "[POST /api/platform/tenants/{an Inactive QA tenant id}/reset-admin-password] Send {} => [409] 'Tenant administrator password reset requires an Active tenant.'"
    auto: API
    ex: ["xU:PlatformTenantPasswordResetTests.Inactive_and_unknown_tenants_are_rejected"]

  - id: PLAT-PWDRESET-008
    func: [F-PLAT-22]
    sc: Reset on an unknown tenant
    t: A well-formed but non-existent id returns 404
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (tenant is null)"]
    type: Negative
    pri: P1
    steps:
      - "[POST /api/platform/tenants/{random GUID}/reset-admin-password] Send {} => [404] 'Tenant was not found.'"
    auto: API
    ex: ["xU:PlatformTenantPasswordResetTests.Inactive_and_unknown_tenants_are_rejected"]

  - id: PLAT-PWDRESET-009
    func: [F-PLAT-22]
    sc: Reset revokes the target admin's existing sessions
    t: After a password reset, the admin's previously issued refresh tokens no longer work
    src: ["PlatformTenantService.ResetTenantAdminPasswordAsync (only PasswordHash is touched)"]
    type: Security
    tags: [Negative]
    pri: P1
    sev: High
    steps:
      - "[POST /api/auth/login] Sign in as the target admin BEFORE the reset => [200] T1 (access+refresh)"
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Reset that admin's password => [200]"
      - "[POST /api/auth/refresh] Attempt to refresh T1 => record actual: current code changes only PasswordHash and does not touch RefreshTokens, so this may still succeed [200] unless another mechanism revokes it"
    sec: "If refresh still succeeds, an attacker who already held a valid refresh token retains access despite a platform-operator-initiated password reset - contrast with self-service change-password and forgot-password, which both explicitly revoke all refresh tokens."
    auto: API
    cr: [CR-27]
    cm: "Exposes CR-27: unlike PasswordRecoveryService.ChangePasswordAsync/ResetPasswordAsync (Module 1), this platform-initiated reset does not revoke existing refresh tokens for the affected user."

  - id: PLAT-PWDRESET-010
    func: [F-PLAT-22]
    sc: Reset requires PlatformTenant.Create
    t: A platform user without PlatformTenant.Create cannot reset a tenant admin's password
    src: ["[PlatformPermission(PlatformPermissions.TenantCreate)]"]
    type: Authorization
    tags: [Negative]
    pri: P0
    sev: Critical
    role: PLATFORM_VIEWER
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] As PLATFORM_VIEWER => [403]"
    auto: API
    ex: ["xU:PlatformTenantAuthorizationTests.Password_reset_uses_existing_platform_tenant_create_permission"]

  - id: PLAT-PWDRESET-011
    func: [F-PLAT-22, F-PLAT-23]
    sc: Temporary password format
    t: The generated temporary password is high-entropy, matching the onboarding generator
    src: ["PlatformTenantService.GenerateTemporaryPassword (shared with onboarding)"]
    type: Positive
    tags: [Security]
    pri: P2
    sev: Medium
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Send {} => [200] inspect temporaryPassword => same 24-byte-entropy shape as PLAT-CREATE-023's onboarding password"
    auto: API
    cr: [CR-23]

  - id: PLAT-PWDRESET-012
    func: [F-PLAT-22]
    sc: Cache-Control on the reset response
    t: "The response, which carries a plaintext temporary password, sets Cache-Control: no-store"
    src: ["PlatformTenantsController.ResetAdminPassword (Response.Headers.CacheControl = 'no-store')"]
    type: Security
    tags: [Configuration]
    pri: P1
    sev: Medium
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Inspect response headers on success => Cache-Control: no-store"
    auto: API

  - id: PLAT-PWDRESET-013
    func: [F-PLAT-22, F-PLAT-32]
    sc: Reset is unreachable at a tenant host
    t: POST .../reset-admin-password at a customer host is blocked before authentication
    src: ["PlatformRequestRoutingMiddleware"]
    type: Tenant-Isolation
    tags: [Security]
    pri: P0
    sev: Critical
    role: Anonymous
    tenant: A
    steps:
      - "[POST /api/platform/tenants/{Tenant A id}/reset-admin-password] Call at the Tenant A host with a valid platform token => [404]"
    auto: API

  - id: PLAT-PWDRESET-014
    func: [F-PLAT-22]
    sc: Frontend hides the reset action outside Development builds
    t: The 'Reset Tenant Admin Password' action is rendered only when the frontend is built in DEV mode
    src: ["PlatformTenantsPage (import.meta.env.DEV && canEdit && tenant.status === 'Active')"]
    type: Positive
    tags: [Negative]
    pri: P2
    sev: Medium
    pre: "Requires access to both a dev-mode (`npm run dev`) and a production build of the frontend."
    steps:
      - "In the dev-mode frontend, open a tenant's Actions menu => 'Reset Tenant Admin Password' is present for an Active tenant"
      - "In a production build of the frontend pointed at the same API, open the same menu => the action is absent, even though the backend gate is environment-based, not build-mode-based"
    auto: UI
    cm: "Frontend visibility (build mode) and backend enforcement (ASPNETCORE_ environment) are two different signals that happen to usually agree in this repository's Development setup; confirm they cannot disagree in a way that hides a working action or shows a non-working one."
