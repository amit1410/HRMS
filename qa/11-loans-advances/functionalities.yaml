    group: Payroll Deduction Integration
    status: Implemented
    api: "POST /api/payroll/runs/{id}/calculate"
    service: "PayrollCalculationEngine.CalculateEmployeeAsync"
    permission: "Payroll.Run.Calculate"
    db: LoanInstallments.Status

  - id: F-LOAN-047
    name: "RecoveryPolicy.RecoverFullOrFail fails the entire employee's payroll calculation (CalculationFailed) when the installment's TotalDue exceeds the employee's available net pay at that point"
    group: Payroll Deduction Integration
    status: Implemented
    api: "POST /api/payroll/runs/{id}/calculate"
    service: "PayrollCalculationEngine.CalculateEmployeeAsync"
    permission: "Payroll.Run.Calculate"
    db: PayrollCalculationErrors

  - id: F-LOAN-048
    name: RecoveryPolicy.PartialRecovery clips the recovered amount down to whatever net pay remains (floored at zero) instead of failing the calculation
    group: Payroll Deduction Integration
    status: Implemented
    api: "POST /api/payroll/runs/{id}/calculate"
    service: "PayrollCalculationEngine.CalculateEmployeeAsync"
    permission: "Payroll.Run.Calculate"
    db: PayrollResultComponents

  - id: F-LOAN-049
    name: "Multiple due installments across multiple loans for the same employee are applied in RecoveryPriority order, each one decrementing the running NetPay before the next is evaluated"
    group: Payroll Deduction Integration
    status: Implemented
    api: "POST /api/payroll/runs/{id}/calculate"
    service: "PayrollCalculationEngine.CalculateEmployeeAsync"
    permission: "Payroll.Run.Calculate"
