# Functionality registry for Module 11 - Loans & Advances (phase 7N: Loan Product/Salary-Advance
# configuration and effective-dated versions, employee loan/advance requests and eligibility, submit/
# approve/reject lifecycle, manual disbursement and EMI schedule generation (None/Flat/ReducingBalance),
# payroll deduction (recovery) integration with the Calculation Engine, manual repayment/partial-
# prepayment/early-closure and outstanding-balance maintenance, cancellation, Final Settlement loan-
# recovery integration, the tenant-scoped paginated Loan Register, Authorization/Scope, Tenant Isolation,
# Audit/History, SQL Server/MySQL Provider Parity, Large Data/Paging, and Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id. IDs are allocated in one global sequence (F-LOAN-001...) in
# the order the case files below were authored - group boundaries are noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): this module covers exactly the surface qa/10-payroll's
# own README named as an explicit out-of-scope carry-forward for a future module: "Loans/Salary Advances
# (phase 7n)". Loan GL/accounting journal generation (PayrollAccountingService's LoanPayrollRecovery/
# LoanFinalSettlementRecovery/LoanInterestRecovery mapping types, i.e. the actual debit/credit journal
# lines and PayrollGLMapping configuration) is explicitly OUT of scope here too, for the identical reason
# qa/10-payroll excluded all of Payroll Accounting/GL Posting (phase 7i) - it is a separate, self-contained
# ledger-posting concern with its own configuration surface. This module verifies that a loan recovery
# correctly produces a LoanRepayment row and updates EmployeeLoan/LoanInstallment state (the business
# outcome), not that a balanced GL journal is subsequently posted from it (the accounting outcome).
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc;
# docs/phase-7n-loans-salary-advances.md was read and current code wins wherever they diverge, per
# CLAUDE.md):
#   Backend/HRMS.API/Controllers/PayrollLoansController.cs (also hosts the /api/me/loans* ESS routes)
#   Backend/HRMS.Application/Services/PayrollLoanService.cs, LoanPayrollRecoveryResolver.cs
#   Backend/HRMS.Application/Abstractions/IPayrollLoanService.cs, ILoanPayrollRecoveryResolver.cs
#   Backend/HRMS.Application/DTOs/Payroll/PayrollLoanDtos.cs, PayrollLoanRecoveryDtos.cs
#   Backend/HRMS.Domain/Entities/PayrollLoans.cs (LoanProduct, LoanProductVersion, EmployeeLoan,
#     LoanInstallment, LoanRepayment, LoanHistory)
#   Backend/HRMS.Domain/Enums/LoanEnums.cs
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Permissions.Payroll.Loans* - full 10-entry block
#     read in full, ids 145-154)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/PayrollLoansConfiguration.cs
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap for every seeded role,
#     read in full - grep-verified for every Loans* permission constant)
#   Backend/HRMS.Application/Services/PayrollCalculationEngine.cs (loanRecovery integration block and
#     PersistLoanRecoveriesAsync - read in full), PayrollRetroSettlementService.cs (CalculateSettlementAsync
#     / TransitionSettlementAsync's Final Settlement loan-recovery-line generation and finalization - read
#     in full), PayrollApprovalGuard.cs (maker-checker used by Approve/Cancel)
#   Frontend/HRMS.Web/src/pages/payroll/PayrollLoansPage.tsx (PayrollLoansPage + MyLoansPage),
#     PayrollLoansPage.test.tsx, src/api/payroll.ts (loan client functions)
#   Existing xUnit (PayrollLoansFoundationTests, PayrollLoansConcurrencyTests, PayrollLoansProviderAcceptance,
#     MySqlPayrollLoansIntegrationTests, SqlServerPayrollLoansIntegrationTests - not individually classified,
#     per the qa/10-payroll precedent explained in README.md) and PayrollLoansPage.test.tsx (Vitest).
#
# ── Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) ──
# CR-183: grep-verified against SeedData.cs's RolePermissionMap - NO seeded role other than SuperAdmin and
# TenantAdmin (both of which receive Permissions.All) holds ANY Payroll.Loans.* permission. HRAdmin (which
# natively holds the entire Salary/Structure/Period/Run/Controls/TaxDeclaration/YearEndTax grant list in
# qa/10-payroll), SuperHR (which natively holds an equivalent Payroll footprint there), HRManager, Manager,
# and Employee are ALL granted zero Loans permissions out of the box - including Employee's own
# Payroll.Loans.Request, meaning a freshly seeded Employee cannot even submit a loan/advance request for
# themselves through /api/me/loans without an explicit tenant grant. This is a materially larger native gap
# than any single-role finding in qa/10-payroll (CR-165/168/179).
# CR-184: CONFIRMED SOURCE-LEVEL BUG - a loan whose OutstandingTotal reaches zero purely through payroll
# deduction recovery (PayrollCalculationEngine.PersistLoanRecoveriesAsync) is never transitioned to Closed,
# unlike PayrollLoanService.RecordRepaymentAsync's manual-repayment path, which explicitly closes the loan
# the moment OutstandingTotal hits zero. The loan remains Status=Active indefinitely once fully recovered by
# payroll alone.
# CR-185: Payroll.Loans.Manage and Payroll.Loans.ViewHistory are declared/seeded (ids 147 and 153) but
# checked by zero [HasPermission] attributes anywhere in the codebase - the same dead-permission shape as
# qa/10-payroll's CR-167/173/175. No /history endpoint exists for loans at all.

functionalities:
  # ═══════════════════════════════ A. LOAN PRODUCTS AND CONFIGURATION ═══════════════════════════════
  - id: F-LOAN-001
    name: List loan products for the tenant, ordered by Code
    group: Loan Products and Configuration
    status: Implemented
    ui: PayrollLoansPage
    api: "GET /api/payroll/loan-products"
    service: "PayrollLoanService.GetProductsAsync"
    permission: "Payroll.Loans.View"
    db: LoanProducts

  - id: F-LOAN-002
    name: Create a loan product - Code and Name are required
    group: Loan Products and Configuration
    status: Implemented
    ui: PayrollLoansPage
    api: "POST /api/payroll/loan-products"
    service: "PayrollLoanService.CreateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts

  - id: F-LOAN-003
    name: "Amount limits are validated: MinAmount/MaxAmount cannot be negative and Min cannot exceed Max"
    group: Loan Products and Configuration
    status: Implemented
    api: "POST/PUT /api/payroll/loan-products"
    service: "PayrollLoanService.CreateProductAsync / UpdateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts

  - id: F-LOAN-004
    name: "Tenure limits are validated: MinTenureMonths/MaxTenureMonths must be >=1 and Min cannot exceed Max"
    group: Loan Products and Configuration
    status: Implemented
    api: "POST/PUT /api/payroll/loan-products"
    service: "PayrollLoanService.CreateProductAsync / UpdateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts

  - id: F-LOAN-005
    name: Product Code is trimmed and must be unique per tenant, else Conflict
    group: Loan Products and Configuration
    status: Implemented
    api: "POST /api/payroll/loan-products"
    service: "PayrollLoanService.CreateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts

  - id: F-LOAN-006
    name: Creating a product auto-generates one open-ended Active LoanProductVersion effective from today, carrying the same terms
    group: Loan Products and Configuration
    status: Implemented
    service: "PayrollLoanService.CreateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProductVersions

  - id: F-LOAN-007
    name: Update requires the product to exist in the tenant (NotFound) and re-checks code uniqueness excluding itself (Conflict)
    group: Loan Products and Configuration
    status: Implemented
    api: "PUT /api/payroll/loan-products/{id}"
    service: "PayrollLoanService.UpdateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts

  - id: F-LOAN-008
    name: "Update never touches LoanProductVersions - the product header's own Min/Max amount and tenure fields (used later as CreateLoanAsync's eligibility bounds) and each version's own independently-set Min/Max fields can drift out of sync"
    group: Loan Products and Configuration
    status: Implemented
    api: "PUT /api/payroll/loan-products/{id}"
    service: "PayrollLoanService.UpdateProductAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProducts, LoanProductVersions

  - id: F-LOAN-009
    name: "CreateProductVersionAsync validates EffectiveTo>=EffectiveFrom, non-negative/ordered amount and tenure bounds, and non-negative InterestRate"
    group: Loan Products and Configuration
    status: Implemented
    api: "POST /api/payroll/loan-products/{id}/versions"
    service: "PayrollLoanService.CreateProductVersionAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProductVersions

  - id: F-LOAN-010
    name: A new Active version's date range cannot overlap an existing Active version's range for the same product, else Conflict
    group: Loan Products and Configuration
    status: Implemented
    api: "POST /api/payroll/loan-products/{id}/versions"
    service: "PayrollLoanService.CreateProductVersionAsync"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProductVersions

  - id: F-LOAN-011
    name: "LoanProductVersionStatus.Retired is a declared lifecycle state that no service method ever assigns - a version can never be explicitly retired through the API"
    group: Loan Products and Configuration
    status: Implemented
    service: "PayrollLoanService.cs (full grep for LoanProductVersionStatus.Retired)"
    permission: "Payroll.Loans.ManageProducts"
    db: LoanProductVersions.Status

  # ═══════════════════════════════ B. ELIGIBILITY AND EMPLOYEE LOAN REQUESTS ═══════════════════════════════
  - id: F-LOAN-012
    name: CreateLoanAsync requires RequestedAmount>0 and RequestedTenureMonths>0, else Invalid
    group: Eligibility and Employee Loan Requests
    status: Implemented
    ui: MyLoansPage
    api: "POST /api/payroll/loans, POST /api/me/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans

  - id: F-LOAN-013
    name: The referenced loan product must exist in the tenant and be Active, else NotFound
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: LoanProducts

  - id: F-LOAN-014
    name: "The target employee must exist in the tenant, else NotFound - CreateLoanAsync does not additionally require the employee's own Status to be Active, unlike Payroll Run population eligibility"
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: Employees

  - id: F-LOAN-015
    name: RequestedAmount must fall within the product header's MinAmount/MaxAmount (when set), else Invalid
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: LoanProducts

  - id: F-LOAN-016
    name: RequestedTenureMonths must fall within the product header's MinTenureMonths/MaxTenureMonths (when set), else Invalid
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: LoanProducts

  - id: F-LOAN-017
    name: "MaxConcurrentLoans is stored on the product but is never read or enforced anywhere in CreateLoanAsync - an employee may hold unlimited concurrent loans against a product declaring a cap"
    group: Eligibility and Employee Loan Requests
    status: Implemented
    service: "PayrollLoanService.cs (full grep for MaxConcurrentLoans usage)"
    permission: "Payroll.Loans.Request"
    db: LoanProducts.MaxConcurrentLoans

  - id: F-LOAN-018
    name: "The loan's interest terms (InterestMethod/InterestRate) and RecoveryPolicy are resolved from the currently-effective Active LoanProductVersion (latest EffectiveFrom<=today, EffectiveTo null or >=today); when none resolves, the request still succeeds falling back to the product-header InterestMethod/InterestRate/RecoveryPolicy with LoanProductVersionId left at Guid.Empty"
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: LoanProductVersions

  - id: F-LOAN-019
    name: LoanNumber is generated as {LN|ADV}/{year}/{random-GUID-fragment} truncated to 22 characters and upper-cased - not a deterministic sequential number
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans.LoanNumber

  - id: F-LOAN-020
    name: "Status resolves to Draft when the product requires approval (default), or straight to Approved (with ApprovedAmount/ApprovedTenureMonths pre-filled from the request) when the product does not"
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans.Status

  - id: F-LOAN-021
    name: OutstandingPrincipal and OutstandingTotal are pre-populated to RequestedAmount at creation time, before any approval has happened
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/payroll/loans"
    service: "PayrollLoanService.CreateLoanAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans.OutstandingPrincipal, OutstandingTotal

  - id: F-LOAN-022
    name: "Creating a loan appends a Created LoanHistory row, and the ESS self-service create route (POST /api/me/loans) forcibly overwrites the submitted EmployeeId with the caller's own linked-employee id before calling CreateLoanAsync"
    group: Eligibility and Employee Loan Requests
    status: Implemented
    api: "POST /api/me/loans"
    service: "PayrollLoansController.MyCreate"
    permission: "Payroll.Loans.Request"
    db: LoanHistories

  # ═══════════════════════════════ C. SUBMISSION, APPROVAL AND REJECTION ═══════════════════════════════
  - id: F-LOAN-023
    name: Submit transitions a loan from Draft to Submitted only, else Conflict
    group: Submission, Approval and Rejection
    status: Implemented
    ui: MyLoansPage
    api: "POST /api/payroll/loans/{id}/submit, POST /api/me/loans/{id}/submit"
    service: "PayrollLoanService.SubmitAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans.Status

  - id: F-LOAN-024
    name: Approve requires the loan to be Submitted, else Conflict
    group: Submission, Approval and Rejection
    status: Implemented
    ui: PayrollLoansPage
    api: "POST /api/payroll/loans/{id}/approve"
    service: "PayrollLoanService.ApproveAsync"
    permission: "Payroll.Loans.Approve"
    db: EmployeeLoans.Status

  - id: F-LOAN-025
    name: Approve invokes PayrollApprovalGuard maker-checker and rejects self-approval when the tenant's PayrollControlConfiguration has RequireMakerChecker and PreventSelfApproval enabled and the approver is the original requester
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/approve"
    service: "PayrollLoanService.ApproveAsync -> PayrollApprovalGuard.ValidateAsync"
    permission: "Payroll.Loans.Approve"
    db: PayrollControlConfigurations

  - id: F-LOAN-026
    name: Approve accepts optional approvedAmount/approvedTenureMonths overrides, defaulting to the originally requested values when omitted
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/approve?amount=&tenureMonths="
    service: "PayrollLoanService.ApproveAsync"
    permission: "Payroll.Loans.Approve"
    db: EmployeeLoans.ApprovedAmount, ApprovedTenureMonths

  - id: F-LOAN-027
    name: Approve resets OutstandingPrincipal and OutstandingTotal to the (possibly overridden) ApprovedAmount and stamps ApprovedAtUtc/ApprovedByUserId
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/approve"
    service: "PayrollLoanService.ApproveAsync"
    permission: "Payroll.Loans.Approve"
    db: EmployeeLoans.OutstandingPrincipal, OutstandingTotal

  - id: F-LOAN-028
    name: "Reject is allowed from EITHER Submitted or Draft status (not Submitted-only) and requires a non-blank reason, else Invalid"
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/reject?reason="
    service: "PayrollLoanService.RejectAsync"
    permission: "Payroll.Loans.Approve"
    db: EmployeeLoans.Status, RejectionReason

  - id: F-LOAN-029
    name: "Reject does NOT invoke PayrollApprovalGuard at all - unlike Approve and Cancel, a self-requester can reject their own loan even under a maker-checker/self-approval policy, and RequireReasonForCancellation-style policy reasons never apply to Reject"
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/reject"
    service: "PayrollLoanService.RejectAsync (full method - no approvalGuard reference)"
    permission: "Payroll.Loans.Approve"
    db: "n/a"

  - id: F-LOAN-030
    name: "A loan already Approved, Rejected, Disbursed/Active, Closed or Cancelled cannot be Submitted again"
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/submit"
    service: "PayrollLoanService.TransitionAsync"
    permission: "Payroll.Loans.Request"
    db: EmployeeLoans.Status

  - id: F-LOAN-031
    name: "A cross-tenant loan id (submit/approve/reject) is NotFound, not Forbidden"
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/approve"
    service: "PayrollLoanService.cs (TenantId filter)"
    permission: "Payroll.Loans.Approve"
    db: EmployeeLoans (TenantId filter)

  - id: F-LOAN-032
    name: Every submit/approve/reject transition appends an append-only LoanHistory row carrying the previous and next status
    group: Submission, Approval and Rejection
    status: Implemented
    api: "POST /api/payroll/loans/{id}/submit, /approve, /reject"
    service: "PayrollLoanService.AddHistory"
    permission: "Payroll.Loans.Request"
    db: LoanHistories

  # ═══════════════════════════════ D. DISBURSEMENT AND EMI SCHEDULE ═══════════════════════════════
  - id: F-LOAN-033
    name: RecordDisbursementAsync requires the loan to be Approved, else Conflict
    group: Disbursement and EMI Schedule
    status: Implemented
    ui: PayrollLoansPage
    api: "POST /api/payroll/loans/{id}/record-disbursement"
    service: "PayrollLoanService.RecordDisbursementAsync"
    permission: "Payroll.Loans.Disburse"
    db: EmployeeLoans.Status

  - id: F-LOAN-034
    name: "Disbursed amount defaults to ApprovedAmount, must be >0 and cannot exceed ApprovedAmount - a disbursed amount below the approved amount (partial disbursement) is accepted"
    group: Disbursement and EMI Schedule
    status: Implemented
    api: "POST /api/payroll/loans/{id}/record-disbursement?amount="
    service: "PayrollLoanService.RecordDisbursementAsync"
    permission: "Payroll.Loans.Disburse"
    db: EmployeeLoans.DisbursedAmount

  - id: F-LOAN-035
    name: Disbursement moves the loan to Active and stamps DisbursedAtUtc, appending both Disbursed and Activated LoanHistory events
    group: Disbursement and EMI Schedule
    status: Implemented
    api: "POST /api/payroll/loans/{id}/record-disbursement"
    service: "PayrollLoanService.RecordDisbursementAsync"
    permission: "Payroll.Loans.Disburse"
    db: EmployeeLoans.Status, LoanHistories

  - id: F-LOAN-036
    name: "The installment schedule (BuildSchedule) is generated exactly once per loan, double-guarded by a hadSchedule check before persistence and an internal early-return when installments already exist"
    group: Disbursement and EMI Schedule
    status: Implemented
    api: "POST /api/payroll/loans/{id}/record-disbursement"
    service: "PayrollLoanService.BuildSchedule"
    permission: "Payroll.Loans.Disburse"
    db: LoanInstallments

  - id: F-LOAN-037
    name: "InterestMethod.None produces a zero-interest schedule - principal split evenly across the tenure, with the final installment absorbing any rounding remainder"
    group: Disbursement and EMI Schedule
    status: Implemented
    service: "PayrollLoanService.BuildSchedule"
    permission: "Payroll.Loans.Disburse"
    db: LoanInstallments

  - id: F-LOAN-038
    name: "InterestMethod.Flat computes total interest as Principal*Rate%*(TenureMonths/12), split evenly per installment, with principal likewise split evenly and the remainder absorbed by the final installment"
    group: Disbursement and EMI Schedule
    status: Implemented
    service: "PayrollLoanService.BuildSchedule"
    permission: "Payroll.Loans.Disburse"
    db: LoanInstallments

  - id: F-LOAN-039
    name: "InterestMethod.ReducingBalance computes a standard amortizing EMI from the monthly rate and tenure, with each installment's principal component derived from the prior installment's closing balance"
    group: Disbursement and EMI Schedule
    status: Implemented
    service: "PayrollLoanService.BuildSchedule"
    permission: "Payroll.Loans.Disburse"
    db: LoanInstallments

  - id: F-LOAN-040
    name: Each installment persists OpeningPrincipal/PrincipalAmount/InterestAmount/InstallmentAmount/ClosingPrincipal and a DueDate of the disbursement date advanced by its installment number in months
    group: Disbursement and EMI Schedule
    status: Implemented
    api: "GET /api/payroll/loans/{id}/schedule"
    service: "PayrollLoanService.BuildSchedule"
    permission: "Payroll.Loans.View"
    db: LoanInstallments

  - id: F-LOAN-041
    name: After disbursement, OutstandingInterest and OutstandingTotal are recomputed as the sum of the generated installments' InterestAmount plus the disbursed principal
    group: Disbursement and EMI Schedule
    status: Implemented
    api: "POST /api/payroll/loans/{id}/record-disbursement"
    service: "PayrollLoanService.RecordDisbursementAsync"
    permission: "Payroll.Loans.Disburse"
    db: EmployeeLoans.OutstandingInterest, OutstandingTotal

  - id: F-LOAN-042
    name: GetScheduleAsync returns the persisted installment set ordered by InstallmentNumber, NotFound for an unknown or cross-tenant loan id
    group: Disbursement and EMI Schedule
