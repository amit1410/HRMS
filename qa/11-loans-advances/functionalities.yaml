    api: "GET /api/me/loans/{id}"
    service: "PayrollLoanService.ToDto(EmployeeLoan)"
    permission: "Payroll.Loans.Request"
    db: LoanInstallments

  # ═══════════════════════════════ E. PAYROLL DEDUCTION INTEGRATION ═══════════════════════════════
  - id: F-LOAN-044
    name: "LoanPayrollRecoveryResolver.ResolveAsync selects due installments for Active loans only (Status Scheduled or PartiallyRecovered, DueDate<=payDate, RecoveredAmount<InstallmentAmount), ordered by the owning product's RecoveryPriority, then DueDate, then InstallmentNumber"
