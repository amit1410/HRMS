    api: "PUT /api/employee-code-configuration (Padding 0-10); PUT/POST /api/employee-code-configuration/rules (segment PaddingLength 0-12)"
    service: "EmployeeCodeConfigurationRequestValidator.Padding vs EmployeeCodeConfigurationService.SaveRuleAsync ('s.PaddingLength is < 0 or > 12')"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "none"

