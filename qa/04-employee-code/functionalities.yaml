    service: "EmployeeEmploymentService.AssignPendingEmployeeCodeAsync (Manual branch: blank code -> Invalid 'employeeCode'/'Employee code is required for manual assignment.'; case-insensitive Employees.EmployeeCode uniqueness check -> Conflict 'This employee code is already in use.')"
    permission: "EmploymentHistory.Change"
    db: "Employees.EmployeeCode (uniqueness probe, tenant + cross-employee)"

