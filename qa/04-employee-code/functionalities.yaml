# Functionality registry for Module 4 - Employee Code Generation.
# Every test case references one or more of these ids; the builder fails if a functionality has zero cases
# or a case references an unknown id.
#
# Discovered implementation (authoritative source: EmployeeCodeConfigurationController/Service,
# EmployeeEmploymentService.CreateChangeAsync/AssignPendingEmployeeCodeAsync, EmployeeCodeSequenceService,
# EmployeeCodeRuleMatcher/EmployeeCodeRenderer, the EF configurations/migrations under
# HRMS.Infrastructure/Persistence, the two per-provider IEmployeeCodeSequenceUpdater implementations,
# EmployeeCodeConfigurationPage.tsx, EmploymentSectionForm.tsx and PersonalDetailsForm.tsx):
#
# There are TWO Employee-Code concepts in the tenant schema, one of them live and one dead:
#   - EmployeeCodeConfig / EmployeeCodeConfigVersion (+ EmployeeCodeRule/Condition/Segment/Sequence) is the
#     LIVE, effective-dated, Manual-or-Auto x Simple-or-Rule-Based engine. It is read/written exclusively
#     through EmployeeCodeConfigurationController and consumed exclusively by
#     EmployeeEmploymentService.CreateChangeAsync (via AssignPendingEmployeeCodeAsync) - the single place an
#     Employee Code is ever assigned, and it happens exactly once, at the first employment record
#     (employee.EmployeeCode is null gate), never on a later change (see F-CODE-20/F-CODE-21, CR-41).
#   - EmployeeService.cs still carries a legacy Prefix+NextNumber implementation
#     (ResolveEmployeeCodeAsync/PersistEmployeeCodeCounterAsync) that reads/writes the same EmployeeCodeConfig
#     row's AutoGenerate/Prefix/Padding/NextNumber fields, but has NO caller anywhere in the codebase - dead
#     code left over from before Employee Code was moved to the Initial Employment step (F-CODE-26, CR-37).
#
# Assignment mode (EmployeeCodeAssignmentMode: Manual=0, Auto=1) and generation method
# (EmployeeCodeGenerationMethod: Simple=0, RuleBased=1) are independent axes; Manual always implies
# GenerationMethod=null (server-forced) regardless of what the client sends.
#
# Rule-Based generation resolves through EmployeeCodeRuleMatcher (priority ascending, then rule Id, first
# non-default rule whose conditions ALL match; falls back to the version's single active default rule with
# zero conditions) and renders through EmployeeCodeRenderer (ordered EmployeeCodeSegment list: FixedText,
# SequentialNumber [D-padded], 13 master-code segment types, JoiningYear, JoiningMonth, CustomConstant;
# JoiningFinancialYear and LocationCode are defined in the enum but have NO renderer case and NO rule-save
# path that can reach them - Location is explicitly rejected at both condition and segment save time because
# this data model has no separate Location master).
#
# Sequence allocation (EmployeeCodeSequenceService.AllocateAsync) is scoped per EmployeeCodeRule
# (Scope=Tenant, ScopeKey="RULE:{ruleId}", PeriodKey="NONE" - ResetPeriod/other Scope values exist on the
# entity/enum but Rule-Based generation only ever calls AllocateAsync with these fixed constants), uses an
# optimistic create-if-absent-then-ExecuteUpdateAsync retry loop (MaxAttempts=8), and is advanced through a
# provider-specific IEmployeeCodeSequenceUpdater when one is registered (SqlServerEmployeeCodeSequenceUpdater
# vs MySqlEmployeeCodeSequenceUpdater, which additionally stamps an app-managed RowVersion token). Simple
# generation does NOT use EmployeeCodeSequenceService at all - it advances
# EmployeeCodeConfigVersion.NextNumber directly with its own single ExecuteUpdateAsync/retry loop inside
# AssignPendingEmployeeCodeAsync.

functionalities:
  - id: F-CODE-01
    name: Read the tenant's current Employee Code configuration
    group: Configuration
    status: Implemented
    ui: "EmployeeCodeConfigurationPage initial load"
    api: "GET /api/employee-code-configuration"
    service: "EmployeeCodeConfigurationService.GetAsync (returns the config row plus its latest-by-EffectiveFrom version; 404 if no config row exists yet)"
    permission: "EmployeeCodeConfiguration.View"
    db: "EmployeeCodeConfigs, EmployeeCodeConfigVersions (tenant-filtered)"

  - id: F-CODE-02
    name: Save (create or update) the Employee Code configuration - config row + version row together
    group: Configuration
    status: Implemented
    ui: "EmployeeCodeConfigurationPage 'Save Configuration' form"
    api: "PUT /api/employee-code-configuration"
    service: "EmployeeCodeConfigurationService.SaveAsync (creates the single per-tenant EmployeeCodeConfig row on first save; every save also creates-or-updates one EmployeeCodeConfigVersion keyed by VersionId or by an exact EffectiveFrom match)"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "EmployeeCodeConfigs (insert/update), EmployeeCodeConfigVersions (insert/update)"

  - id: F-CODE-03
    name: Legacy AutoGenerate=false compatibility - forces AssignmentMode=Manual and GenerationMethod=null server-side
    group: Configuration
