    api: "PUT /api/employee-code-configuration"
    service: "EmployeeCodeConfigurationService.SaveAsync ('Legacy callers still send AutoGenerate only; derive the explicit mode for compatibility')"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "EmployeeCodeConfigs.AssignmentMode/GenerationMethod, EmployeeCodeConfigVersions.AssignmentMode/GenerationMethod"

  - id: F-CODE-04
    name: Configuration request validation (prefix, next number, padding, separator, generation method presence)
    group: Configuration
    status: Implemented
    ui: "EmployeeCodeConfigurationPage form fields (prefix maxLength 10, padding input min 0 max 10, separator <select>)"
    api: "PUT /api/employee-code-configuration"
    service: "EmployeeCodeConfigurationRequestValidator (Prefix: required, <=10 chars, [A-Za-z0-9_-]+; NextNumber >=1; Padding 0-10; Separator in {'', '-','/','.','_'}; GenerationMethod required iff Auto, forbidden iff Manual; EffectiveTo >= EffectiveFrom)"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "none (rejected before save)"

  - id: F-CODE-05
    name: New-version overlap detection against every other ACTIVE version of the same configuration
    group: Effective Dating
    status: Implemented
    ui: "EmployeeCodeConfigurationPage save error banner"
    api: "PUT /api/employee-code-configuration (no versionId, or a versionId whose EffectiveFrom differs from the request)"
    service: "EmployeeCodeConfigurationService.SaveAsync (interval-overlap test: request.EffectiveFrom <= (v.EffectiveTo ?? MaxValue) && v.EffectiveFrom <= (request.EffectiveTo ?? MaxValue), only against IsActive versions; inactive/superseded versions never block a new one)"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "EmployeeCodeConfigVersions (read, tenant + config scoped)"

  - id: F-CODE-06
    name: Editing an existing version re-runs the same overlap check against every OTHER active version
    group: Effective Dating
    status: Implemented
    ui: "EmployeeCodeConfigurationPage editing the currently-loaded version (same EffectiveFrom as loaded data)"
    api: "PUT /api/employee-code-configuration (versionId supplied)"
    service: "EmployeeCodeConfigurationService.SaveAsync (v.Id != version.Id excludes the version being edited from its own overlap check)"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "EmployeeCodeConfigVersions"

  - id: F-CODE-07
    name: A versionId that does not resolve to a real version of this tenant's configuration is rejected
    group: Effective Dating
    status: Implemented
    ui: "n/a (only reachable by calling the API directly with a stale/foreign versionId)"
    api: "PUT /api/employee-code-configuration"
    service: "EmployeeCodeConfigurationService.SaveAsync (VersionId is not null && version is null -> NotFound)"
    permission: "EmployeeCodeConfiguration.Manage"
    db: "EmployeeCodeConfigVersions (tenant + config scoped lookup)"

  - id: F-CODE-08
    name: Simple Sequence code composition - Prefix + Separator + zero-padded running number
    group: Simple Sequence
    status: Implemented
    ui: "EmployeeCodeConfigurationPage 'Example preview' text"
    api: "n/a (server-side composition at employment time)"
    service: "EmployeeEmploymentService.AssignPendingEmployeeCodeAsync (Simple branch: prefix + separator + number.ToString(padding==0 ? '' : 'D{padding}'))"
    permission: "n/a"
    db: "EmployeeCodeConfigVersions.NextNumber (read+advance)"

  - id: F-CODE-09
    name: Simple Sequence counter advance is per-version, optimistic, and retried on contention
    group: Simple Sequence
    status: Implemented
    ui: "n/a"
    api: "n/a"
    service: "EmployeeEmploymentService.AssignPendingEmployeeCodeAsync (ExecuteUpdateAsync WHERE NextNumber == number; on 0 rows affected, reloads the version and retries the loop; loop is unbounded by attempt count, unlike EmployeeCodeSequenceService's MaxAttempts=8, and eventually returns Conflict 'Employee Code sequence is busy; please retry.' only if it never reads a consistent row - practically unreachable without an external fault)"
    permission: "n/a"
    db: "EmployeeCodeConfigVersions.NextNumber"

