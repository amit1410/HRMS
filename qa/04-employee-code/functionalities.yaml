    service: "EmployeeCodeRuleMatcher.Match(rules, values, referenceIds) (excludes IsDefault rules and zero-condition rules from the specific-match pass; OrderBy Priority, ThenBy Id; fallback is SingleOrDefault(IsDefault) among Active rules - throws if two Active defaults ever coexist, which SaveRuleAsync's own uniqueness guard is meant to prevent)"
    permission: "n/a"
    db: "EmployeeCodeRules/Conditions/Segments (read, filtered to this version, not deleted, Active)"

