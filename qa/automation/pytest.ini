[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --alluredir=reports/allure-results

markers =
    smoke: Fast critical-path checks safe to run on every change.
    regression: Broader regression coverage beyond the smoke set.
    ui: Browser-driven (Playwright) UI test.
    api: Direct HTTP API test (no browser).
    critical: Business-critical scenario; a failure here should block a release.
    e2e: Ordered, stateful end-to-end flow; writes only to the QAAUTO payroll sandbox and needs its opt-in env vars.
    known_defect: Asserts the correct contract for a reported product defect, so it fails until the defect is fixed.
