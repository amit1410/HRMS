sheet: Auth_Password
submodule: Password Lifecycle (Set / Change / Forgot / Reset)
defaults:
  role: A_EMP
  perm: "None (anonymous, auth/password-recovery rate-limit policy - see individual case)"
  tenant: A
  pre: "QA stack running; Tenant A active; SMS provider configured as Fake (development returns an OTP in the response) or a QA-controlled real channel per test-data-spec.md."
  data: "See individual case; no real passwords/OTPs are stored in this file."
  sev: High
  reg: true

cases:
  - id: AUTH-PWD-SET-001
    func: [F-AUTH-18, F-AUTH-23]
    sc: Set initial password with a valid invitation
    t: A valid, unused invitation token sets the password and activates the account
    src: ["EmployeePortalAccountService.SetPasswordAsync"]
    type: Positive
    pri: P0
    sev: Critical
    role: Anonymous
    perm: "None (anonymous, auth rate-limit policy)"
    steps:
      - "[POST /api/auth/set-password] Send {token: <valid invitation token>, password/confirmPassword: <a policy-valid disposable QA password, both fields identical> => [200] 'Your password has been set. You can now sign in.'"
      - "[POST /api/auth/login] Sign in with the new password => [200]"
      - "[POST /api/auth/set-password] Reuse the same token again => [401] invalid/expired invite message"
    db: "UserInvitations.UsedAtUtc set; Users.PasswordHash changed; Users.IsActive=true; other pending invitations for the user revoked."
    auto: API
    ex: ["xU:EmployeePortalAccountServiceTests.Set_password_activates_account_and_makes_invitation_single_use"]

  - id: AUTH-PWD-SET-002
    func: [F-AUTH-18]
    sc: Invalid or expired invitation token
    t: Unknown, expired, used and revoked invitation tokens are all refused generically
    src: ["EmployeePortalAccountService.SetPasswordAsync (InvalidInviteMessage)"]
    type: Negative
    tags: [Security]
    pri: P0
    sev: Critical
    role: Anonymous
    steps:
      - "[POST /api/auth/set-password] Send a random token => [401] generic invalid-invite message"
      - "[POST /api/auth/set-password] Send an expired invitation's token => [401] same message"
      - "[POST /api/auth/set-password] Send an already-used invitation's token => [401] same message"
    sec: "No distinction between unknown/expired/used, avoiding invitation enumeration."
    auto: API

  - id: AUTH-PWD-SET-003
    func: [F-AUTH-23]
    sc: Password policy enforcement on set-password
    t: Passwords failing the complexity policy are rejected before the token is checked
    src: ["SetPasswordRequestValidator", "PasswordPolicy.IsValid"]
    type: Negative
    tags: [Validation, Boundary]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/set-password] Password 'short1A' (7 chars) => [400] policy message"
      - "[POST /api/auth/set-password] Password 'alllowercase1' (no upper) => [400]"
      - "[POST /api/auth/set-password] Password 'ALLUPPERCASE1' (no lower) => [400]"
      - "[POST /api/auth/set-password] Password 'NoDigitsHere' (no digit) => [400]"
      - "[POST /api/auth/set-password] Password exactly 8 chars meeting all classes (e.g. 'Qa123456') => passes validation"
      - "[POST /api/auth/set-password] Password of 128 chars meeting all classes => passes validation"
      - "[POST /api/auth/set-password] Password of 129 chars => [400] 'must not exceed 128 characters' (MaximumLength)"
    auto: API

  - id: AUTH-PWD-SET-004
    func: [F-AUTH-23, F-AUTH-18]
    sc: Confirm-password mismatch
    t: A mismatched confirmation is rejected without setting the password
    src: ["SetPasswordRequestValidator (ConfirmPassword.Equal)"]
    type: Negative
    tags: [Validation]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/set-password] password=<a policy-valid disposable QA password>, confirmPassword=<a different policy-valid disposable QA password> => [400] 'Passwords do not match.'"
      - "[POST /api/auth/login] Attempt to sign in with either value => [401] (nothing was set)"
    auto: API

  - id: AUTH-PWD-SET-005
    func: [F-AUTH-18, F-TEN-10]
    sc: Invitation token scoped to its tenant
    t: An invitation token issued in Tenant A cannot be redeemed at the Tenant B host
    src: ["EmployeePortalAccountService.SetPasswordAsync (shard.TenantId scoping)"]
    type: Tenant-Isolation
    tags: [Security]
    pri: P0
    sev: Critical
    tenant: A/B
    steps:
      - "[POST /api/auth/set-password] Present a valid Tenant A invitation token at the Tenant B host => [401] generic invalid-invite"
      - "[POST /api/auth/set-password] Present it at the Tenant A host => [200]"
    auto: API

  - id: AUTH-PWD-CHANGE-001
    func: [F-AUTH-17, F-AUTH-23]
    sc: Successful change of password
    t: A correct current password and a policy-valid new password change the password and end all sessions
    src: ["PasswordRecoveryService.ChangePasswordAsync"]
    type: Positive
    pri: P0
    sev: Critical
    role: A_EMP6 (disposable)
    perm: Authenticated
    steps:
      - "[POST /api/auth/login] Sign in as A_EMP6, keep T1 (access+refresh) => [200]"
      - "[POST /api/me/change-password] With T1 access token, send currentPassword=correct, newPassword='NewQa123!', confirmPassword='NewQa123!' => [200] 'Password changed successfully.'"
      - "[POST /api/auth/refresh] Refresh with T1.refreshToken => [401] (all sessions revoked)"
      - "[POST /api/auth/login] Sign in with the NEW password => [200]"
      - "[POST /api/auth/login] Sign in with the OLD password => [401]"
    db: "Users.PasswordHash changed; RefreshTokens for the user all revoked."
    auto: API
    ex: ["V:pages/ChangePasswordPage.test.tsx::submits the three password fields and signs the user out on success"]

  - id: AUTH-PWD-CHANGE-002
    func: [F-AUTH-17]
    sc: Wrong current password
    t: An incorrect current password is rejected and nothing changes
    src: ["PasswordRecoveryService.ChangePasswordAsync (hasher.Verify)"]
    type: Negative
    pri: P0
    role: A_EMP
    perm: Authenticated
    steps:
      - "[POST /api/me/change-password] currentPassword=wrong, newPassword='NewQa123!', confirmPassword='NewQa123!' => [401] 'Current password is incorrect.'"
      - "[POST /api/auth/login] Sign in with the original password => [200] (unchanged)"
    auto: API

  - id: AUTH-PWD-CHANGE-003
    func: [F-AUTH-17]
    sc: New password identical to current
    t: Reusing the current password as the new password is rejected
    src: ["PasswordRecoveryService.ChangePasswordAsync (hasher.Verify(newPassword))"]
    type: Negative
    tags: [Boundary]
    pri: P1
    role: A_EMP
    perm: Authenticated
    steps:
      - "[POST /api/me/change-password] currentPassword=correct, newPassword=SAME as current, confirmPassword=SAME => [400] 'New password must be different from the current password.'"
    auto: API

  - id: AUTH-PWD-CHANGE-004
    func: [F-AUTH-17, F-AUTH-23]
    sc: Change-password validation and policy
    t: Field requirements and the password policy are enforced on change-password
    src: ["ChangePasswordRequestValidator"]
    type: Negative
    tags: [Validation, Boundary]
    pri: P1
    role: A_EMP
    perm: Authenticated
    steps:
      - "[POST /api/me/change-password] Omit currentPassword => [400] field 'currentPassword'"
      - "[POST /api/me/change-password] newPassword fails policy (e.g. 'short') => [400] policy message"
      - "[POST /api/me/change-password] confirmPassword differs from newPassword => [400] 'Passwords do not match.'"
    auto: API
    ex: ["V:pages/ChangePasswordPage.test.tsx::validates the password policy before submitting"]

  - id: AUTH-PWD-CHANGE-005
    func: [F-AUTH-17]
    sc: Change-password requires authentication
    t: Change-password without a valid access token is refused
    src: ["MeController.ChangePassword [Authorize]"]
    type: Negative
    tags: [Security]
    pri: P0
    role: Anonymous
    perm: "Authenticated (endpoint requires a token; this case calls it without one)"
    steps:
      - "[POST /api/me/change-password] Call with no Authorization header => [401]"
    auto: API

  - id: AUTH-PWD-FORGOT-001
    func: [F-AUTH-19]
    sc: Forgot-password identifies a valid account
    t: A known identifier returns a challenge id and the tenant's enabled channels
    src: ["PasswordRecoveryService.IdentifyAsync"]
    type: Positive
    pri: P0
    role: Anonymous
    perm: "None (anonymous, password-recovery rate-limit policy)"
    pre: "Tenant A password recovery enabled with Email and/or SMS channels on; user has a verified contact for the enabled channel(s)."
    steps:
      - "[POST /api/auth/forgot-password] Send {identifier: A_EMP email} => [200] challengeId present, availableChannels non-empty, no maskedDestination values yet (masking happens at send-otp), message is the generic message"
    db: "PasswordResetOtps: one placeholder row per enabled channel, ExpiresAtUtc <= now (not yet 'sent')."
    auto: API
    ex: ["V:pages/ForgotPasswordPage.test.tsx::identifies an account, sends an OTP, and keeps recovery state in memory"]

  - id: AUTH-PWD-FORGOT-002
    func: [F-AUTH-19]
    sc: Forgot-password on an unknown identifier is indistinguishable from a known one
    t: An unknown identifier returns the same generic success response, revealing nothing
    src: ["PasswordRecoveryService.IdentifyAsync (user is null branch)"]
    type: Security
    tags: [Negative]
    pri: P0
    sev: Critical
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password] Send {identifier: 'no.such.user@qa.example'} => [200] same shape as AUTH-PWD-FORGOT-001 with channels empty or per configuration, same generic message"
      - "Compare with a known-but-recovery-disabled account => also [200] with the same generic message"
    sec: "No 404/401 distinguishes an existing account; no timing shortcut either (informational)."
    auto: API
    ex: ["V:pages/ForgotPasswordPage.test.tsx::shows the generic safe message when no channels are returned"]

  - id: AUTH-PWD-FORGOT-003
    func: [F-AUTH-19]
    sc: Recovery disabled for the tenant
    t: When PasswordRecoveryEnabled is false, forgot-password always returns an empty-channel generic success
    src: ["PasswordRecoveryService.IdentifyAsync (settings.PasswordRecoveryEnabled)"]
    type: Negative
    tags: [Configuration]
    pri: P1
    role: Anonymous
    pre: "Tenant A recovery settings: PasswordRecoveryEnabled=false (via PUT /api/tenants/current/password-recovery-settings), restore after."
    steps:
      - "[POST /api/auth/forgot-password] Send a known identifier => [200] availableChannels=[]"
      - "The frontend does not render the recovery form => confirmed via UI"
    auto: API + UI
    ex: ["V:pages/ForgotPasswordPage.test.tsx::does not render the recovery form when the tenant disables recovery"]

  - id: AUTH-PWD-FORGOT-004
    func: [F-AUTH-20]
    sc: Send OTP over email
    t: Requesting the email channel sends (or in dev, returns) a one-time code and masks the destination
    src: ["PasswordRecoveryService.SendCoreAsync", "IEmailSender"]
    type: Positive
    pri: P0
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password] Identify a known account => [200] challengeId"
      - "[POST /api/auth/forgot-password/send-otp] {challengeId, channel: Email} => [200] maskedDestination follows the a***b@domain pattern; developmentOtp present only outside Production"
    db: "PasswordResetOtps: OtpHash set, ExpiresAtUtc = now+OtpExpiryMinutes, ResendCount=0."
    sec: "Real email address never appears unmasked in the response."
    auto: API

  - id: AUTH-PWD-FORGOT-005
    func: [F-AUTH-20]
    sc: Send OTP over SMS
    t: Requesting the SMS channel uses the employee's trusted mobile number
    src: ["PasswordRecoveryService.TrustedMobileAsync"]
    type: Positive
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/send-otp] {challengeId, channel: Sms} for a user linked to an employee with a phone on file => [200] maskedDestination ends in the last 4 digits (******1234 pattern)"
      - "[POST /api/auth/forgot-password/send-otp] Same for a user with NO phone on file => [200] generic success but no code actually deliverable (record: no crash, no channel-availability leak)"
    auto: API
    ex: ["V:pages/ForgotPasswordPage.test.tsx::selects Mobile and sends the unwrapped challenge id with the Sms channel"]

  - id: AUTH-PWD-FORGOT-006
    func: [F-AUTH-20]
    sc: Resend cooldown
    t: Resending before the cooldown window is rejected; after it, a new code is issued
    src: ["PasswordRecoveryService.SendCoreAsync (OtpResendCooldownSeconds)"]
    type: Boundary
    tags: [Negative]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/send-otp] Request the first code => [200]"
      - "[POST /api/auth/forgot-password/resend-otp] Immediately resend => [400] 'Please wait before requesting another code.'"
      - "Wait until the configured cooldown elapses, then resend => [200] a new code is issued (ResendCount incremented)"
    db: "PasswordResetOtps.ResendCount, LastSentAtUtc."
    auto: API

  - id: AUTH-PWD-FORGOT-007
    func: [F-AUTH-20]
    sc: Max resends
    t: Exceeding OtpMaxResends is rejected even after the cooldown has elapsed
    src: ["PasswordRecoveryService.SendCoreAsync (existing.ResendCount >= settings.OtpMaxResends)"]
    type: Boundary
    tags: [Negative]
    pri: P2
    sev: Medium
    role: Anonymous
    pre: "Loop resend calls, waiting out the cooldown each time, until OtpMaxResends is reached."
    steps:
      - "[POST /api/auth/forgot-password/resend-otp] Resend OtpMaxResends times (waiting the cooldown between each) => each [200]"
      - "[POST /api/auth/forgot-password/resend-otp] One further resend => [400] 'Too many code requests. Please try again later.'"
    auto: API

  - id: AUTH-PWD-FORGOT-008
    func: [F-AUTH-21]
    sc: Verify OTP successfully
    t: The correct code within the expiry window returns a reset token
    src: ["PasswordRecoveryService.VerifyOtpAsync"]
    type: Positive
    pri: P0
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/verify-otp] {challengeId, otp: <correct code from dev response or QA inbox>} => [200] resetToken present, message 'Verification successful.'"
    db: "PasswordResetOtps.VerifiedAtUtc set."
    auto: API

  - id: AUTH-PWD-FORGOT-009
    func: [F-AUTH-21]
    sc: Wrong OTP and attempt limiting
    t: A wrong code is rejected and increments the attempt counter; the limit blocks further tries
    src: ["PasswordRecoveryService.VerifyOtpAsync (AttemptCount, OtpMaxAttempts default 5)"]
    type: Negative
    tags: [Boundary, Security]
    pri: P0
    sev: Critical
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/verify-otp] Send a wrong 6-digit code => [401] 'Invalid or expired verification code.'"
      - "Repeat the wrong code OtpMaxAttempts times total => each [401]"
      - "[POST /api/auth/forgot-password/verify-otp] Send the CORRECT code after the limit is reached => [401] (locked out, not just wrong)"
    db: "PasswordResetOtps.AttemptCount reaches OtpMaxAttempts."
    sec: "Brute-forcing a 6-digit OTP is bounded by attempt count, not just format."
    auto: API

  - id: AUTH-PWD-FORGOT-010
    func: [F-AUTH-21, F-AUTH-03]
    sc: OTP format validation
    t: A non-6-digit code is rejected by validation before any attempt is counted
    src: ["VerifyRecoveryOtpRequestValidator (Matches ^\\d{6}$)"]
    type: Negative
    tags: [Validation]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/verify-otp] otp='12345' (5 digits) => [400]"
      - "[POST /api/auth/forgot-password/verify-otp] otp='1234567' (7 digits) => [400]"
      - "[POST /api/auth/forgot-password/verify-otp] otp='12a456' (non-digit) => [400]"
      - "[POST /api/auth/forgot-password/verify-otp] otp='' => [400]"
    auto: API

  - id: AUTH-PWD-FORGOT-011
    func: [F-AUTH-21]
    sc: Expired OTP
    t: A code presented after ExpiresAtUtc is rejected
    src: ["PasswordRecoveryService.VerifyOtpAsync (row.ExpiresAtUtc <= now)"]
    type: Boundary
    tags: [Negative]
    pri: P1
    role: Anonymous
    pre: "DB-assisted: set the PasswordResetOtps row's ExpiresAtUtc to the past after requesting a code."
    steps:
      - "[POST /api/auth/forgot-password/verify-otp] Present the correct code after ExpiresAtUtc has passed => [401] 'Invalid or expired verification code.'"
    db: "PasswordResetOtps.ExpiresAtUtc edited to the past."
    auto: DB-assisted

  - id: AUTH-PWD-FORGOT-012
    func: [F-AUTH-22]
    sc: Reset password with a valid reset token
    t: A verified reset token sets the new password, ends all sessions and invalidates the token
    src: ["PasswordRecoveryService.ResetPasswordAsync"]
    type: Positive
    pri: P0
    sev: Critical
    role: Anonymous
    steps:
      - "[POST /api/auth/login] Sign in normally first to have a live session (for the revocation check) => [200] T1"
      - "[POST /api/auth/forgot-password/reset] {resetToken: <verified token>, newPassword: 'NewQa123!', confirmPassword: 'NewQa123!'} => [200] 'Password reset successful.'"
      - "[POST /api/auth/refresh] Refresh with T1.refreshToken => [401] (all sessions revoked)"
      - "[POST /api/auth/login] Sign in with the NEW password => [200]"
      - "[POST /api/auth/forgot-password/reset] Reuse the same reset token again => [401] 'Password reset is invalid or expired.'"
    db: "Users.PasswordHash changed; PasswordResetOtps.ConsumedAtUtc set; all RefreshTokens for the user revoked; other pending reset rows for the user revoked."
    auto: API
    ex: ["V:pages/SetPasswordPage.test.tsx"]

  - id: AUTH-PWD-FORGOT-013
    func: [F-AUTH-22, F-AUTH-23]
    sc: Reset-password validation and policy
    t: Field requirements, password policy and confirmation matching are enforced on reset
    src: ["ResetPasswordRequestValidator"]
    type: Negative
    tags: [Validation, Boundary]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password/reset] Omit resetToken => [400]"
      - "[POST /api/auth/forgot-password/reset] newPassword fails the policy => [400] policy message"
      - "[POST /api/auth/forgot-password/reset] confirmPassword mismatched => [400] 'Passwords do not match.'"
    auto: API

  - id: AUTH-PWD-FORGOT-014
    func: [F-AUTH-22]
    sc: Unverified reset token
    t: A reset token from a challenge whose OTP was never verified is refused
    src: ["PasswordRecoveryService.ResetPasswordAsync (VerifiedAtUtc != null filter)"]
    type: Negative
    tags: [Security]
    pri: P1
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password] Identify an account and obtain a challengeId, but do NOT verify an OTP => challenge exists, unverified"
      - "[POST /api/auth/forgot-password/reset] Attempt to reset using the challenge id in place of a reset token => [401]"
    auto: API

  - id: AUTH-PWD-FORGOT-015
    func: [F-AUTH-19, F-AUTH-20, F-AUTH-21, F-AUTH-22, F-TEN-10]
    sc: Forgot-password flow is tenant scoped end to end
    t: The whole forgot-password flow at Tenant A cannot identify, verify or reset a Tenant B account
    src: ["PasswordRecoveryService (CurrentTenantId scoping throughout)"]
    type: Tenant-Isolation
    tags: [Security]
    pri: P0
    sev: Critical
    tenant: A/B
    steps:
      - "[POST /api/auth/forgot-password] At the Tenant A host, identify using a Tenant B user's email => [200] generic success but availableChannels=[] (no match found in A)"
      - "[POST /api/auth/forgot-password/send-otp] Using the resulting challengeId at Tenant A => [200] generic no-op (no OTP actually issued, since no user matched)"
      - "Confirm no PasswordResetOtps row was created against the Tenant B user under Tenant A's context => none created"
    db: "No cross-tenant PasswordResetOtps row."
    auto: API
    ex: ["xU:PasswordRecoveryServiceTests.Tenant_context_prevents_a_challenge_from_being_used_for_another_tenant"]

  - id: AUTH-PWD-FORGOT-016
    func: [F-AUTH-20]
    sc: Email delivery failure is handled generically
    t: An SMTP delivery failure returns a safe generic response instead of an error revealing infrastructure
    src: ["PasswordRecoveryService.SendCoreAsync (catch EmailDeliveryException)"]
    type: Negative
    tags: [Security]
    pri: P1
    role: Anonymous
    pre: "Requires a QA configuration where SMTP is deliberately unreachable (isolated environment only, never the shared/dev SMTP account)."
    steps:
      - "[POST /api/auth/forgot-password/send-otp] Request the Email channel while SMTP is unreachable => [503] generic message (no SMTP host/port/exception detail)"
    sec: "No infrastructure detail (host, port, credentials) is exposed to the caller."
    auto: API
    ex: ["xU:PasswordRecoveryServiceTests.SMTP_delivery_failure_returns_generic_service_unavailable_result"]

  - id: AUTH-PWD-FORGOT-017
    func: [F-AUTH-20, F-AUTH-21, F-AUTH-22, F-AUTH-19]
    sc: Rate limiting on the recovery flow
    t: Repeated forgot-password calls are throttled per tenant+IP under the password-recovery policy
    src: ["PasswordRecoveryRateLimitSettings", "RateLimitingPolicies.PasswordRecovery"]
    type: Boundary
    tags: [Security]
    pri: P1
    role: Anonymous
    pre: "Use a disposable QA tenant so the throttle window does not block other cases; know the effective PermitLimit/WindowMinutes for the running environment."
    steps:
      - "[POST /api/auth/forgot-password] Send PermitLimit requests within the window => all [200]"
      - "[POST /api/auth/forgot-password] Send one more within the same window => [429] 'Too many attempts. Please wait a moment and try again.' with a Retry-After header"
      - "Wait for the window to elapse and retry => [200] again"
    auto: API
    ex: ["xU:PasswordRecoveryRateLimitTests.All_forgot_password_endpoints_use_the_password_recovery_policy", "xU:PasswordRecoveryRateLimitTests.Development_defaults_to_twenty_requests_per_one_minute", "xU:PasswordRecoveryRateLimitTests.Production_defaults_to_five_requests_per_ten_minutes"]

  - id: AUTH-PWD-FORGOT-018
    func: [F-AUTH-19]
    sc: Response headers on recovery endpoints
    t: "All forgot-password endpoints set Cache-Control: no-store"
    src: ["AuthController (Response.Headers.CacheControl = 'no-store')"]
    type: Security
    tags: [Configuration]
    pri: P2
    sev: Medium
    role: Anonymous
    steps:
      - "[POST /api/auth/forgot-password] Call and inspect response headers => Cache-Control: no-store"
      - "[POST /api/auth/forgot-password/send-otp] Same check => Cache-Control: no-store"
      - "[POST /api/auth/forgot-password/verify-otp] Same check => Cache-Control: no-store"
      - "[POST /api/auth/forgot-password/reset] Same check => Cache-Control: no-store"
      - "[POST /api/auth/set-password] Same check => Cache-Control: no-store"
    auto: API
