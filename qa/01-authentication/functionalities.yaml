# Functionality registry for Module 1 - Authentication & Tenant Security.
# Each functionality maps to UI, API, service, permission and DB impact. Test cases reference these ids
# through their `func` field; the builder fails if a case references an unknown id or a functionality has no case.
# Status vocabulary: Implemented | Partially implemented | Backend only | Needs clarification

functionalities:
  # ------------------------------------------------------------------ Tenant authentication
  - id: F-AUTH-01
    name: Tenant credential login (email identifier)
    group: Tenant Authentication
    status: Implemented
    ui: "/login (LoginPage)"
    api: "POST /api/auth/login"
    service: "AuthService.LoginAsync; LoginRequestValidator"
    permission: "Anonymous (rate limited: auth policy)"
    db: "Users (LastLoginDate), RefreshTokens (insert), Tenants, UserRoles, Roles, RolePermissions, Permissions"
  - id: F-AUTH-02
    name: Login identifier modes and employee-code login
    group: Tenant Authentication
    status: Implemented
    ui: "/login; /configuration/login-settings (TenantLoginSettingsPage)"
    api: "POST /api/auth/login; GET|PUT /api/tenants/current/login-settings"
    service: "AuthService.LoginAsync; TenantBrandingService"
    permission: "Anonymous (login); User.Edit (settings)"
    db: "TenantBranding.LoginIdentifierMode, AccountEmployeeCurrentLinks, Employees.EmployeeCode"
  - id: F-AUTH-03
