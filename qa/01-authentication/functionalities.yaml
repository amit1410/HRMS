    api: "Any [HasPermission] endpoint; GET /api/auth/me"
    service: "TenantScoped policy RequireClaim(permission); AuthService.GetCurrentUserAsync"
    permission: "Various"
    db: "UserRoles, RolePermissions, Users.IsActive"
