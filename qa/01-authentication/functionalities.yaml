    api: "Any authorized endpoint (probe GET /api/auth/me)"
    service: "AddJwtAuthentication (JwtBearer); TenantMatchesShardHandler"
    permission: "Authenticated"
    db: "none"
  - id: F-AUTH-08
    name: Refresh token issuance, storage and lifetime
    group: Tokens
    status: Implemented
    ui: "session.ts (localStorage key hrms.refreshToken.v1)"
    api: "POST /api/auth/login; POST /api/auth/refresh"
    service: "JwtTokenService.CreateRefreshToken/HashRefreshToken; AuthService.IssueTokensAsync"
    permission: "n/a"
    db: "RefreshTokens (TokenHash, TenantId, UserId, ExpiresAtUtc, RevokedAtUtc, ReplacedByTokenHash)"
  - id: F-AUTH-09
    name: Refresh rotation (single use)
    group: Tokens
    status: Implemented
    ui: "api/client.ts refreshSession"
    api: "POST /api/auth/refresh"
    service: "AuthService.RefreshAsync"
    permission: "Anonymous (rate limited)"
    db: "RefreshTokens (old row RevokedAtUtc + ReplacedByTokenHash, new row)"
  - id: F-AUTH-10
    name: Refresh replay and theft response (all-session revocation)
    group: Tokens
    status: Implemented
    ui: "session ends on refresh failure"
    api: "POST /api/auth/refresh"
    service: "AuthService.RefreshAsync; RevokeAllActiveTokensForUserAsync"
    permission: "Anonymous"
    db: "RefreshTokens (all active rows for the user revoked)"
  - id: F-AUTH-11
    name: Concurrent refresh race handling
    group: Tokens
    status: Implemented
    ui: "single-flight refresh in api/client.ts (per tab only)"
    api: "POST /api/auth/refresh"
    service: "AuthService.RefreshAsync (conditional ExecuteUpdate)"
    permission: "Anonymous"
    db: "RefreshTokens (conditional UPDATE ... WHERE RevokedAtUtc IS NULL)"
  - id: F-AUTH-12
    name: Refresh token host and tenant binding
    group: Tokens
    status: Implemented
    ui: "n/a"
    api: "POST /api/auth/refresh"
    service: "AuthService.RefreshAsync (shard vs token tenant; caller tenant vs token tenant)"
