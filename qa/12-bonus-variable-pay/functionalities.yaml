# Functionality registry for Module 12 - Bonus, Incentives & Variable Pay (phase 7Q: tenant-scoped
# variable-pay plans, effective-dated Published plan versions, eligibility/salary-basis/proration-driven
# award calculation and generation, tenant/year award numbering, Draft-skipping Submit/Approve/Reject
# lifecycle, manual override, Payroll/Final-Settlement settlement recording, the paginated award register,
# the dedicated Payroll Reports variable-pay export, Authorization/Scope, Tenant Isolation, Audit/History,
# SQL Server/MySQL Provider Parity, Large Data/Paging, and Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id. IDs are allocated in one global sequence (F-VPAY-001...) in
# the order the case files below were authored - group boundaries are noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): GL/accounting journal generation for variable pay is
# OUT of scope, for the identical reason qa/10-payroll excluded all of Payroll Accounting/GL Posting
# (phase 7i) and qa/11-loans-advances excluded Loan GL journal generation - it is a separate,
# self-contained ledger-posting concern. Unlike Loans, there is not even a dedicated PayrollGLMappingType
# for variable pay to configure (grep-verified against PayrollAccountingService.cs's supportedMapping
# switch, full list read) - a variable-pay Final Settlement line only ever surfaces generically as
# FinalSettlementLineType.Bonus, with no variable-pay-specific GL account mapping type anywhere in the
# codebase. Full Performance Management/KPI/OKR calculation, sales commission engines, ESOP/RSU/equity
# compensation, and arbitrary formula scripting are explicitly deferred per docs/phase-7q-bonus-
# incentives-variable-pay.md and are not testable, not a gap in this module's own execution.
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc;
# docs/phase-7q-bonus-incentives-variable-pay.md was read and current code wins wherever they diverge,
# per CLAUDE.md):
#   Backend/HRMS.API/Controllers/VariablePayController.cs (also hosts the /api/me/variable-pay* ESS routes)
#   Backend/HRMS.Application/Services/VariablePayService.cs (read in full)
#   Backend/HRMS.Application/Abstractions/IVariablePayService.cs
#   Backend/HRMS.Application/DTOs/Payroll/VariablePayDtos.cs (read in full)
#   Backend/HRMS.Domain/Entities/VariablePay.cs (VariablePayPlan, VariablePayPlanVersion, VariablePayAward,
#     VariablePaySettlement, VariablePayAwardHistory, VariablePayNumberSequence - read in full)
#   Backend/HRMS.Domain/Enums/VariablePayEnums.cs (read in full)
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Permissions.Payroll.VariablePay* block, ids 169-177)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/VariablePayConfiguration.cs (read in full -
#     unique indexes: (TenantId,Code), (TenantId,AwardNumber), (TenantId,EmployeeId,PlanVersionId,
#     AwardPeriodFrom,AwardPeriodTo), (TenantId,AwardId,SettlementType,PayrollRunId,FinalSettlementId))
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap for every seeded role,
#     read in full - grep-verified for every VariablePay* permission constant)
#   Backend/HRMS.Application/Services/PayrollRetroSettlementService.cs (CalculateSettlementAsync /
#     TransitionSettlementAsync's Final Settlement variable-pay line generation and finalization - read
#     in full); PayrollCalculationEngine.cs (full grep for "VariablePay" - ZERO matches, see F-VPAY-063)
#   Backend/HRMS.Application/Services/PayrollReportsService.cs / IPayrollReportsService.cs (GetVariablePayAsync
#     register + CSV export), PayrollReportsController.cs; PayrollAnalyticsService.cs (VariablePay
#     reconciliation-source findings, DuplicateVariablePaySettlement check)
#   Frontend/HRMS.Web/src/pages/payroll/VariablePayPage.tsx (VariablePayPage + MyVariablePayPage),
#     VariablePayPage.test.tsx, src/api/variablePay.ts (read in full)
#   Existing xUnit (VariablePayFoundationTests, VariablePayConcurrencyTests, VariablePayLargeDataTests,
#     PayrollVariablePayProviderAcceptance, SqlServerPayrollVariablePayIntegrationTests,
#     MySqlPayrollVariablePayIntegrationTests - all read in full, 139 combined lines; not individually
#     classified, per the qa/10-payroll/qa/11-loans-advances precedent explained in README.md) and
#     VariablePayPage.test.tsx (Vitest, read in full).
#
# -- Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) --
# CR-201: CONFIRMED CRITICAL SOURCE-LEVEL DEFECT - OverrideAsync loads the award via AsNoTracking(), never
# calls Update/Attach/ExecuteUpdate on it, and its AddHistory helper only appends to the award's in-memory
# History collection (never db.VariablePayAwardHistories.Add(...)) - so the subsequent SaveChangesAsync()
# has nothing pending in the change tracker and persists NOTHING, while the method still returns
# Result.Success with a DTO showing the overridden amount/status as if the write succeeded. No existing
# xUnit test ever calls OverrideAsync (grep-verified across all six existing VariablePay test files), so
# this silent no-op has never been exercised.
# CR-202: grep-verified against SeedData.cs's RolePermissionMap - NO seeded role other than SuperAdmin and
# TenantAdmin (both via Permissions.All) holds ANY Payroll.VariablePay.* permission, the identical shape to
# qa/11-loans-advances' CR-183.
# CR-203: CONFIRMED FRONTEND DEFECT - src/api/variablePay.ts's listMyVariablePay is typed to return
# VariablePayAward[], but /api/me/variable-pay actually returns a PagedResult<VariablePayAward> (identical
# shape to the admin register endpoint); MyVariablePayPage calls awards.data?.map(...) directly, which
# throws at runtime against the real API response. The existing Vitest coverage never catches this because
# its mock resolves a raw array instead of the real paged envelope.
# CR-204: ApproveAsync's self-approval guard reads only award.SubmittedByUserId (null unless Submit was
# called), never award.CreatedByUserId, and Approve accepts status Calculated directly - so the same user
# who generated an award can immediately Approve it, skipping Submit, and the self-approval check never
# fires because SubmittedByUserId is still null.

functionalities:
  # =========================== A. VARIABLE-PAY PLANS AND PLAN VERSIONS ===========================
  - id: F-VPAY-001
    name: List variable-pay plans for the tenant with their versions, ordered by Code
    group: Plans and Plan Versions
    status: Implemented
    ui: VariablePayPage
    api: "GET /api/payroll/variable-pay-plans"
    service: "VariablePayService.GetPlansAsync"
    permission: "Payroll.VariablePay.View"
    db: VariablePayPlans, VariablePayPlanVersions

  - id: F-VPAY-002
    name: Create a plan - Code and Name are required, else Invalid
    group: Plans and Plan Versions
    status: Implemented
    ui: VariablePayPage
    api: "POST /api/payroll/variable-pay-plans"
    service: "VariablePayService.CreatePlanAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans

  - id: F-VPAY-003
    name: Plan Code is trimmed and must be unique per tenant, else Conflict
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans"
    service: "VariablePayService.CreatePlanAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans

  - id: F-VPAY-004
    name: "CurrencyCode is upper-cased and trimmed on both create and update; CreatePlanAsync does NOT auto-generate any initial VariablePayPlanVersion, unlike Loans' CreateProductAsync (contrast with qa/11-loans-advances F-LOAN-006) - a freshly created plan has zero versions and cannot generate an award until AddVersionAsync is called separately"
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans"
    service: "VariablePayService.CreatePlanAsync (full method - no VariablePayPlanVersions.Add call)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans

  - id: F-VPAY-005
    name: Update requires the plan to exist in the tenant, else NotFound; updates Name/Description/IsActive/CurrencyCode and increments ConcurrencyVersion
    group: Plans and Plan Versions
    status: Implemented
    api: "PUT /api/payroll/variable-pay-plans/{id}"
    service: "VariablePayService.UpdatePlanAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans

  - id: F-VPAY-006
    name: "UpdatePlanAsync does not re-validate or re-check Code uniqueness (Code itself is not even settable via VariablePayPlanRequest.Code being ignored on update) and never touches any VariablePayPlanVersion row"
    group: Plans and Plan Versions
    status: Implemented
    api: "PUT /api/payroll/variable-pay-plans/{id}"
    service: "VariablePayService.UpdatePlanAsync (full method)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans

  - id: F-VPAY-007
    name: AddVersionAsync requires the owning plan to exist in the tenant, else NotFound
    group: Plans and Plan Versions
    status: Implemented
    ui: VariablePayPage
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayService.AddVersionAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions

  - id: F-VPAY-008
    name: "ValidateVersion rejects EffectiveTo<EffectiveFrom, Percentage/TargetPercentage outside [0,100], negative FixedAmount/MinimumAmount/MaximumAmount, MaximumAmount<MinimumAmount, negative or inverted PerformanceMultiplierMinimum/Maximum, PayoutMonth outside [1,12], and TaxablePercentage outside [0,100] - each returns Invalid"
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayService.ValidateVersion"
    permission: "Payroll.VariablePay.ManagePlans"
    db: "n/a"

  - id: F-VPAY-009
    name: "A new version whose date range overlaps an existing Published version of the same plan is rejected (Conflict) - only Published versions are checked for overlap, so a Draft, Inactive, or Superseded version's range never blocks a new one"
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayService.AddVersionAsync -> Overlaps"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions

  - id: F-VPAY-010
    name: "VariablePayPlanVersionRequest.Status defaults to Published - a caller who omits Status creates an immediately-usable, award-eligible version with no separate activation step"
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayPlanVersionRequest.Status default"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions.Status

  - id: F-VPAY-011
    name: "VariablePayPlanVersionStatus.Inactive and Superseded are declared lifecycle states that no method in VariablePayService ever assigns - only Draft (via an explicit Status=Draft request) and Published are ever written"
    group: Plans and Plan Versions
    status: Implemented
    service: "VariablePayService.cs (full grep for VariablePayPlanVersionStatus.Inactive / .Superseded - zero matches)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions.Status

  - id: F-VPAY-012
    name: A version persists CalculationMethod, SalaryBasisType, Percentage/FixedAmount/TargetPercentage, Minimum/MaximumAmount, PerformanceMultiplier bounds, ProrationMethod, EligibilityMethod, MinimumServiceMonths, PayoutFrequency/Month, TaxTreatment/TaxablePercentage, FinalSettlementTreatment, RequiresApproval, AllowManualOverride, PerformanceRatingRequired, SelectedSalaryComponentIdsJson and ApplicabilityJson verbatim
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayService.AddVersionAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions

  - id: F-VPAY-013
    name: "RequiresApproval is persisted on the version but is never read anywhere in VariablePayService (full grep) - the Submit/Approve/Reject lifecycle behaves identically regardless of its value, so a plan configured with RequiresApproval=false still requires an explicit Approve call to reach Approved"
    group: Plans and Plan Versions
    status: Implemented
    service: "VariablePayService.cs (full grep for RequiresApproval - only the DTO/entity assignment, never read in TransitionAsync/ApproveAsync)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions.RequiresApproval

  - id: F-VPAY-014
    name: A cross-tenant plan id on update/add-version is NotFound, not Forbidden
    group: Plans and Plan Versions
    status: Implemented
    api: "PUT /api/payroll/variable-pay-plans/{id}"
    service: "VariablePayService.cs (TenantId filter)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans (TenantId filter)

  - id: F-VPAY-015
    name: "SelectedSalaryComponentIdsJson is free-form JSON accepted verbatim on the version with no server-side validation that the referenced SalaryComponent ids exist or belong to the tenant at version-creation time - invalid ids only surface later, when ResolveSalaryBasisAsync deserializes them for a SelectedSalaryComponents-basis award"
    group: Plans and Plan Versions
    status: Implemented
    api: "POST /api/payroll/variable-pay-plans/{id}/versions"
    service: "VariablePayService.AddVersionAsync (no SalaryComponent existence check)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions.SelectedSalaryComponentIdsJson

  - id: F-VPAY-016
    name: "AddVersionAsync has no MaxConcurrentXxx-equivalent cap and no limit on the number of versions a plan may accumulate - unlike Loans, there is no analogous per-employee concurrency cap concept in Variable Pay at all"
    group: Plans and Plan Versions
    status: Implemented
    service: "VariablePayService.AddVersionAsync"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlanVersions

  - id: F-VPAY-017
    name: IsActive=false on the plan header is never read as an eligibility gate anywhere except inside CalculateCoreAsync's own version-lookup predicate (x.VariablePayPlan!.IsActive) - an inactive plan's Published version cannot be matched for a new award, but existing already-generated awards under it are unaffected
    group: Plans and Plan Versions
    status: Implemented
    service: "VariablePayService.CalculateCoreAsync (version lookup predicate)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans.IsActive

  - id: F-VPAY-018
    name: PlanType is a free descriptive classification (FixedBonus/PercentageOfSalary/TargetVariablePay/PerformanceLinked/OneTimeAward/RecurringVariableAllowance/DiscretionaryAward) that is never itself read by CalculateCoreAsync - only the version's own CalculationMethod drives the actual award formula, so PlanType and CalculationMethod can be configured inconsistently (e.g. a PlanType.FixedBonus plan whose version uses CalculationMethod.TargetWithMultiplier)
    group: Plans and Plan Versions
    status: Implemented
    service: "VariablePayService.cs (full grep for PlanType usage outside DTO mapping)"
    permission: "Payroll.VariablePay.ManagePlans"
    db: VariablePayPlans.PlanType

  # =========================== B. ELIGIBILITY, SALARY BASIS AND AWARD GENERATION ===========================
  - id: F-VPAY-019
    name: Preview and Generate both require AwardPeriodFrom<=AwardPeriodTo and neither may be the DateOnly default, else Invalid
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    ui: VariablePayPage
    api: "POST /api/payroll/variable-pay-awards/generate-preview, /generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.Calculate, Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-020
    name: The referenced plan version must resolve to a Published version whose EffectiveFrom<=EligibilityDate and EffectiveTo (if set) >=EligibilityDate, on a plan with IsActive=true, else Invalid - a Draft/Inactive/Superseded version or one outside the eligibility date never resolves
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync (version lookup)"
    permission: "Payroll.VariablePay.CreateAward"
    db: VariablePayPlanVersions

  - id: F-VPAY-021
    name: The target employee must exist in the tenant, else NotFound
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: Employees

  - id: F-VPAY-022
    name: "EligibilityMethod.ActiveEmployment requires Employee.Status==Active as of generation time, else Invalid - unlike Loans' CreateLoanAsync (qa/11-loans-advances CR-199), Variable Pay DOES gate award generation on employment status when this eligibility method is configured"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: Employees.Status

  - id: F-VPAY-023
    name: "EligibilityMethod.MinimumService requires MinimumServiceMonths to be set and DateOfJoining+MinimumServiceMonths<=EligibilityDate, else Invalid; EligibilityMethod.ConfiguredApplicability and .ManualReview are declared but have no distinct enforcement branch in CalculateCoreAsync - both fall through identically to the same code path as ActiveEmployment/MinimumService checks (whichever MinimumServiceMonths happens to be set), i.e. they are not independently implemented eligibility rules"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.CalculateCoreAsync (full grep for EligibilityMethod branches - only ActiveEmployment is explicitly switched on; MinimumServiceMonths check applies whenever set, independent of EligibilityMethod's own value)"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-024
    name: "ApplicabilityJson is persisted on the version but is never read anywhere in CalculateCoreAsync (full grep) - a version configured with a restrictive ApplicabilityJson filter (e.g. department/designation scoping) does not actually restrict which employees can be awarded"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.cs (full grep for ApplicabilityJson - only assigned in AddVersionAsync/ToPlanDto-adjacent mapping, never read in CalculateCoreAsync)"
    permission: "Payroll.VariablePay.CreateAward"
    db: VariablePayPlanVersions.ApplicabilityJson

  - id: F-VPAY-025
    name: "ResolveSalaryBasisAsync for SalaryBasisType.FixedConfiguredAmount short-circuits to 0m without requiring a salary assignment; Basis/Gross/SelectedSalaryComponents all require an Active EmployeeSalaryAssignment effective on EligibilityDate, else Invalid (No effective salary assignment)"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.ResolveSalaryBasisAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: EmployeeSalaryAssignments

  - id: F-VPAY-026
    name: "SalaryBasisType.Basic is a declared enum member that ResolveSalaryBasisAsync never explicitly branches on - it falls through to the final catch-all `Invalid(\"This salary basis requires configured salary component IDs.\")`, an incorrect/misleading error message for a basis that has nothing to do with SelectedSalaryComponentIds"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveSalaryBasisAsync (full method - no `if (SalaryBasisType.Basic)` branch)"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-027
    name: "SalaryBasisType.Gross resolves to assignment.MonthlyCtc, falling back to AnnualCtc/12 only when MonthlyCtc is null, and to 0 if both are null"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveSalaryBasisAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: EmployeeSalaryAssignments.MonthlyCtc, AnnualCtc

  - id: F-VPAY-028
    name: "SalaryBasisType.SelectedSalaryComponents deserializes SelectedSalaryComponentIdsJson and sums OverrideValue across the assignment's own active components matching those ids; an empty/unset ids array returns Invalid, and a component present on SelectedSalaryComponentIdsJson but absent or inactive on the specific employee's own assignment simply contributes 0 rather than erroring"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveSalaryBasisAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: EmployeeSalaryAssignmentComponents

  - id: F-VPAY-029
    name: "ResolveProration returns 1 unconditionally for ProrationMethod.None; for every other method it clips [joining,leaving] against [AwardPeriodFrom,AwardPeriodTo], returning 0 when the clipped range is inverted (no eligible days at all)"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveProration"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-030
    name: "ProrationMethod.CalendarDays, ServiceDays and EligibleDaysInPeriod all share the identical day-ratio calculation ((eligible days)/(total period days)) in ResolveProration - despite being three distinct declared enum values, there is only one actual day-ratio code path, so all three produce numerically identical proration for the same inputs"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveProration (full method - single ternary branches only CompletedMonths out from the day-ratio default)"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-031
    name: ProrationMethod.CompletedMonths computes a distinct month-count ratio (completed months in the eligible range over total months in the award period), clamped to [0,1]
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.ResolveProration"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-032
    name: "A PerformanceMultiplier is required (Invalid) whenever the version's PerformanceRatingRequired flag is set and the request omits one; when PerformanceRatingRequired is false and none is supplied, the multiplier silently defaults to 1"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-033
    name: "A supplied PerformanceMultiplier outside [PerformanceMultiplierMinimum, PerformanceMultiplierMaximum] (when either bound is configured) or negative is rejected as Invalid, independent of PerformanceRatingRequired"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-034
    name: "CalculationMethod.FixedAmount uses version.FixedAmount (defaulting to 0 if unset); .PercentageOfSalary uses basis*Percentage/100; .TargetWithMultiplier uses (basis*TargetPercentage/100)*multiplier; .ManualAmount uses request.ManualAmount (defaulting to 0) and additionally requires a non-blank Reason, else Invalid"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-035
    name: The raw calculated amount is multiplied by the proration factor, then clamped to [MinimumAmount, MaximumAmount] (whichever bounds are configured), then floored at 0 and rounded to 2 decimals (AwayFromZero)
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: "n/a"

  - id: F-VPAY-036
    name: "PreviewAsync runs the identical CalculateCoreAsync path with persist=false - it returns AwardNumber literally set to the string \"PREVIEW\" and never touches the database (no award, sequence, or history row is written)"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    ui: VariablePayPage
    api: "POST /api/payroll/variable-pay-awards/generate-preview"
    service: "VariablePayService.PreviewAsync -> CalculateCoreAsync(persist:false)"
    permission: "Payroll.VariablePay.Calculate"
    db: "n/a"

  - id: F-VPAY-037
    name: "GenerateAsync is idempotent per (TenantId, EmployeeId, PlanVersionId, AwardPeriodFrom, AwardPeriodTo) - a repeated call with identical parameters returns the pre-existing award unchanged (Success, message 'Existing idempotent award returned.') rather than creating a duplicate or erroring, matching the DB's own unique index on that key"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: VariablePayAwards (unique index)

  - id: F-VPAY-038
    name: "AwardNumber is generated as VPA/{year}/{value:000000} from a per-tenant, per-year VariablePayNumberSequence seeded at 1 and incremented on every successful new-award generation (year taken from AwardPeriodFrom.Year, not EligibilityDate.Year)"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.NextAwardNumberAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: VariablePayNumberSequences, VariablePayAwards.AwardNumber

  - id: F-VPAY-039
    name: "A newly generated award is created directly at Status=Calculated (never Draft, despite VariablePayAwardStatus declaring Draft as its first member) and both an AwardGenerated and an AwardCalculated VariablePayAwardHistory row are appended in the same call"
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "POST /api/payroll/variable-pay-awards/generate"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.CreateAward"
    db: VariablePayAwards.Status, VariablePayAwardHistories

  - id: F-VPAY-040
    name: The award snapshots SalaryBasisAmount, TargetAmount, PerformanceMultiplier, ProrationFactor, CalculatedAmount and CurrencyCode (from the plan) at generation time, independent of any later change to the plan/version/salary assignment
    group: Eligibility, Salary Basis and Award Generation
    status: Implemented
    api: "GET /api/payroll/variable-pay-awards/{id}"
    service: "VariablePayService.CalculateCoreAsync"
    permission: "Payroll.VariablePay.View"
    db: VariablePayAwards

  - id: F-VPAY-041
    name: "SetTaxSplit computes TaxableAmount/NonTaxableAmount from the version's TaxTreatment (Taxable=100% taxable, NonTaxable=0% taxable, PartiallyTaxable=TaxablePercentage%) applied to the approved-or-calculated amount, at generation time (before any approval has happened) - so a freshly Calculated award already carries a provisional tax split that Approve later recomputes and overwrites from the same version"
