# Functionality registry for Module 7 - Leave Management (Types, Policies, Periods, Eligibility,
# Entitlement/Accrual, Balances, Requests, Working Days, Approval, Comp Off, Calendar, Dashboard,
# Reports, Reminder Worker, Authorization/Scope, Tenant Isolation, Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id.
#
# Discovered implementation (authoritative source, read directly - not assumed from docs/ or the
# brief's example list; docs/phase-4*.md were read but current code wins wherever they diverge):
#   Backend/HRMS.API/Controllers/LeaveTypesController.cs, LeavePoliciesController.cs,
#     LeavePeriodsController.cs, LeaveRequestsController.cs, LeaveApprovalsController.cs,
#     LeaveRequestOptionsController.cs, LeaveBalanceSummaryController.cs,
#     LeaveBalanceImportsController.cs, LeaveCalendarController.cs, HrLeaveDashboardController.cs,
#     LeaveReportsController.cs, LeaveWorkingDayConfigurationController.cs, CompOffController.cs
#   Backend/HRMS.Application/Services/LeaveConfigurationService.cs, LeavePolicyFoundationService.cs,
#     LeavePolicyResolver.cs, LeavePeriodResolver.cs, LeaveRequestValidationService.cs,
#     LeaveRequestSubmissionService.cs, LeaveRequestSubmissionRetryPolicy.cs,
#     LeaveRequestApprovalService.cs, LeaveApprovalReadService.cs, LeaveRequestCancellationService.cs,
#     LeaveRequestWithdrawalService.cs, LeaveBalanceAccountingService.cs, LeaveAccrualProcessor.cs,
#     LeaveEntitlementExpiryProcessor.cs, LeavePeriodCloseProcessor.cs, LeaveApprovalReminderProcessor.cs,
#     LeaveNotificationService.cs, LeaveWorkingDayConfigurationService.cs, LeaveCalendarService.cs,
#     HrLeaveDashboardService.cs, LeaveReportService.cs, LeaveBalanceImportService.cs,
#     LeaveBalanceSummaryReader.cs, LeaveRequestReadService.cs, LeaveAuthorizationService.cs,
#     CompOffService.cs
#   Backend/HRMS.Infrastructure/Accrual/LeaveAccrualWorker.cs, Reminders/LeaveApprovalReminderWorker.cs
#   Backend/HRMS.Infrastructure/Persistence/MySqlLeaveRequestSubmissionLock.cs,
#     SqlServerLeaveRequestSubmissionLock.cs, SqlServerLeaveRequestSubmissionDeadlockClassifier.cs
#   Backend/HRMS.Domain/Entities/LeavePolicyFoundation.cs, LeaveRequestFoundation.cs,
#     LeaveBalanceFoundation.cs, LeaveEntitlementGrant.cs, LeaveBalanceReservationAllocation.cs,
#     LeaveAccrualOccurrence.cs, LeavePeriodCloseOccurrence.cs, LeaveReminderDelivery.cs,
#     LeaveWorkingDayCalendar.cs, CompOff.cs
#   Backend/HRMS.Domain/Enums/LeaveRequestEnums.cs, LeavePolicyEnums.cs, LeaveBalanceEnums.cs,
#     CompOffEnums.cs
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Leave.*, Attendance.CompOff*)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap - see CR-78, CR-79, CR-80)
#   Frontend/HRMS.Web/src/api/leaveConfiguration.ts, leaveRequests.ts, leaveBalances.ts,
#     leaveBalanceImport.ts, leaveCalendar.ts, leaveDashboard.ts, leaveReports.ts,
#     leaveWorkingDayCalendar.ts, compOff.ts
#   Frontend/HRMS.Web/src/pages/leave/*.tsx, pages/attendance/CompOffPage.tsx,
#     pages/attendance/CompOffOperationsPage.tsx
#   Existing xUnit (58 classes touching this surface) and Vitest (test files alongside every page/
#     api client above) - see README.md's Existing Test Mapping section; none are cited per-case via
#     `ex:` in this module because exact method-name verification against every referenced file was not
#     completed with the same certainty as Module 6's per-case links - see clarifications.yaml note.
#
# ── The real implementation is a deliberately restricted MVP wearing a much larger configuration UI ──
# LeaveRequestValidationService.ValidateSupportedPolicy (the single gate every preview/submit passes
# through) HARD-REJECTS any resolved policy rule where: RequestRule.PartialDayMode is HalfDayAllowed
# (not FullDayOnly); CalendarRule.SandwichMode is anything but Disabled, or ApplyToPrefix/Suffix/Between
# is true; AttachmentRule.AttachmentRequirement is anything but None; or a Clubbing rule of type
# NotAllowed references the resolved rule (either side). Every one of these is fully configurable,
# without warning, through the Policy Editor UI (LeavePolicyRequestRulesSection.tsx,
# LeavePolicyCalendarSection.tsx, LeavePolicyAttachmentSection.tsx, LeavePolicyClubbingSection.tsx) and
# through LeavePolicyFoundationService.ValidateForPublishAsync (which never checks any of this before
# allowing Publish). A policy published with any of these settings becomes entirely unusable for real
# leave requests - see CR-81.
#
# ── The second-highest-impact finding: three independent, non-communicating manager/scope mechanisms ──
# carried forward from CR-57 (Module 5/6) plus a NEW one specific to Leave: LeaveAuthorizationService
# .BuildCurrentManagerPredicate/CanAccessEmployeeAsync resolves "is the caller this employee's manager"
# directly off EmployeeEmploymentHistory.ManagerId - a THIRD mechanism distinct from both
# RoleScopeResolver (Module 6) and EmployeeAccessScopeService's Attendance-permission-keyed narrowing
# (Module 5/6, CR-57). Several Leave services (LeaveRequestApprovalService, LeaveApprovalReadService,
# LeaveCalendarService) additionally carry a parallel "legacy" code path used when ILeaveAuthorizationService
# is not registered in DI, with DIFFERENT visible behavior from the "new" path - see CR-77, CR-83, CR-84.

