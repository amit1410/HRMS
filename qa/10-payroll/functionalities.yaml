    status: Implemented
    api: "GET /api/payroll/salary-components/{id}/history"
    service: "SalaryComponentService.GetHistoryAsync"
    permission: "Payroll.SalaryComponent.ViewHistory"
    db: SalaryComponentHistories

  - id: F-PAY-016
    name: "A cross-tenant salary-component id (GET/PUT/activate/history) is NotFound, not Forbidden"
    group: Salary Component Master
    status: Implemented
    api: "GET/PUT /api/payroll/salary-components/{id}"
    service: "SalaryComponentService.cs (TenantId filter)"
