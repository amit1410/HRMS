# Functionality registry for Module 10 - Payroll (Salary Component Master, Salary Structures/Versions,
# Employee Salary Assignment, Payroll Periods/Runs, Calculation Engine, Recalculation/Off-Cycle/Adjustments/
# Reversals, Payroll Results/Errors/Outputs, Reimbursements/Claims, Payroll Settlement (Retro + Final
# Settlement), Payroll Inputs (bulk imports), Authorization/Scope, Tenant Isolation/Audit/Reports,
# SQL Server/MySQL Provider Parity, Large Data, Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id. IDs are allocated in one global sequence (F-PAY-001...) in
# the order the case files below were authored - group boundaries are noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): Payroll is the largest domain in the product (24
# docs/phase-7a...7y.md design docs). This module deliberately covers the areas explicitly requested -
# Salary Component/Structure masters, Employee Salary Assignment, Payroll Periods/Runs, the Calculation
# Engine (earnings/deductions/proration/statutory integration), Recalculation/Off-Cycle/Adjustments/
# Reversals, Payroll Results/Errors/Outputs (payslips/register), Reimbursements/Claims, Payroll Settlement
# (Retro cases + Final Settlement), Payroll Inputs (bulk CSV correction imports, tightly coupled to
# recalculation), Authorization/Tenant Isolation/Audit/Reports/Provider Parity/Large Data/Frontend - and
# explicitly EXCLUDES, as out-of-scope carry-forwards for a future module: Loans/Salary Advances (phase
# 7n), Bonus/Variable Pay (7q), Statutory Calculation Configuration/Compliance Returns/Filing (7f/7k/7x -
# StatutoryPayrollService's employee-profile/config CRUD is IN scope here only insofar as it feeds the
# Calculation Engine's statutory deduction step; PayrollStatutoryComplianceService/StatutoryFilingService
# and their controllers are NOT), Bank Advice/Payment Processing (7h), Payroll Accounting/GL Posting (7i),
# Payroll Controls/Production-Readiness/UAT/Production-Closure (7l/7m/7y - PayrollControlService's own
# maker-checker CONFIGURATION is covered narrowly because PayrollApprovalGuard consumes it everywhere),
# Employee Tax Declarations (7u), and Year-End Tax Processing (7w). Gratuity/Separation Benefits (7p) is
# already fully covered by qa/09-separation (Separation_Benefits sheet) and is not duplicated here.
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc; every
# doc/phase-7*.md was read where relevant and current code wins wherever they diverge, per CLAUDE.md):
#   Backend/HRMS.API/Controllers/SalaryComponentsController.cs, SalaryStructuresController.cs,
#     EmployeeSalaryAssignmentsController.cs, PayrollPeriodsController.cs, PayrollRunsController.cs,
#     PayrollOperationsController.cs, PayrollOffCycleController.cs, PayrollAdjustmentsController.cs,
#     PayrollReversalsController.cs, PayrollOutputsController.cs (also hosts MyPayslipsController),
#     ReimbursementsController.cs, PayrollInputsController.cs (also hosts PayrollInputTemplatesController),
#     PayrollAnalyticsController.cs (also hosts PayrollExceptionsController/PayrollReconciliationController/
#     PayrollAnalyticsControlsController), PayrollReportsController.cs, StatutoryPayrollController.cs,
#     PayrollControlsController.cs, and the PayrollRetroSettlementController nested in PayrollOutputsController.cs
#   Backend/HRMS.Application/Services/SalaryComponentService.cs, SalaryStructureService.cs,
#     EmployeeSalaryAssignmentService.cs, PayrollPeriodService.cs, PayrollRunService.cs,
#     PayrollCalculationEngine.cs (+ PayrollCalculationService, PayrollFormula), PayrollRoundingPolicy.cs,
#     PayrollApprovalGuard.cs, PayrollReadinessService.cs, PayrollAdjustmentService.cs, PayrollOutputService.cs,
#     ReimbursementService.cs, ReimbursementPolicyServices.cs (ReimbursementPolicyResolver/
#     ReimbursementEligibilityService), PayrollRetroSettlementService.cs, PayrollInputService.cs,
#     PayrollOperationsService.cs, PayrollControlService.cs, StatutoryPayrollService.cs (calculation
#     integration + configuration/employee-profile CRUD), AttendancePayrollSnapshotResolver.cs,
#     LoanPayrollRecoveryResolver.cs, ReimbursementPayrollResolver.cs
#   Backend/HRMS.Domain/Entities/SalaryComponent.cs, SalaryStructure.cs, EmployeeSalaryAssignment.cs,
#     PayrollPeriodRun.cs, PayrollCalculation.cs, PayrollInputs.cs, Reimbursements.cs, PayrollRetroSettlement.cs,
#     PayrollControls.cs
#   Backend/HRMS.Domain/Enums/PayrollEnums.cs, PayrollInputEnums.cs
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Permissions.Payroll.* - full 160+ constant inventory
#     read in full; PayrollInput.* uses a different constant prefix than every sibling Payroll.* permission)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap for every seeded role, read
#     in full for SuperAdmin/TenantAdmin/HRAdmin/HRManager/Manager/Employee/SuperHR)
#   Frontend/HRMS.Web/src/pages/payroll/*.tsx (in-scope pages), src/api/payroll.ts, payrollAdjustments.ts,
#     payrollAnalytics.ts, payrollInputs.ts, payrollReports.ts, src/layout/navigation.ts, src/App.tsx
#   Existing xUnit (90+ classes touching this surface - EmployeeSalaryAssignmentTests, SalaryComponentMasterTests,
#     SalaryStructureMasterTests, PayrollPeriodRunTests, PayrollCalculationTests, PayrollConcurrencyMatrixTests,
#     PayrollAdjustmentFoundationTests/ConcurrencyTests, PayrollOutputTests, PayrollReimbursementsProviderAcceptance,
#     PayrollRetroSettlementTests, PayrollInputServiceTests/AcceptanceTests/ConcurrencyIdempotencyTests/
#     RetrySafetyTests, PayrollAnalyticsTests family, PayrollReportsTests family, plus the MySql*/SqlServer*
#     provider-acceptance mirrors - none previously classified in qa/tools/existing_test_layers.yaml before
#     this module) and Vitest across the in-scope pages - see README.md's mapping.
#
# ── Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) ──
# CR-66 recurs directly: SuperHR holds PageAccess.Manage and, unlike Separation (where it held ZERO native
# permissions), already holds a PARTIAL native Payroll footprint (full Salary/Period/Run management
# including Run.Approve/Finalize and Controls.Manage) - via one PageAccess call it can self-grant every
# remaining Payroll permission it lacks (Adjustments/Reimbursements/OffCycle/Analytics/Retro/FinalSettlement/
# PayrollInput.*), closing the gap to the entire module. CR-77 (manager/team-scope resolution) does NOT
# recur here: no Payroll.*.ViewTeam permission exists anywhere in the module - there is no "manager sees
# their team's payroll" concept at all, only ViewOwn (self-service) vs the tenant-wide View/Manage tier.
# Payroll.Run.Approve and Payroll.Run.Finalize are declared and seeded to SuperAdmin/TenantAdmin/HRAdmin/
# SuperHR but checked by ZERO endpoints - the only real state-transition action (POST /runs/{id}/transition)
# is gated by the coarser Payroll.Run.Manage, the same dead-permission shape as Separation's CR-134.
# HRManager holds NONE of the module's core payroll permissions (no Salary*/Period*/Run*/Payslip*/
# Adjustments*/Reimbursements*/OffCycle*/Analytics*/Retro*/FinalSettlement*) despite being a senior HR role -
# a narrower gap than even Separation's own HRManager finding (CR-135). Manager holds ZERO Payroll
# permissions of any kind. A confirmed source-level bug: PayrollRunService.TransitionAsync's single-statement
# `if (target is Finalized or Cancelled) row.CompletedAtUtc = ...;` has no braces, so the very next statement
# `row.CompletedByUserId = tenant.UserId;` executes UNCONDITIONALLY on every transition (Approved,
# Processing, etc.), stamping CompletedByUserId long before CompletedAtUtc is ever set.

functionalities:
  # ═══════════════════════════════ A. SALARY COMPONENT MASTER ═══════════════════════════════
  - id: F-PAY-001
    name: List/search salary components with filters (type, calculation type, active, statutory) and paging
    group: Salary Component Master
    status: Implemented
    ui: SalaryComponentsPage
    api: "GET /api/payroll/salary-components"
    service: "SalaryComponentService.GetAsync"
    permission: "Payroll.SalaryComponent.View"
    db: SalaryComponents

  - id: F-PAY-002
    name: Get a single salary component by id (tenant-scoped)
    group: Salary Component Master
    status: Implemented
    api: "GET /api/payroll/salary-components/{id}"
    service: "SalaryComponentService.GetByIdAsync"
    permission: "Payroll.SalaryComponent.View"
    db: SalaryComponents

  - id: F-PAY-003
    name: Create a salary component - Code and Name are required
    group: Salary Component Master
    status: Implemented
    ui: SalaryComponentsPage
    api: "POST /api/payroll/salary-components"
    service: "SalaryComponentService.CreateAsync -> Validate"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-004
    name: EffectiveTo cannot precede EffectiveFrom, else Invalid
    group: Salary Component Master
    status: Implemented
    api: "POST/PUT /api/payroll/salary-components"
    service: "SalaryComponentService.Validate"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-005
    name: IsStatutory must exactly match StatutoryType!=None, else Invalid
    group: Salary Component Master
    status: Implemented
    api: "POST/PUT /api/payroll/salary-components"
    service: "SalaryComponentService.Validate"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-006
    name: An EmployerContribution component cannot AffectsNetPay=true, else Invalid
    group: Salary Component Master
    status: Implemented
    api: "POST/PUT /api/payroll/salary-components"
    service: "SalaryComponentService.Validate"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-007
    name: Code is normalized (trim + uppercase) and must be unique per tenant, else Conflict
