    name: "Every paged list endpoint enforces PagedQuery.MaxPageSize; PayrollAnalyticsLargeDataTests and PayrollReportsLargeDataTests are the only in-scope areas with a DEDICATED large-data test class discovered - Salary Master, Periods/Runs, Calculation, Adjustments, Reimbursements, Settlement, and Inputs have none, and rely on this module's own large-data cases for that proof"
