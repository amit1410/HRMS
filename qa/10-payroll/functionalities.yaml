  # ═══════════════════════════════ O. SQL SERVER/MYSQL PROVIDER PARITY AND LARGE DATA ═══════════════════════════════
  - id: F-PAY-240
    name: "Every concurrency-versioned entity in this module (SalaryComponent, SalaryStructure, EmployeeSalaryAssignment, PayrollPeriod, PayrollRun, PayrollAdjustment, Payslip) must enforce the SAME optimistic-concurrency contract on both SQL Server (native rowversion) and MySQL (app-managed binary(16) token via interceptor), per CLAUDE.md's documented provider divergence"
    group: Provider Parity and Large Data
    status: Implemented
    api: "PUT/POST across every concurrency-versioned entity's controller"
    service: "every in-scope *Service.cs (ConcurrencyVersion checks)"
    permission: "varies"
    db: "ConcurrencyVersion column (rowversion vs binary(16))"

  - id: F-PAY-241
    name: "PayrollAdjustmentNumberSequence's retry-on-DbUpdateException allocation loop is provider-agnostic by design; the Reimbursement claim number's scan-existing-then-increment approach is NOT backed by a dedicated sequence row and must be proven race-free on both providers, not assumed safe from SQLite behavior alone"
    group: Provider Parity and Large Data
    status: Implemented
    api: "POST /api/payroll/adjustments, /reimbursements"
    service: "PayrollAdjustmentService.NextNumberAsync, ReimbursementService.NextClaimNumberAsync"
    permission: "varies"
    db: PayrollAdjustmentNumberSequences, ReimbursementClaims

  - id: F-PAY-242
    name: "PayrollInputService.PostAsync and ReimbursementService's claim mutations use IsolationLevel.Serializable transactions - their actual blocking/retry behavior differs between SQL Server's UPDLOCK/HOLDLOCK-style locking and MySQL's SELECT...FOR UPDATE/InnoDB snapshot isolation, and must be proven concurrently on both real providers"
    group: Provider Parity and Large Data
    status: Implemented
    api: "POST /api/payroll/input-batches/{id}/post, /reimbursements/{id}/approve"
    service: "PayrollInputService.PostAsync, ReimbursementService.ApproveAsync"
    permission: "varies"
    db: "n/a (transaction isolation)"

  - id: F-PAY-243
    name: "MySQL deadlock error 1213 is retryable and lock-timeout 1205 is deliberately NOT, per CLAUDE.md's documented provider divergence - PayrollAdjustmentService.NextNumberAsync's catch clauses must classify these correctly rather than retrying every DbUpdateException indiscriminately"
    group: Provider Parity and Large Data
    status: Implemented
    api: "POST /api/payroll/adjustments"
    service: "PayrollAdjustmentService.NextNumberAsync"
    permission: "Payroll.Adjustments.Create"
    db: "n/a (MySQL error codes 1213/1205)"

  - id: F-PAY-244
    name: "PayrollOutputService's ExecuteUpdateAsync bulk status flips (Publish, supersede-on-regenerate) must translate and execute identically on SQL Server and MySQL"
    group: Provider Parity and Large Data
    status: Implemented
    api: "POST /api/payroll/runs/{runId}/payslips/publish"
    service: "PayrollOutputService.PublishAsync"
    permission: "Payroll.Payslip.Publish"
