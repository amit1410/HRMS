    status: Implemented
    api: "POST /api/payroll/salary-components"
    service: "SalaryComponentService.CreateAsync -> NormalizeCode"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-008
    name: A concurrent duplicate-code create race is caught at the DB layer as a fallback to the pre-check
    group: Salary Component Master
    status: Implemented
    api: "POST /api/payroll/salary-components"
    service: "SalaryComponentService.CreateAsync (DbUpdateException fallback)"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-009
    name: Update requires the component to exist in the tenant, else NotFound
    group: Salary Component Master
    status: Implemented
    api: "PUT /api/payroll/salary-components/{id}"
    service: "SalaryComponentService.UpdateAsync"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-010
    name: Update honors ExpectedConcurrencyVersion, else Conflict ("changed by another user")
    group: Salary Component Master
    status: Implemented
    api: "PUT /api/payroll/salary-components/{id}"
    service: "SalaryComponentService.UpdateAsync"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents.ConcurrencyVersion

  - id: F-PAY-011
    name: Update re-checks code uniqueness excluding the current row
    group: Salary Component Master
    status: Implemented
    api: "PUT /api/payroll/salary-components/{id}"
    service: "SalaryComponentService.UpdateAsync"
    permission: "Payroll.SalaryComponent.Manage"
    db: SalaryComponents

  - id: F-PAY-012
    name: "Activate/Deactivate (SetActiveAsync) is an idempotent no-op - no DB write/history row when the requested state already matches"
    group: Salary Component Master
    status: Implemented
    api: "POST /api/payroll/salary-components/{id}/activate, /deactivate"
    service: "SalaryComponentService.SetActiveAsync"
    permission: "Payroll.SalaryComponent.Manage"
