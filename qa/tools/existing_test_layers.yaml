# Classification of EXISTING automated tests by layer. None of these are live-stack coverage:
# they run in-process (SQLite in-memory / stubs / jsdom). The Playwright suite is the first live layer.
# Layers: Unit | Component | In-process integration | Provider acceptance | Live API | Live browser/E2E

