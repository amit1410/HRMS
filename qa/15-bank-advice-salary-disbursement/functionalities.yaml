# Functionality registry for Module 15 - Bank Advice & Salary Disbursement (phase 7H "Bank Advice &
# Payment Processing"): batch generation from an approved/finalized payroll run, employee salary
# bank-account resolution, net-pay amount selection, per-payment validation, the
# Draft->Prepared->Approved->Exported lifecycle (plus controlled cancellation and
# cancel-then-regenerate), the single provider-neutral CSV export format, append-only history,
# Authorization/Scope, Tenant Isolation, Concurrency/Idempotency, the payroll-result/reconciliation
# integration boundary (and the confirmed absence of any final-settlement integration), SQL
# Server/MySQL Provider Parity, Large Data/Paging, and Frontend.
# Every test case references one or more of these ids; the builder fails the build if a
# functionality has zero cases or a case references an unknown id. IDs are allocated in one global
# sequence (F-BANKADV-001...) in the order the groups below were authored - group boundaries are
# noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): this module covers exactly
# Backend/HRMS.Application/Services/BankAdviceService.cs and its controller
# (BankAdviceController in Backend/HRMS.API/Controllers/PayrollOutputsController.cs), plus the
# BankAdvice-specific reconciliation findings that Backend/HRMS.Application/Services/
# PayrollAnalyticsService.cs independently re-derives about it (tested here only as an
# integration-boundary check, not as full coverage of the analytics/reconciliation engine itself -
# that engine, together with PayrollReconciliation/PayrollVarianceControls/PayrollAnomalyFlags, has
# no dedicated qa module yet and is explicitly out of scope here). Also explicitly out of scope:
# payroll-run creation/calculation/approval itself (qa/10-payroll's own surface - this module only
# tests the Approved/Finalized status GATE that Generate reads), employee bank-account CRUD/master
# data (owned by EmployeeSubResourcesController and employee master-data modules - this module only
# tests the READ-SIDE resolution query BankAdviceService itself runs), payroll accounting/GL posting
# (PayrollAccountingController/IPayrollAccountingService - a separate, already-distinct service with
# no BankAdvice reference of any kind), and final settlement / separation payouts (a full grep of
# SeparationService.cs for "BankAdvice" returns zero matches - there is no code-level integration to
# test, and docs/phase-7h-bank-advice-payment-processing.md explicitly defers "final settlement"
# alongside GL posting, statutory returns, and arrears/retro). No live bank API, payment submission,
# NEFT/RTGS/IMPS, SFTP, or bank-specific signed/encrypted export format is implemented anywhere in
# this codebase - the single CSV export tested here is the only real export format that exists.
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc;
# docs/phase-7h-bank-advice-payment-processing.md was read for scope framing only; current code wins
# wherever a doc and the code diverge, per CLAUDE.md - see CR-263/CR-266 for confirmed divergences
# from the doc's own "acceptance complete" framing):
#   Backend/HRMS.API/Controllers/PayrollOutputsController.cs (BankAdviceController, api/payroll/bank-advice
#     base route plus the runs/{runId}/bank-advice generate route - every action read)
#   Backend/HRMS.Application/Abstractions/IBankAdviceService.cs (read in full)
#   Backend/HRMS.Application/Services/BankAdviceService.cs (read in full, all 137 lines)
#   Backend/HRMS.Application/DTOs/Payroll/BankAdviceDtos.cs (read in full)
#   Backend/HRMS.Domain/Entities/BankAdvice.cs (BankAdviceBatch/BankAdvicePayment/BankAdviceHistory,
#     read in full)
#   Backend/HRMS.Domain/Enums/PayrollEnums.cs (BankAdviceStatus/BankAdvicePaymentStatus/
#     BankAdviceValidationStatus/BankAdviceHistoryChangeType, PayrollControlScope.BankAdvice,
#     PayrollControlMetric.BankAdviceTotal, PayrollRunStatus, PayrollResultStatus)
#   Backend/HRMS.Domain/Entities/EmployeeBankDetail.cs, Bank.cs (read in full)
#   Backend/HRMS.Domain/Enums/AccountPurpose.cs, BankAccountStatus.cs (read in full)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/BankAdviceConfiguration.cs (all 3
#     configurations, every index and FK, read in full)
#   Backend/HRMS.Application/Services/PayrollApprovalGuard.cs (read in full - the shared opt-in
#     self-approval/reason-required guard used by Approve and Cancel)
#   Migration pair AddBankAdvicePaymentProcessing confirmed present in both
#     Backend/HRMS.Infrastructure/Persistence/Migrations (SQL Server, 20260919202210) and
#     Backend/HRMS.Infrastructure.MySqlMigrations/Migrations (MySQL, 20260919202237)
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Payroll.BankAdvice* block, 7 permissions,
#     read in full)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (full-file grep for all 7 BankAdvice
#     permission constants and RolePermissionMap arrays for HRAdmin/HRManager/SuperHR/Accounts/IT/
#     Manager/Employee, every role read)
#   Backend/HRMS.Application/Services/PayrollAnalyticsService.cs (AddSourceFindingsAsync's
#     BankAdvice-specific block, lines ~180-191, read in full for the integration-boundary group)
#   Backend/HRMS.Application/Services/SeparationService.cs (full grep for "BankAdvice" - zero matches)
#   Frontend/HRMS.Web/src/pages/payroll/BankAdvicePage.tsx (+ its .test.tsx), src/api/payroll.ts
#     (BankAdvice section), src/auth/permissions.ts (bankAdvice* mirror) - all read in full;
#     App.tsx and layout/navigation.ts grepped for route/nav registration
#   Existing xUnit inventory (BankAdviceTests, SqlServerBankAdviceIntegrationTests,
#     MySqlBankAdviceIntegrationTests, BankAdviceProviderAcceptance - 4 files, referenced narratively
#     per the qa/8-14 precedent, not individually classified)
#
# -- Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) --
# CR-263: CONFIRMED - a full grep of SeedData.cs's RolePermissionMap for all 7 Payroll.BankAdvice*
# constants returns zero matches in any role array except the blanket Permissions.All grant to
# SuperAdmin/TenantAdmin. HRAdmin, HRManager, SuperHR, and the role literally named "Accounts" all
# hold zero of the 7, out of the box.
# CR-264: CONFIRMED DEAD PERMISSION - Payroll.BankAdvice.ViewHistory is declared, seeded (id 116),
# and mirrored on the frontend, but no controller route or service method anywhere checks it; history
# is unconditionally returned wherever BankAdviceView already grants access.
# CR-265: CONFIRMED - CancelAsync only updates BankAdviceBatch.Status; it never updates any child
# BankAdvicePayment.PaymentStatus row, so payments keep their pre-cancellation Ready/Failed status
# forever. BankAdvicePaymentStatus.Cancelled and .Processed are both declared-but-dead enum members.
# CR-266: CONFIRMED - ValidateAsync and PrepareAsync share one implementation (SetPreparedAsync).
# When every payment is already Valid, calling ValidateAsync has the identical Draft->Prepared
# state-changing effect as PrepareAsync, even though the caller only asked to validate.
functionalities:
  # =========================== A. BANK ADVICE GENERATION & PAYROLL-RUN ELIGIBILITY ===========================
  - id: F-BANKADV-001
    name: GenerateAsync requires an authenticated tenant context, else Unauthorized
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    api: "POST /api/payroll/runs/{runId}/bank-advice"
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: "n/a"

  - id: F-BANKADV-002
    name: GenerateAsync requires the target PayrollRun (with its PayrollPeriod) to exist in the tenant, else NotFound
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollRuns, PayrollPeriods (TenantId filter)

  - id: F-BANKADV-003
    name: GenerateAsync requires PayrollRun.Status to be Approved or Finalized, else Conflict - Draft/Prepared/Processing/Calculated/Cancelled are all rejected
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollRuns.Status

  - id: F-BANKADV-004
    name: GenerateAsync blocks a second generation while an active (Status != Cancelled) batch already exists for the same PayrollRunId, else Conflict
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync (AnyAsync guard)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdviceBatches (TenantId+PayrollRunId+Status)

  - id: F-BANKADV-005
    name: GenerateAsync sources rows strictly from PayrollResults where IsCurrent=true AND Status=Calculated for the run - Failed or superseded rows never contribute a payment
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollResults.IsCurrent, PayrollResults.Status

  - id: F-BANKADV-006
    name: GenerateAsync requires at least one eligible PayrollResult row, else Conflict ("No calculated payroll results are available for this run.")
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollResults

  - id: F-BANKADV-007
    name: GenerateAsync requires all eligible results to share exactly one CurrencyCode, else Conflict ("cannot contain mixed currencies")
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollResults.CurrencyCode

  - id: F-BANKADV-008
    name: "BatchNumber is deterministic: BA/{PayDate:yyyyMM}/{RunId:N}/{version}, where version = 1 + the max existing Version for the run across ALL statuses including Cancelled"
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdviceBatches.BatchNumber, Version

  - id: F-BANKADV-009
    name: A newly generated batch always starts at Status=Draft, with GeneratedAtUtc/GeneratedByUserId stamped and a Generated history event recorded
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync -> History(Generated)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdviceBatches.Status, GeneratedAtUtc, GeneratedByUserId, BankAdviceHistories

  - id: F-BANKADV-010
    name: Payments are ordered by Employee.EmployeeCode ascending at generation time; Sequence is assigned starting at 1 in that order
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync (OrderBy EmployeeCode, sequence++)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.Sequence

  - id: F-BANKADV-011
    name: "PaymentReference is deterministic: {BatchNumber}/{Sequence:0000}"
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.PaymentReference

  - id: F-BANKADV-012
    name: Regeneration is possible once a prior batch for the same run reaches Status=Cancelled - the active-batch guard (F-BANKADV-004) excludes Cancelled - and this is the ONLY regeneration path; there is no separate regenerate/replace endpoint
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync (AnyAsync guard scope)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdviceBatches.Status

  - id: F-BANKADV-013
    name: GenerateAsync is a source-only read against PayrollResults - it never writes to, recalculates, or otherwise mutates any PayrollResult row; payroll remains authoritative
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync (AsNoTracking source query)"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollResults (read-only)

  - id: F-BANKADV-014
    name: A cross-tenant PayrollRunId on Generate is NotFound, not Forbidden
    group: Bank Advice Generation & Payroll-Run Eligibility
    status: Implemented
    service: "BankAdviceService.GenerateAsync (TenantId filter)"
    permission: "Payroll.BankAdvice.Generate"
    db: PayrollRuns (TenantId filter)

  # =========================== B. EMPLOYEE BANK-ACCOUNT RESOLUTION & NET-PAY AMOUNT SELECTION ===========================
  - id: F-BANKADV-015
    name: "Account resolution query: EmployeeBankDetails filtered by TenantId, EmployeeId in the result set, AccountPurpose=Salary, IsActive=true, Status=Active, and EffectiveFrom null OR <= batch.PayDate"
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync (accounts query)"
    permission: "Payroll.BankAdvice.Generate"
    db: EmployeeBankDetails (TenantId, AccountPurpose, IsActive, Status, EffectiveFrom)

  - id: F-BANKADV-016
    name: Exactly one matching account row is used to populate AccountHolderName/BankName/MaskedAccountNumber/IfscCode/BranchName on the payment
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync (accountRows.Count == 1 branch)"
    permission: "Payroll.BankAdvice.Generate"
    db: EmployeeBankDetails, BankAdvicePayments

  - id: F-BANKADV-017
    name: Zero matching account rows leaves account null - all account fields on the payment default to empty/null and the payment fails validation
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync, ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: EmployeeBankDetails, BankAdvicePayments

  - id: F-BANKADV-018
    name: "More than one matching account row (ambiguous, e.g. two Active Salary accounts both effective) is ALSO treated as null/unresolved, identical to the zero-account outcome - the specific rows are never picked by any tie-break rule"
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync (accountRows.Count == 1 ? ... : null)"
    permission: "Payroll.BankAdvice.Generate"
    db: EmployeeBankDetails

  - id: F-BANKADV-019
    name: NetPay is taken verbatim from PayrollResult.NetPay - BankAdviceService never recalculates, adjusts, or rounds the amount
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.NetPay, PayrollResults.NetPay

  - id: F-BANKADV-020
    name: CurrencyCode on each payment is copied from the PayrollResult, not from the bank account or the batch's own currency field independently
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.CurrencyCode

  - id: F-BANKADV-021
    name: "AccountNumber is masked before being stored on the payment snapshot (all but the last 4 digits replaced with X) - the full AccountNumber is never persisted on BankAdvicePayment or exposed via the DTO/export"
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.MaskAccount"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.MaskedAccountNumber

  - id: F-BANKADV-022
    name: An account number of length <=4 is returned UNMASKED in full by MaskAccount's own short-circuit branch
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.MaskAccount (digits.Length <= 4 branch)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.MaskedAccountNumber

  - id: F-BANKADV-023
    name: EmployeeName on the payment snapshot is FirstName and LastName joined with a single space, with any blank part skipped
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "BankAdviceService.GenerateAsync (string.Join)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.EmployeeName

  - id: F-BANKADV-024
    name: "OUT OF SCOPE (confirmed, not a gap) - employee bank-account CREATE/UPDATE/deactivate itself is owned by EmployeeSubResourcesController and employee master-data modules; this module tests only the READ-SIDE resolution query BankAdviceService.GenerateAsync itself runs"
    group: Employee Bank-Account Resolution & Net-Pay Amount Selection
    status: Implemented
    service: "Backend/HRMS.API/Controllers/EmployeeSubResourcesController.cs (EmployeeBankDetail CRUD, out of this module's surface)"
    permission: "n/a"
    db: EmployeeBankDetails

  # =========================== C. PAYMENT VALIDATION RULES ===========================
  - id: F-BANKADV-025
    name: 'NetPay<=0 -> Invalid, "Net pay must be greater than zero."'
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-026
    name: 'Zero matching bank accounts -> Invalid, "No active salary bank account is effective for the pay date."'
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-027
    name: 'More than one matching bank account -> Invalid, "Multiple active salary bank accounts are effective for the pay date."'
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-028
    name: 'Missing/blank IfscCode on an otherwise-resolved account -> Invalid, "Bank routing/IFSC code is required."'
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-029
    name: 'Missing/blank AccountNumber on an otherwise-resolved account -> Invalid, "Bank account number is required."'
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-030
    name: When all five checks pass, ValidationStatus=Valid and ValidationMessage is null
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationStatus, ValidationMessage

  - id: F-BANKADV-031
    name: ValidationStatus=Valid maps PaymentStatus=Ready at generation time; any Invalid outcome maps PaymentStatus=Failed
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.GenerateAsync"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.PaymentStatus

  - id: F-BANKADV-032
    name: "Validation order is fixed (NetPay, then account-count, then IFSC, then account number) - ValidatePayment returns on the FIRST failing rule, so only one ValidationMessage is ever recorded even when a row violates several rules at once"
    group: Payment Validation Rules
    status: Implemented
    service: "BankAdviceService.ValidatePayment (sequential early-return checks)"
    permission: "Payroll.BankAdvice.Generate"
    db: BankAdvicePayments.ValidationMessage

  # =========================== D. BATCH LIFECYCLE - VALIDATE / PREPARE / APPROVE ===========================
  - id: F-BANKADV-033
    name: ValidateAsync and PrepareAsync share one implementation (SetPreparedAsync) and both require Status=Draft, else Conflict
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    api: "POST /api/payroll/bank-advice/{id}/validate, POST /api/payroll/bank-advice/{id}/prepare"
    service: "BankAdviceService.SetPreparedAsync"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.Status

  - id: F-BANKADV-034
    name: Both Validate and Prepare re-run Recalculate (TotalEmployees/TotalAmount recomputed from only the currently-Valid payments) before deciding their outcome
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.SetPreparedAsync -> Recalculate"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.TotalEmployees, TotalAmount

  - id: F-BANKADV-035
    name: PrepareAsync (requireValid=true) returns Conflict and leaves the batch at Draft if any payment is still Invalid
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    api: "POST /api/payroll/bank-advice/{id}/prepare"
    service: "BankAdviceService.SetPreparedAsync(requireValid: true)"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.Status

  - id: F-BANKADV-036
    name: ValidateAsync (requireValid=false) returns Success with a "completed with errors" message and logs a ValidationFailed history event when any payment is Invalid - the batch stays Draft, NOT a Conflict
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    api: "POST /api/payroll/bank-advice/{id}/validate"
    service: "BankAdviceService.SetPreparedAsync(requireValid: false) -> History(ValidationFailed)"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.Status, BankAdviceHistories

  - id: F-BANKADV-037
    name: "CONFIRMED - when every payment is already Valid, calling ValidateAsync has the SAME Draft->Prepared state-changing effect as PrepareAsync (a Prepared history event is recorded) even though the caller only asked to validate, not prepare"
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.SetPreparedAsync (if (valid) branch runs regardless of requireValid)"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.Status, BankAdviceHistories

  - id: F-BANKADV-038
    name: The transition to Prepared is a compare-and-swap on ConcurrencyVersion; a lost race returns Conflict ("changed by another operation"), not a 500
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.SetPreparedAsync (ExecuteUpdateAsync)"
    permission: "Payroll.BankAdvice.Validate"
    db: BankAdviceBatches.ConcurrencyVersion

  - id: F-BANKADV-039
    name: ApproveAsync requires Status=Prepared exactly, else Conflict
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    api: "POST /api/payroll/bank-advice/{id}/approve"
    service: "BankAdviceService.ApproveAsync"
    permission: "Payroll.BankAdvice.Approve"
    db: BankAdviceBatches.Status

  - id: F-BANKADV-040
    name: "ApproveAsync runs PayrollApprovalGuard.ValidateAsync(batch.GeneratedByUserId, \"approve\") - an OPT-IN self-approval block only enforced when the tenant's PayrollControlConfiguration has BOTH RequireMakerChecker AND PreventSelfApproval set"
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.ApproveAsync -> PayrollApprovalGuard.ValidateAsync"
    permission: "Payroll.BankAdvice.Approve"
    db: PayrollControlConfigurations

  - id: F-BANKADV-041
    name: ApproveAsync additionally requires every payment's ValidationStatus=Valid, else Conflict - a defense-in-depth check beyond the Prepared-status gate
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.ApproveAsync"
    permission: "Payroll.BankAdvice.Approve"
    db: BankAdvicePayments.ValidationStatus

  - id: F-BANKADV-042
    name: ApproveAsync recalculates and defensively compares batch.TotalAmount to the full payments sum before approving, Conflict ("does not reconcile") if they disagree
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.ApproveAsync -> Recalculate"
    permission: "Payroll.BankAdvice.Approve"
    db: BankAdviceBatches.TotalAmount

  - id: F-BANKADV-043
    name: Approval stamps ApprovedAtUtc/ApprovedByUserId and is guarded by the same ConcurrencyVersion compare-and-swap pattern as Prepare
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.ApproveAsync (ExecuteUpdateAsync)"
    permission: "Payroll.BankAdvice.Approve"
    db: BankAdviceBatches.ApprovedAtUtc, ApprovedByUserId, ConcurrencyVersion

  - id: F-BANKADV-044
    name: An Approved history event is recorded on every successful approval
    group: Batch Lifecycle - Validate, Prepare & Approve
    status: Implemented
    service: "BankAdviceService.ApproveAsync -> History(Approved)"
    permission: "Payroll.BankAdvice.Approve"
    db: BankAdviceHistories

  # =========================== E. EXPORT & BANK/EXPORT FORMATS ===========================
  - id: F-BANKADV-045
    name: ExportAsync requires Status=Approved or Status=Exported, else Conflict - Draft/Prepared/Cancelled cannot be exported
    group: Export & Bank/Export Formats
    status: Implemented
    api: "GET /api/payroll/bank-advice/{id}/export"
    service: "BankAdviceService.ExportAsync"
    permission: "Payroll.BankAdvice.Export"
    db: BankAdviceBatches.Status

  - id: F-BANKADV-046
    name: 'The export format is one provider-neutral CSV with header row "Sequence,EmployeeCode,EmployeeName,AccountHolder,BankName,AccountNumber,IFSC,NetPay,Currency,PaymentReference", one data row per payment ordered by Sequence'
    group: Export & Bank/Export Formats
    status: Implemented
    service: "BankAdviceService.ExportAsync"
    permission: "Payroll.BankAdvice.Export"
    db: "n/a (generated file)"

  - id: F-BANKADV-047
    name: The CSV "AccountNumber" column actually contains the MASKED account number - the full, unmasked account number is never present anywhere in the export
    group: Export & Bank/Export Formats
    status: Implemented
    service: "BankAdviceService.ExportAsync (p.MaskedAccountNumber)"
    permission: "Payroll.BankAdvice.Export"
    db: "n/a (generated file)"

  - id: F-BANKADV-048
    name: "CSV values are escaped per RFC4180-style rules (quoted when containing comma/quote/CR/LF, embedded quotes doubled) by the private Csv() helper"
    group: Export & Bank/Export Formats
    status: Implemented
    service: "BankAdviceService.Csv"
    permission: "Payroll.BankAdvice.Export"
    db: "n/a (generated file)"

