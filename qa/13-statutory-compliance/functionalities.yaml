    permission: "n/a"
    db: PayrollCalculationErrors

  - id: F-STAT-054
    name: Adding the statutory EmployeeAmount can independently push NetPay negative even when the pre-statutory net was non-negative, triggering a second, statutory-specific NegativeNetPay guard distinct from the pre-statutory one
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
