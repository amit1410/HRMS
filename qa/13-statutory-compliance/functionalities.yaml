    permission: "n/a"
    db: "n/a"

  - id: F-STAT-055
    name: "PayrollStatutoryResult carries no CalculationAttemptId and no IsCurrent flag, unlike PayrollResult/PayrollResultComponent/PayrollCalculationError which all use one or both - every CalculateAsync invocation (including every recalculation attempt) inserts a brand-new, permanent row rather than superseding the prior attempt's row"
