    status: Implemented
    service: "Backend/HRMS.Domain/Entities/PayrollCalculation.cs (PayrollStatutoryResult - full field list, no CalculationAttemptId/IsCurrent)"
    permission: "n/a"
    db: PayrollStatutoryResults

  - id: F-STAT-056
    name: "CONFIRMED - recalculating a payroll run (PayrollCalculationEngine.CalculateAsync with recalculate=true) marks the prior attempt's PayrollResult rows IsCurrent=false but never deletes, marks non-current, or otherwise touches the PayrollStatutoryResult rows the prior attempt created - they remain in the table indefinitely, one full set per attempt"
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
    service: "PayrollCalculationEngine.CalculateAsync (full grep for PayrollStatutoryResults inside the recalculation cleanup block - zero matches)"
    permission: "n/a"
    db: PayrollStatutoryResults

  - id: F-STAT-057
    name: "CONFIRMED HEADLINE DEFECT - GetResultsAsync(payrollRunId, employeeId) filters only by TenantId/PayrollRunId/EmployeeId, with no PayrollResultId or attempt/IsCurrent filter. After any recalculation this endpoint returns the UNION of every attempt's statutory rows (e.g. two PF rows, two ESI rows... after one recalculation) rather than only the current attempt's results, with no field anywhere letting a caller distinguish current from stale"
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
    api: "GET /api/payroll/runs/{runId}/results/{employeeId}/statutory"
    service: "StatutoryPayrollService.GetResultsAsync"
    permission: "Payroll.Statutory.View"
    db: PayrollStatutoryResults (unfiltered by attempt)

  - id: F-STAT-058
    name: The (TenantId, PayrollResultId, StatutoryType) unique index (F-STAT-047) prevents duplicates only WITHIN a single attempt's own PayrollResult id - it does nothing to prevent or even flag the cross-attempt accumulation described in F-STAT-057, since each attempt mints an entirely new PayrollResultId
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
    service: "PayrollStatutoryResultConfiguration (unique index scope)"
    permission: "n/a"
    db: PayrollStatutoryResults (unique index)

  - id: F-STAT-059
    name: A retro/off-cycle adjustment run recalculates statutory contributions from scratch against whatever EmployeeStatutoryProfile/StatutoryConfiguration is effective as of THAT run's own PeriodEndDate - a later change to profile/configuration does not retroactively re-open or flag an earlier run's already-persisted PayrollStatutoryResult rows
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync (each call independently resolves profile/configuration as of its own result.PeriodEndDate)"
    permission: "n/a"
    db: PayrollStatutoryResults

  - id: F-STAT-060
    name: "Because PayrollResultComponent (the statutory basis source) IS attempt-scoped via CalculationAttemptId while PayrollStatutoryResult is not (F-STAT-055), a recalculation that changes the underlying components produces a NEW statutory result computed from the new components while the OLD attempt's stale statutory rows (F-STAT-056) still linger and are still returned by F-STAT-057's endpoint, compounding the ambiguity for any caller who does not already know to cross-reference the latest PayrollResult id independently"
    group: Payroll Integration and Retro/Recalculation Impact
    status: Implemented
    service: "PayrollCalculationEngine.cs / StatutoryPayrollService.cs (cross-reference of attempt scoping)"
    permission: "n/a"
    db: PayrollStatutoryResults, PayrollResultComponents

