# Functionality registry for Module 13 - Statutory Compliance (phases 7F "Statutory Calculation
# Framework", 7K "Payroll Statutory Compliance Returns", and 7X "Statutory Filing External
# Integrations": tenant-scoped, effective-dated, jurisdiction-aware StatutoryConfiguration/Version
# rules for PF/ESI/Professional Tax/generic Income Tax, EmployeeStatutoryProfile applicability,
# ceiling/slab/rounding-driven contribution calculation wired into the payroll calculation engine,
# PayrollCompliancePeriod/PayrollStatutoryReturnBatch register generation and its
# Generate->Validate->Approve->Export->MarkFiled lifecycle, the unused PayrollStatutoryChallan
# entity, StatutoryFilingDefinition/ConnectionProfile/Run/Package/Submission/Acknowledgement
# external-filing lifecycle and its ManualDownload/Test-only connectors, Authorization/Scope,
# Tenant Isolation, Audit/History, Concurrency/Idempotency, SQL Server/MySQL Provider Parity,
# Large Data/Paging, and Frontend).
# Every test case references one or more of these ids; the builder fails the build if a
# functionality has zero cases or a case references an unknown id. IDs are allocated in one global
# sequence (F-STAT-001...) in the order the groups below were authored - group boundaries are noted
# with a comment banner.
#
# SCOPE NOTE (read before extending this module): the full annual income-tax/TDS computation engine
# - regime selection, investment declarations and proof verification, Form 16, year-end
# reconciliation (YearEndTaxService.cs, TaxDeclarations.cs, phases 7U/7W) - is OUT of scope, for the
# identical reason qa/10-payroll excluded Payroll Accounting/GL Posting and qa/12-bonus-variable-pay
# excluded GL journal generation: it is a separate, self-contained concern with its own design doc
# and its own future QA module. This module covers only the StatutoryType.IncomeTax slab-based
# MONTHLY withholding that lives inside the generic StatutoryPayrollService calculation framework
# alongside PF/ESI/Professional Tax (F-STAT-050 documents that these two income-tax code paths never
# call each other). Payroll Accounting/GL posting of the StatutoryLiability mapping type (phase 7I)
# is likewise out of scope - this module verifies that a statutory contribution correctly produces a
# PayrollStatutoryResult/PayrollStatutoryReturnBatch row and updates payroll deductions (the business
# outcome), not that a balanced GL journal is subsequently posted from it (the accounting outcome,
# already out of scope for every payroll sub-module QA'd so far). Gratuity/separation benefit
# calculation (phase 7P) and full Performance/KPI-linked pay are unrelated modules, not gaps here.
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc;
# docs/phase-7f-statutory-calculation-framework.md, docs/phase-7k-payroll-statutory-compliance-
# returns.md and docs/phase-7x-statutory-filing-external-integrations.md were read for scope framing
# only; current code wins wherever a doc and the code diverge, per CLAUDE.md):
#   Backend/HRMS.API/Controllers/StatutoryPayrollController.cs (configurations/versions/profile/results)
#   Backend/HRMS.API/Controllers/PayrollOutputsController.cs (PayrollStatutoryComplianceController
#     nested in this file - periods/returns/validate/approve/mark-filed/export)
#   Backend/HRMS.API/Controllers/StatutoryFilingsController.cs (definitions/connections/runs/lifecycle)
#   Backend/HRMS.Application/Services/StatutoryPayrollService.cs (read in full)
#   Backend/HRMS.Application/Services/PayrollStatutoryComplianceService.cs (read in full)
#   Backend/HRMS.Application/Services/StatutoryFilingService.cs (read in full)
#   Backend/HRMS.Application/Services/StatutoryFilingConnectors.cs (read in full - only
#     ManualDownloadStatutoryFilingConnector and TestStatutoryFilingConnector are ever registered)
#   Backend/HRMS.Application/Services/PayrollApprovalGuard.cs (read in full - the shared, opt-in,
#     tenant-PayrollControlConfiguration-gated self-approval guard used by both Approve actions)
#   Backend/HRMS.Application/Services/PayrollCalculationEngine.cs (statutory.CalculateAsync call
#     sites in both CalculateEmployeeAsync and CalculateAdjustmentOnlyAsync, read in full)
#   Backend/HRMS.Application/Abstractions/IStatutoryPayrollService.cs,
#     IPayrollStatutoryComplianceService.cs, IStatutoryFilingService.cs (read in full)
#   Backend/HRMS.Application/DTOs/Payroll/StatutoryDtos.cs (read in full)
#   Backend/HRMS.Domain/Entities/PayrollCalculation.cs (StatutoryConfiguration family,
#     EmployeeStatutoryProfile family, PayrollStatutoryResult - read in full)
#   Backend/HRMS.Domain/Entities/PayrollStatutoryCompliance.cs (read in full, including the unused
#     PayrollStatutoryChallan entity)
#   Backend/HRMS.Domain/Entities/StatutoryFiling.cs (read in full - 12 entities)
#   Backend/HRMS.Domain/Enums/PayrollEnums.cs (StatutoryType, PayrollComplianceType and every other
#     statutory-related enum - read in full; StatutoryType has exactly four members, no
#     LabourWelfareFund member exists here)
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Payroll.Statutory*/StatutoryCompliance*/
#     StatutoryFiling* blocks, 29 permissions total, read in full)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap for every seeded
#     role, grep-verified for every one of the 29 permission constants above)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/StatutoryConfiguration.cs,
#     PayrollStatutoryComplianceConfiguration.cs, StatutoryFilingConfiguration.cs (all indexes and
#     concurrency-token configuration read in full)
#   Migration pairs for AddStatutoryCalculationFramework, AddPayrollStatutoryComplianceReturns,
#     AddStatutoryFilingPhase7X, AddStatutoryFilingConnectorProfilesPhase7X, and
#     AdjustStatutoryFilingPackageHashUniquenessPhase7X confirmed present in both
#     Backend/HRMS.Infrastructure/Persistence/Migrations (SQL Server) and
#     Backend/HRMS.Infrastructure.MySqlMigrations/Migrations (MySQL)
#   Frontend/HRMS.Web/src/pages/payroll/StatutoryConfigurationsPage.tsx,
#     StatutoryCompliancePage.tsx (+ its .test.tsx), StatutoryFilingsPage.tsx, and
#     src/api/payroll.ts's statutory exports plus src/api/statutoryFilings.ts (all read in full)
#   Frontend/HRMS.Web/src/pages/employees/PersonalDetailsForm.tsx (the unrelated legacy
#     "Statutory & Benefits" section, read around lines 380-430)
#   Frontend/HRMS.Web/src/layout/navigation.ts, App.tsx (route/nav-entry grep)
#   Existing xUnit inventory (StatutoryCalculationTests, SqlServerStatutoryPayrollIntegrationTests,
#     MySqlStatutoryPayrollIntegrationTests, PayrollStatutoryComplianceTests,
#     SqlServerPayrollStatutoryComplianceIntegrationTests,
#     MySqlPayrollStatutoryComplianceIntegrationTests, PayrollStatutoryComplianceProviderAcceptance,
#     StatutoryFilingFoundationTests, StatutoryFilingConnectorTests, StatutoryFilingConcurrencyTests,
#     StatutoryFilingRetrySafetyTests, StatutoryFilingLargeDataTests, StatutoryFilingProviderAcceptance
#     - 13 files, referenced narratively per the qa/10-11-12 precedent, not individually classified)
#
# -- Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) --
# CR-219: CONFIRMED - PayrollStatutoryResult has no CalculationAttemptId/IsCurrent (unlike
# PayrollResult/PayrollResultComponent/PayrollCalculationError). Recalculating a payroll run never
# deletes or supersedes a prior attempt's statutory rows, and GetResultsAsync(runId, employeeId)
# returns the UNION of every attempt's rows with no way to isolate the current one.
# CR-220: grep-verified against SeedData.cs's RolePermissionMap - none of the 29
# Statutory/StatutoryCompliance/StatutoryFiling permissions is held by any seeded role except
# SuperAdmin/TenantAdmin (via Permissions.All), the identical shape to qa/11-loans-advances CR-183
# and qa/12-bonus-variable-pay CR-202.
# CR-221: PayrollStatutoryChallan is a fully migrated entity/table/config that NO service, controller,
# DTO, or frontend code anywhere ever creates, reads, updates, or lists - a completely dead feature.
# CR-222: Only ManualDownloadStatutoryFilingConnector and TestStatutoryFilingConnector are ever
# registered - there is no EPFO/ESIC/GSTN/TRACES/any real government-portal connector anywhere, and
# ManualDownload's SubmitAsync unconditionally reports Outcome=Pending (mapped to Status=Submitted)
# regardless of whether anything was actually transmitted.
# CR-223: CONFIRMED FRONTEND - none of the three statutory pages lets an operator progress a
# statutory return or filing run past Generate/Validate; EmployeeStatutoryProfile (the record that
# actually gates calculation) has zero UI surface despite its client API functions existing.

functionalities:
  # =========================== A. STATUTORY CONFIGURATION AND EFFECTIVE-DATED VERSIONS ===========================
  - id: F-STAT-001
    name: List statutory configurations for the tenant, paginated, with search/jurisdiction/type/active filters
    group: Statutory Configuration and Versions
    status: Implemented
    ui: StatutoryConfigurationsPage
    api: "GET /api/payroll/statutory-configurations"
    service: "StatutoryPayrollService.GetConfigurationsAsync"
    permission: "Payroll.Statutory.View"
    db: StatutoryConfigurations, StatutoryConfigurationVersions

  - id: F-STAT-002
    name: Get a single configuration by id, NotFound if missing or cross-tenant
    group: Statutory Configuration and Versions
    status: Implemented
    api: "GET /api/payroll/statutory-configurations/{id}"
    service: "StatutoryPayrollService.GetConfigurationAsync"
    permission: "Payroll.Statutory.View"
    db: StatutoryConfigurations (TenantId filter)

  - id: F-STAT-003
    name: Create requires Code, Name and Jurisdiction, else Invalid
    group: Statutory Configuration and Versions
    status: Implemented
    ui: StatutoryConfigurationsPage
    api: "POST /api/payroll/statutory-configurations"
    service: "StatutoryPayrollService.CreateConfigurationAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations

  - id: F-STAT-004
    name: Code is trimmed and upper-cased and must be unique per tenant, else Conflict
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.CreateConfigurationAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations

  - id: F-STAT-005
    name: "JurisdictionCode/StateCode are trimmed and upper-cased on create; a null StateCode on a configuration means it matches every state within the jurisdiction at calculation time (CalculateAsync's own predicate: x.StateCode == null || x.StateCode == profile.StateCode)"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.CreateConfigurationAsync / CalculateAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations.StateCode

  - id: F-STAT-006
    name: CreateConfigurationAsync atomically records a StatutoryConfigurationHistory row of type Created
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.CreateConfigurationAsync -> History"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationHistories

  - id: F-STAT-007
    name: "CONFIRMED GAP - no UpdateConfigurationAsync/DeactivateAsync exists anywhere in IStatutoryPayrollService or the controller - Code/Name/IsActive/JurisdictionCode/StateCode/StatutoryType are all immutable after creation, unlike every other master-data module's own Update method"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "IStatutoryPayrollService.cs (full interface - no update/deactivate member); StatutoryPayrollController.cs (full grep - no PUT/PATCH route)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations

  - id: F-STAT-008
    name: AddVersionAsync requires EffectiveTo>=EffectiveFrom, else Invalid
    group: Statutory Configuration and Versions
    status: Implemented
    api: "POST /api/payroll/statutory-configurations/{id}/versions"
    service: "StatutoryPayrollService.AddVersionAsync"
    permission: "Payroll.Statutory.Manage"
    db: "n/a"

  - id: F-STAT-009
    name: AddVersionAsync requires the owning configuration to exist in the tenant, else NotFound
    group: Statutory Configuration and Versions
    status: Implemented
    api: "POST /api/payroll/statutory-configurations/{id}/versions"
    service: "StatutoryPayrollService.AddVersionAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations (TenantId filter)

  - id: F-STAT-010
    name: "A new version whose date range overlaps ANY existing version of the same configuration - Draft, Active, or Retired alike - is rejected Conflict; unlike qa/11-loans-advances/qa/12-bonus-variable-pay's Published-only overlap rule, overlap here is not narrowed to a particular Status"
    group: Statutory Configuration and Versions
    status: Implemented
    api: "POST /api/payroll/statutory-configurations/{id}/versions"
    service: "StatutoryPayrollService.AddVersionAsync -> overlaps query (no Status filter)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions

  - id: F-STAT-011
    name: "The overlap check and the version insert are two separate, non-transactional statements backed by a non-unique index (TenantId, StatutoryConfigurationId, EffectiveFrom, EffectiveTo) - a race between two concurrent AddVersionAsync calls for the same configuration can both pass the AnyAsync check and persist overlapping versions"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.AddVersionAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions (non-unique index only)

  - id: F-STAT-012
    name: A version persists EffectiveFrom/EffectiveTo/Status/Priority/ConfigurationJson (serialized Rules) plus optional Basis and Slabs collections in the same call
    group: Statutory Configuration and Versions
    status: Implemented
    api: "POST /api/payroll/statutory-configurations/{id}/versions"
    service: "StatutoryPayrollService.AddVersionAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions, StatutoryComponentBasis, StatutorySlabs

  - id: F-STAT-013
    name: "StatutoryConfigurationVersionRequest.Status has no default value (unlike qa/12-bonus-variable-pay's Status-defaults-to-Published shape) - a caller must explicitly choose Draft/Active/Retired on every AddVersionAsync call"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryConfigurationVersionRequest (record, no default for Status)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions.Status

  - id: F-STAT-014
    name: "No API path ever transitions a version's Status after creation - a version stays whatever Status it was created with forever; nothing automatically retires an Active version when a newer, overlapping-in-time replacement is added (and F-STAT-010 would in any case reject such an overlapping replacement while the old one is still Active)"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.cs (full grep for a Status-transition method on StatutoryConfigurationVersion - none exists)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions.Status

  - id: F-STAT-015
    name: AddVersionAsync stamps CreatedByUserId from the current authenticated user
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.AddVersionAsync"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions.CreatedByUserId

  - id: F-STAT-016
    name: A cross-tenant configuration id on AddVersionAsync is NotFound, not Forbidden
    group: Statutory Configuration and Versions
    status: Implemented
    api: "POST /api/payroll/statutory-configurations/{id}/versions"
    service: "StatutoryPayrollService.cs (TenantId filter)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurations (TenantId filter)

  - id: F-STAT-017
    name: AddVersionAsync records a StatutoryConfigurationHistory row of type VersionAdded on the owning configuration
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.AddVersionAsync -> History"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationHistories

  - id: F-STAT-018
    name: "StatutoryConfigurationRules (EmployeeRate, EmployerRate, WageCeiling, FixedAmount, OptionalMonth, TaxRegime) is accepted with NO range or sign validation whatsoever - a negative rate, a rate above 100, or a negative WageCeiling are all persisted and later applied verbatim by CalculateAsync"
    group: Statutory Configuration and Versions
    status: Implemented
    service: "StatutoryPayrollService.AddVersionAsync (no validation on request.Rules fields)"
    permission: "Payroll.Statutory.Manage"
    db: StatutoryConfigurationVersions.ConfigurationJson

  # =========================== B. EMPLOYEE STATUTORY PROFILE ===========================
  - id: F-STAT-019
    name: "GetProfileAsync returns the single row with the latest EffectiveFrom for the employee - not necessarily the one that is IsActive or that would actually be selected by CalculateAsync for a specific payroll period"
    group: Employee Statutory Profile
    status: Implemented
    api: "GET /api/payroll/employees/{employeeId}/statutory-profile"
    service: "StatutoryPayrollService.GetProfileAsync"
    permission: "Payroll.EmployeeStatutory.View"
    db: EmployeeStatutoryProfiles

  - id: F-STAT-020
    name: SaveProfileAsync requires the employee to exist in the tenant, else NotFound
    group: Employee Statutory Profile
    status: Implemented
    api: "PUT /api/payroll/employees/{employeeId}/statutory-profile"
    service: "StatutoryPayrollService.SaveProfileAsync"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: Employees (existence check)

  - id: F-STAT-021
    name: SaveProfileAsync requires EffectiveTo>=EffectiveFrom, else Invalid
    group: Employee Statutory Profile
    status: Implemented
    api: "PUT /api/payroll/employees/{employeeId}/statutory-profile"
    service: "StatutoryPayrollService.SaveProfileAsync"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: "n/a"

  - id: F-STAT-022
    name: "SaveProfileAsync always INSERTS a new profile row - there is no update path - and rejects Conflict when the new date range overlaps any existing profile row for the employee regardless of that row's own IsActive flag"
    group: Employee Statutory Profile
    status: Implemented
    api: "PUT /api/payroll/employees/{employeeId}/statutory-profile"
    service: "StatutoryPayrollService.SaveProfileAsync"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles

  - id: F-STAT-023
    name: "The profile overlap check is backed by a non-unique index (TenantId, EmployeeId, EffectiveFrom, EffectiveTo) - the identical app-level-only race window as F-STAT-011, here for two concurrent SaveProfileAsync calls on the same employee"
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.SaveProfileAsync"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles (non-unique index only)

  - id: F-STAT-024
    name: JurisdictionCode/StateCode are trimmed and upper-cased on save
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.SaveProfileAsync"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles.JurisdictionCode, StateCode

  - id: F-STAT-025
    name: SaveProfileAsync records an EmployeeStatutoryProfileHistory row (always ChangeType=Created) carrying a full JSON snapshot of the request
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.SaveProfileAsync -> EmployeeStatutoryProfileHistories.Add"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfileHistories

  - id: F-STAT-026
    name: "StatutoryProfileChangeType.Updated/Activated/Deactivated are declared enum members that no method anywhere ever assigns - every history row for this entity is permanently ChangeType=Created, the identical dead-enum-state shape as qa/12-bonus-variable-pay's CR-214"
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.cs (full grep for StatutoryProfileChangeType.Updated/Activated/Deactivated - zero matches)"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfileHistories.ChangeType

  - id: F-STAT-027
    name: "EmployeeStatutoryProfile.Uan/EsiNumber are independent of, and never read from or written to, Employee.UanNumber/EsicNumber (the legacy Personal Details fields rendered on PersonalDetailsForm's own, unrelated 'Statutory & Benefits' section) - the two identifier pairs can silently diverge for the same employee"
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.cs / EmployeeService.cs (full grep - no cross-reference between the two field pairs)"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles.Uan, EsiNumber vs Employees.UanNumber, EsicNumber

  - id: F-STAT-028
    name: "CONFIRMED FRONTEND GAP - getEmployeeStatutoryProfile/saveEmployeeStatutoryProfile exist as client functions in src/api/payroll.ts but are never called from any page component anywhere in the frontend (full grep) - the record that actually drives F-STAT-031's calculation eligibility has zero UI surface"
    group: Employee Statutory Profile
    status: Implemented
    service: "Frontend/HRMS.Web/src/api/payroll.ts (functions exist); full grep of src/pages for either function name - zero matches"
    permission: "Payroll.EmployeeStatutory.View, Payroll.EmployeeStatutory.Manage"
    db: "n/a"

  - id: F-STAT-029
    name: A cross-tenant employeeId on profile get/save is NotFound, not Forbidden
    group: Employee Statutory Profile
    status: Implemented
    api: "GET, PUT /api/payroll/employees/{employeeId}/statutory-profile"
    service: "StatutoryPayrollService.cs (TenantId filter)"
    permission: "Payroll.EmployeeStatutory.View, Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles (TenantId filter)

  - id: F-STAT-030
    name: "IsActive on the profile IS correctly enforced as a calculation gate - CalculateAsync's own profile lookup filters x.IsActive directly - unlike several other 'declared but never read' flags found elsewhere in this module (a positive-confirmation case, not a gap)"
    group: Employee Statutory Profile
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync (profile query includes x.IsActive)"
    permission: "Payroll.EmployeeStatutory.Manage"
    db: EmployeeStatutoryProfiles.IsActive

  # =========================== C. CONTRIBUTION CALCULATION ENGINE ===========================
  - id: F-STAT-031
    name: "CalculateAsync is a documented no-op - Result.Success(new(0,0,[]), 'No statutory profile is configured.') - when no EmployeeStatutoryProfile row is active and effective on the PayrollResult's own PeriodEndDate; the surrounding payroll calculation proceeds to completion with zero statutory deductions and no separate warning surfaced to the caller"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a (invoked internally by PayrollCalculationEngine)"
    db: EmployeeStatutoryProfiles

  - id: F-STAT-032
    name: "Profile selection is the single most-recently-effective-from row matching TenantId/EmployeeId/IsActive/EffectiveFrom<=PeriodEndDate/(EffectiveTo==null or >=PeriodEndDate) - OrderByDescending(EffectiveFrom).FirstOrDefault, not an exact-date match"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: EmployeeStatutoryProfiles

  - id: F-STAT-033
    name: Each of ProvidentFund/Esi/ProfessionalTax/IncomeTax is processed independently, gated solely by its own profile Applicable flag
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: "n/a"

  - id: F-STAT-034
    name: "Configuration matching for an applicable type requires the SAME TenantId, IsActive configuration, matching StatutoryType and JurisdictionCode, and (configuration StateCode is null OR equals the profile's own StateCode)"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: StatutoryConfigurations

  - id: F-STAT-035
    name: "Among matching configurations, only versions with Status=Active whose date range covers PeriodEndDate are eligible, and the highest-Priority match among them wins"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: StatutoryConfigurationVersions

  - id: F-STAT-036
    name: "A tie in the highest Priority among eligible versions fails the WHOLE CalculateAsync call Conflict ('Statutory configuration is ambiguous for {type}') - which, via PayrollCalculationErrorCode.StatutoryCalculationFailed, fails the ENTIRE employee's payroll calculation for the run, not just that one statutory type"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: "n/a"

  - id: F-STAT-037
    name: "If zero configurations/versions match an applicable type, that type is silently skipped ('continue') - no PayrollStatutoryResult row, no error, no warning is ever produced; the type simply contributes nothing to the payslip"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: "n/a"

  - id: F-STAT-038
    name: "ResolveBasisAsync sums CalculatedAmount*Weight/100 over the result's own PayrollResultComponents whose SalaryComponentId matches an Included StatutoryComponentBasis row on the selected version - components not listed contribute nothing"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.ResolveBasisAsync"
    permission: "n/a"
    db: StatutoryComponentBasis

  - id: F-STAT-039
    name: "A version with zero StatutoryComponentBasis rows returns a NULL basis, not zero. For ProvidentFund/Esi this forces Invalid('basis', 'No statutory basis is configured for {type}'), aborting the whole employee calculation; for ProfessionalTax/IncomeTax the same null instead silently falls back to result.GrossEarnings - a materially more permissive default for the two slab-based types than for PF/ESI"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync (amountBasis = basis ?? result.GrossEarnings, then the PF/Esi-only null check)"
    permission: "n/a"
    db: "n/a"

  - id: F-STAT-040
    name: A configured WageCeiling (when >0) clamps the resolved basis via Math.Min BEFORE any rate or slab lookup, and the clamped value is what is persisted as both the calculation basis and AppliedCeiling context
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: PayrollStatutoryResults.AppliedCeiling

  - id: F-STAT-041
    name: "For ProvidentFund/Esi, EmployeeAmount and EmployerAmount are computed and rounded INDEPENDENTLY from the (possibly different) EmployeeRate/EmployerRate - neither is derived from the other - each defaulting to 0 when its own rate is null"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: PayrollStatutoryResults.EmployeeAmount, EmployerAmount

  - id: F-STAT-042
    name: "For ProfessionalTax/IncomeTax, a single StatutorySlab row is matched (FromAmount<=basis<=ToAmount-or-null, optional OptionalMonth==PeriodEndDate.Month gate, ordered by Sequence, first match wins) and EmployeeAmount = round(FixedAmount + basis*Rate/100); EmployerAmount is always 0 for these two types"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync"
    permission: "n/a"
    db: StatutorySlabs

  - id: F-STAT-043
    name: "OptionalMonth restricts a slab to a single calendar month (e.g. a February-only supplementary PT slab) - a slab with OptionalMonth set is never matched in any other month, independent of any other slab's own configuration"
    group: Contribution Calculation Engine
    status: Implemented
    service: "StatutoryPayrollService.CalculateAsync (slab query's OptionalMonth predicate)"
    permission: "n/a"
    db: StatutorySlabs.OptionalMonth

  - id: F-STAT-044
