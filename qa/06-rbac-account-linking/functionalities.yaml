  - id: F-RBAC-086
    name: "An operator with AccountEmployeeLink.Manage cannot change THEIR OWN link (link, unlink or replace) - hard-blocked server-side (Forbidden) AND hidden client-side (the account dropdown filters out the signed-in user's own id)"
