  - id: F-RBAC-044
    name: "Because ONLY SuperAdmin and TenantAdmin actually hold RoleManagement.AssignmentManage in the seeded matrix, the 'only an existing SuperHR may grant SuperHR' rule can currently only ever be exercised by a SuperAdmin/TenantAdmin acting as the assigner - no seeded SuperHR account can itself call this endpoint to promote a peer, unless a SuperHR account first uses the CR-66 PageAccess.Manage path to grant its own role AssignmentManage"
    group: Assignment
