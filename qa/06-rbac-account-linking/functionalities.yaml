  - id: F-RBAC-099
    name: "SuperAdmin and TenantAdmin are EXCLUDED from AccountEmployeeLink.* by RolePermissionMap's explicit .Where(x => !x.StartsWith(\"AccountEmployeeLink.\")) filter - a SuperAdmin gets 403 on every account-employee-link route despite holding literally every other permission in the system (see also Module 5's EMP-SEC-012)"
