    permission: "RoleAssignment.AssignmentManage"
    db: "Roles"

  - id: F-RBAC-052
    name: A concurrent duplicate/overlapping assignment race (two simultaneous assigns of the same role to the same user) leaves exactly one UserRole row and resolves via Serializable-transaction retry with a bounded 3-attempt deadlock loop
    group: Assignment
