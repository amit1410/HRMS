    db: "UserRoles"
    ex: ["xU:RoleAssignmentServiceTests.Super_hr_revocation_preserves_the_last_active_assignment"]

  - id: F-RBAC-046
    name: Assignment and revocation history is per-user and per-assignment, ordered chronologically, immutable (append-only UserRoleAssignmentEvents), and tenant-isolated
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage History tab / AssignmentDetails 'View History'"
