  - id: F-RBAC-084
    name: A cross-tenant userId is likewise indistinguishable from a nonexistent one, since Users.SingleOrDefaultAsync is tenant-filtered
    group: Account Link
    status: Implemented
    ui: "n/a"
    api: "POST /api/account-employee-links/users/{crossTenantUserId}/link"
    service: "AccountEmployeeLinkService.MutateAsync"
    permission: "AccountEmployeeLink.Manage"
    db: "Users"

  - id: F-RBAC-085
    name: An inactive user account (IsActive=false) cannot be the SUBJECT of a link mutation - rejected as Conflict ('The account is inactive'), even by a caller who otherwise holds Manage
    group: Account Link
