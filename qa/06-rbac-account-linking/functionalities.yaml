  - id: F-RBAC-094
    name: "The controller stacks BOTH [HasPermission(View)] and [HasPermission(Manage)] on every mutating action (link/unlink/replace/candidates) - ASP.NET Core's multiple-Authorize-attribute semantics require BOTH to hold (logical AND), so Manage alone (without View) is insufficient"
