    permission: "EmploymentHistory.Change"
    db: "AccountEmployeeCurrentLinks"

  - id: F-RBAC-063
    name: The Manager role is granted at most once per manager's linked account - a second/third direct report assigned to the same already-Manager-role-holding account does not create a duplicate UserRoles row
    group: Manager Role
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees/{id1}/employment-history then POST /api/employees/{id2}/employment-history (same manager)"
    service: "ManagerRoleProvisioningService.EnsureForLinkedEmployeeAsync (alreadyAssigned guard)"
    permission: "EmploymentHistory.Change"
    db: "UserRoles"

  - id: F-RBAC-064
    name: "A future-dated employment change naming a manager (EffectiveFrom in the future) STILL provisions the Manager role today - EnsureForManagerEmployeeAsync's own 'is currently a manager' probe checks EffectiveTo (or null) >= today, not EffectiveFrom <= today, so a not-yet-effective manager assignment is enough"
    group: Manager Role
    status: Needs clarification
    ui: "n/a"
    api: "POST /api/employees/{id}/employment-history (ManagerId set, EffectiveFrom in the future)"
    service: "ManagerRoleProvisioningService.EnsureForManagerEmployeeAsync (x.EffectiveTo == null || x.EffectiveTo >= today - no lower bound against EffectiveFrom)"
    permission: "EmploymentHistory.Change"
    db: "EmployeeEmploymentHistory, UserRoles"
    cr: [CR-70]

  - id: F-RBAC-065
    name: "Manager role provisioning is deliberately additive/one-way - there is no code path anywhere that REMOVES the Manager role once a manager's last direct report is reassigned elsewhere (documented in the service's own XML doc comment)"
    group: Manager Role
    status: Needs clarification
    ui: "n/a (RoleManagementPage never shows an automatic revoke for Manager)"
    api: "n/a - no removal endpoint reachable for a System-sourced Manager assignment (also blocked by F-RBAC-036's system-role guard)"
    service: "ManagerRoleProvisioningService (XML doc: 'Role assignment is deliberately additive... never removed here')"
    permission: "n/a"
    db: "UserRoles"
    cr: [CR-71]

  - id: F-RBAC-066
    name: "There is no startup/seed reconciliation job that re-scans all current manager relationships and back-fills missing Manager role assignments - provisioning fires only at the moment an employment-history change is recorded"
    group: Manager Role
    status: Needs clarification
    ui: "n/a"
    api: "n/a"
    service: "repo-wide search: ManagerRoleProvisioningService is invoked from exactly one call site (EmployeeEmploymentService.CreateChangeAsync) and DatabaseInitializer performs no manager-role reconciliation pass"
    permission: "n/a"
    db: "n/a"
    cr: [CR-72]

  - id: F-RBAC-067
    name: A manager assigned via the LEGACY full-record path (Employee.ReportingManagerId, set through PUT /api/employees/{id}) does NOT trigger Manager-role provisioning - only a POST to the Employment History endpoint does
    group: Manager Role
    status: Needs clarification
    ui: "n/a"
    api: "PUT /api/employees/{id} (ReportingManagerId changed)"
    service: "EmployeeService.UpdateAsync (no ManagerRoleProvisioning call anywhere in this method)"
    permission: "Employee.Edit"
    db: "UserRoles (unaffected)"
    cr: [CR-72]

  - id: F-RBAC-068
    name: A manager with multiple current direct reports is provisioned the Manager role exactly once, at whichever direct report's employment change is recorded first
    group: Manager Role
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees/{reportA}/employment-history, POST /api/employees/{reportB}/employment-history (same manager)"
    service: "ManagerRoleProvisioningService.EnsureForLinkedEmployeeAsync"
    permission: "EmploymentHistory.Change"
    db: "UserRoles"

  - id: F-RBAC-069
    name: A former manager (every direct report reassigned away, or the manager's own employment ended) is never automatically stripped of the Manager role or its scope-narrowing effect on the Employee module (see also Module 5's CR-57)
    group: Manager Role
    status: Needs clarification
    ui: "n/a"
    api: "n/a"
    service: "ManagerRoleProvisioningService (additive-only, per F-RBAC-065)"
    permission: "n/a"
    db: "UserRoles"
    cr: [CR-71]

  - id: F-RBAC-070
    name: A manager who currently has zero direct reports (never assigned any, or all reassigned) simply never receives the Manager role in the first place - EnsureForManagerEmployeeAsync's own precondition (AnyAsync ManagerId == employeeId) is false
    group: Manager Role
    status: Implemented
    ui: "n/a"
    api: "n/a"
    service: "ManagerRoleProvisioningService.EnsureForManagerEmployeeAsync"
    permission: "n/a"
    db: "EmployeeEmploymentHistory"

