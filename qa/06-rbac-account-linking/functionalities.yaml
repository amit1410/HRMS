# Functionality registry for Module 6 - RBAC / Role Management / Account<->Employee Linking / Access Control.
# Every test case references one or more of these ids; the builder fails if a functionality has zero cases
# or a case references an unknown id.
#
# Discovered implementation (authoritative source, read directly - not assumed from docs/ or the brief's
# expected-role list):
#   Backend/HRMS.Domain/Authorization/Permissions.cs, RoleNames.cs
#   Backend/HRMS.Domain/Entities/Role.cs, Permission.cs, RolePermission.cs, User.cs, UserRole.cs,
#     UserRoleAssignmentScope.cs, UserRoleAssignmentEvent.cs, AccountEmployeeCurrentLink.cs,
#     AccountEmployeeLinkEvent.cs, AuthorizationConfigurationEvent.cs
#   Backend/HRMS.Domain/Enums/RoleAssignmentSource.cs, RoleScopeType.cs, UserRoleAssignmentEventType.cs,
#     AuthorizationConfigurationEventType.cs
#   Backend/HRMS.API/Controllers/RoleAssignmentsController.cs, AccountEmployeeLinksController.cs,
#     PageAccessController.cs (+ NavigationController), MeController.cs
#   Backend/HRMS.API/Security/HasPermissionAttribute.cs
#   Backend/HRMS.Application/Services/RoleAssignmentService.cs, AccountEmployeeLinkService.cs,
#     PageAccessService.cs, RoleResolutionService.cs, RoleScopeResolver.cs, EmployeeRoleProvisioningService.cs,
#     ManagerRoleProvisioningService.cs, AuthService.cs (GetCurrentUserAsync/IssueTokensAsync/
#     ResolveEmployeeIdentityAsync/LoadAuthorizationAsync), EmployeeIdentityResolver.cs,
#     EmployeeEmploymentService.cs (the EnsureForManagerEmployeeAsync call site)
#   Backend/HRMS.Application/Authorization/ApplicationPageCatalog.cs
#   Backend/HRMS.Application/DTOs/Roles/RoleAssignmentDtos.cs, DTOs/AccountEmployeeLinks/
#     AccountEmployeeLinkDtos.cs, DTOs/Authorization/PageAccessDtos.cs, DTOs/Auth/AuthenticatedUserDto.cs
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RoleIds, PermissionIds, RolePermissionMap)
#   Frontend/HRMS.Web/src/pages/administration/RoleManagementPage.tsx, PageAccessManagementPage.tsx,
#     AccountEmployeeLinksPage.tsx; src/auth/permissions.ts; src/layout/navigation.ts
#   Existing xUnit: RoleAssignmentServiceTests, RoleAssignmentConcurrencyTests, AccountEmployeeLinkServiceTests,
#     AccountEmployeeLinkEndpointTests, RoleResolutionServiceTests, RoleScopeResolverTests,
#     MySqlPageAccessAuthorizationIntegrationTests, AuthorizationMatrixTests, SeedDataTests
#   Existing Vitest: RoleManagementPage.test.tsx, PageAccessManagementPage.test.tsx,
#     AccountEmployeeLinksPage.test.tsx, auth/permissions.mirror.test.ts, layout/navigation.test.ts
#
# ── The actual role inventory (source-verified, NOT the brief's example list) ──────────────────────────
# 14 roles exist, ALL seeded/fixed with hardcoded ids (SeedData.RoleIds) - there is NO create/edit/delete
# Role Master API anywhere in the codebase. RoleAssignmentsController exposes only GET .../roles (list) and
# PageAccessController exposes GET/PUT of a role's PERMISSION SET (not the role row itself - name/description
# are immutable, seeded). The roles: SuperAdmin, TenantAdmin, HRAdmin, HRManager, Manager, Employee,
# AccountLinkAdministrator, AccountLinkAuditor, EmployeeRelationshipOfficer (ERO), HRBP, TimeManager, IT,
# Accounts, SuperHR. Employee and Manager are "system-managed": RoleAssignmentService.AssignAsync/RevokeAsync
# explicitly reject a manual assign/revoke of either (F-RBAC-036), and GetRolesAsync's assignableOnly=true
# filters them out of the assignable list.
#
# ── The single highest-impact finding in this module ───────────────────────────────────────────────────
# PageAccessService.UpdateAsync (PUT /api/page-access/roles/{roleId}), gated only by PageAccess.Manage, lets
# the caller replace ANY role's ENTIRE permission set with ANY subset of Permissions.All - with no check that
# the caller already holds the permissions being granted, no carve-out for RoleManagement.* or
# AccountEmployeeLink.* (the very carve-out SuperAdmin/TenantAdmin are deliberately denied via
# RolePermissionMap), and no restriction on which role id is targeted (including SuperAdmin's or
# TenantAdmin's own row). PageAccess.Manage is held by SuperAdmin, TenantAdmin, HRAdmin and SuperHR
# (SeedData.RolePermissionMap). HRAdmin holds no RoleManagement.* permission at all and SuperHR holds only
# RoleManagement.View/AssignmentView (not AssignmentManage) - both can nonetheless reach full role
# administration, and both can grant themselves AccountEmployeeLink.Manage (defeating the
# AccountEmployeeLink carve-out entirely), through this one endpoint. See CR-66.

functionalities:
  # ── A. Role Master / Inventory (list-only; no create/edit/delete Role Master API exists) ──────────────
  - id: F-RBAC-001
    name: List all roles (GET /api/role-assignments/roles), ordered by name
    group: Role Master
    status: Implemented
    ui: "RoleManagementPage Roles tab"
    api: "GET /api/role-assignments/roles"
    service: "RoleAssignmentService.GetRolesAsync"
    permission: "RoleAssignment.View"
    db: "Roles"

  - id: F-RBAC-002
    name: "assignableOnly=true excludes the two system-managed roles (Employee, Manager) from the list"
    group: Role Master
    status: Implemented
    ui: "n/a - the frontend always calls assignableOnly=false and filters Employee/Manager client-side instead (AssignDialog); the API's own assignableOnly=true path is reachable only by a direct API call"
    api: "GET /api/role-assignments/roles?assignableOnly=true"
    service: "RoleAssignmentService.GetRolesAsync (x.Name is not (RoleNames.Employee or RoleNames.Manager))"
    permission: "RoleAssignment.View"
    db: "Roles"

  - id: F-RBAC-003
    name: There is no Role Master create/edit/delete/deactivate API - roles are a fixed, seeded, hardcoded-id catalog of exactly 14 rows
    group: Role Master
    status: Needs clarification
    ui: "RoleManagementPage Roles tab is read-only (no Create/Edit/Delete button anywhere in RolesView)"
    api: "n/a - no POST/PUT/DELETE route exists under /api/role-assignments/roles or any other controller"
    service: "SeedData.RoleIds (hardcoded per-role int id, explicitly NOT derived from RoleNames.All position, to survive reordering)"
    permission: "n/a"
    db: "Roles (14 rows, ValueGeneratedNever ids)"
    cr: [CR-66]

  - id: F-RBAC-004
    name: A role's DISPLAYED permission set is fully editable (grant/revoke any of Permissions.All) via Page Access Management, even though the role row itself (name/description) cannot be created, renamed or deleted
    group: Role Master
    status: Implemented
    ui: "PageAccessManagementPage (role selector + per-page/action checkboxes + Save Configuration)"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync"
    permission: "PageAccess.Manage"
    db: "RolePermissions, AuthorizationConfigurationEvents"
    cr: [CR-66]

  - id: F-RBAC-005
    name: Duplicate role name/code cannot be tested - there is no create endpoint through which a duplicate could be submitted
    group: Role Master
    status: Needs clarification
    ui: "n/a"
    api: "n/a"
    service: "n/a"
    permission: "n/a"
    db: "n/a"

  - id: F-RBAC-006
    name: An invalid/unknown roleId on the matrix or update endpoints is rejected with 404, not 400 or 500
    group: Role Master
    status: Implemented
    ui: "n/a"
    api: "GET/PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.BuildMatrixAsync / UpdateAsync (SingleOrDefaultAsync(x => x.Id == roleId))"
    permission: "PageAccess.View / PageAccess.Manage"
    db: "Roles"

  - id: F-RBAC-007
    name: Roles are shared platform reference data, not rows scoped by TenantId - the same Role.Id (e.g. HRBP=10) is used across every tenant database
    group: Role Master
    status: Implemented
    ui: "n/a"
    api: "GET /api/role-assignments/roles"
    service: "Role entity (no TenantId column); SeedData.RoleIds comment explaining why ids are hardcoded rather than positional"
    permission: "n/a"
    db: "Roles"

  - id: F-RBAC-008
    name: Role sorting/filtering/paging on the Roles tab is entirely client-side (search-as-you-type over the already-fetched full list); the API itself returns the whole unpaged list
    group: Role Master
    status: Implemented
    ui: "RoleManagementPage RolesView search box"
    api: "GET /api/role-assignments/roles"
    service: "n/a"
    permission: "RoleAssignment.View"
    db: "n/a"

  - id: F-RBAC-009
    name: "'System managed' badge on the Roles tab is computed client-side from a hardcoded SYSTEM_ROLES set (Employee, Manager), independent of the assignableOnly server flag"
    group: Role Master
    status: Implemented
    ui: "RoleManagementPage RolesView 'Management Type' column"
    api: "n/a"
    service: "n/a (frontend SYSTEM_ROLES constant duplicates the server's Employee/Manager special-case)"
    permission: "n/a"
    db: "n/a"

  - id: F-RBAC-010
    name: Tenant isolation for the role list is a non-issue by construction - GetRolesAsync reads the whole (tenant-independent) Roles table once a caller is authenticated to any tenant
    group: Role Master
    status: Implemented
    ui: "n/a"
    api: "GET /api/role-assignments/roles"
    service: "RoleAssignmentService.GetRolesAsync (no TenantId filter - Roles carries none)"
    permission: "RoleAssignment.View"
    db: "Roles"

  # ── B. Role Permissions (the matrix; grant/revoke via Page Access Management) ──────────────────────────
  - id: F-RBAC-011
    name: The permission matrix for a role lists every catalogued page, each page's CanView (any RequiredPermissions granted) and each action's individually Allowed flag
    group: Role Permissions
    status: Implemented
    ui: "PageAccessManagementPage page/action checkbox grid"
    api: "GET /api/page-access/roles/{roleId}"
    service: "PageAccessService.BuildMatrixAsync"
    permission: "PageAccess.View"
    db: "RolePermissions, Roles"

  - id: F-RBAC-012
    name: The 9 seeded roles' exact default permission sets, one functionality per role (source - SeedData.RolePermissionMap)
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "GET /api/page-access/roles/{roleId}"
    service: "SeedData.RolePermissionMap"
    permission: "PageAccess.View"
    db: "RolePermissions"
    ex: ["xU:SeedDataTests.Role_permission_grants_match_the_seed_map"]

  - id: F-RBAC-013
    name: "SuperAdmin and TenantAdmin are both granted every permission in Permissions.All EXCEPT the three AccountEmployeeLink.* permissions - an explicit, deliberate carve-out"
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "GET /api/page-access/roles/{roleId}"
    service: "SeedData.RolePermissionMap[SuperAdmin]/[TenantAdmin] (DomainPermissions.All.Where(x => !x.StartsWith(\"AccountEmployeeLink.\")))"
    permission: "PageAccess.View"
    db: "RolePermissions"

  - id: F-RBAC-014
    name: HRAdmin holds a broad Employee/Attendance/Payroll/Separation/PageAccess permission set but ZERO RoleManagement.* permissions - cannot open or use Role Management's assignment screen at all
    group: Role Permissions
    status: Implemented
    ui: "n/a (HRAdmin never sees the 'Role Management' nav item - it requires RoleAssignment.View)"
    api: "GET /api/role-assignments/roles"
    service: "SeedData.RolePermissionMap[HRAdmin]"
    permission: "RoleAssignment.View (absent for HRAdmin)"
    db: "RolePermissions"

  - id: F-RBAC-015
    name: SuperHR holds RoleManagement.View and RoleManagement.AssignmentView but NOT RoleManagement.AssignmentManage - can browse Role Management's Assignments/Roles/History tabs read-only but cannot assign or revoke a role
    group: Role Permissions
    status: Implemented
    ui: "RoleManagementPage 'Assign Role' button hidden for SuperHR (canManage = can(assignmentManage))"
    api: "POST /api/role-assignments/users/{userId} (SuperHR gets 403)"
    service: "SeedData.RolePermissionMap[SuperHR]"
    permission: "RoleAssignment.AssignmentManage (absent for SuperHR)"
    db: "RolePermissions"

  - id: F-RBAC-016
    name: PUT /api/page-access/roles/{roleId} grants requested permissions not already held (adds RolePermission rows) and revokes currently-held permissions not in the request (removes RolePermission rows) in one call - a full-replace semantic, not additive
    group: Role Permissions
    status: Implemented
    ui: "PageAccessManagementPage Save Configuration"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync"
    permission: "PageAccess.Manage"
    db: "RolePermissions"

  - id: F-RBAC-017
    name: Every grant and every revoke writes an immutable AuthorizationConfigurationEvent (RolePermissionGranted/RolePermissionRevoked) carrying the permission code, actor, reason and old/new value
    group: Role Permissions
    status: Implemented
    ui: "PageAccessManagementPage History tab"
    api: "PUT /api/page-access/roles/{roleId} then GET /api/page-access/history"
    service: "PageAccessService.UpdateAsync / GetHistoryAsync"
    permission: "PageAccess.Manage / PageAccess.View"
    db: "AuthorizationConfigurationEvents"

  - id: F-RBAC-018
    name: An unknown permission string in the update request is rejected with 400 before any write occurs
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync (Permissions.All.ToHashSet check)"
    permission: "PageAccess.Manage"
    db: "none"

  - id: F-RBAC-019
    name: Duplicate permission names in the request body are collapsed (Distinct, ordinal) before processing - submitting the same permission twice is not an error
    group: Role Permissions
    status: Implemented
    ui: "n/a (checkbox UI cannot itself produce duplicates; only a direct API call can)"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync (request.Permissions.Distinct(StringComparer.Ordinal))"
    permission: "PageAccess.Manage"
    db: "none"

  - id: F-RBAC-020
    name: "PageAccessService.UpdateAsync applies to ANY roleId with no restriction on which role is targeted, no check that the caller's OWN role already holds the permissions being granted, and no carve-out for RoleManagement.* or AccountEmployeeLink.* - a caller holding only PageAccess.Manage can grant their own role every permission in Permissions.All, including AccountEmployeeLink.Manage and RoleManagement.AssignmentManage"
    group: Role Permissions
    status: Needs clarification
    ui: "PageAccessManagementPage (role selector includes every role, including the caller's own and SuperAdmin/TenantAdmin's)"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync"
    permission: "PageAccess.Manage"
    db: "RolePermissions"
    cr: [CR-66]

  - id: F-RBAC-021
    name: A revoke-then-re-grant of the same permission on the same role produces two distinct, separately-timestamped audit events, not one merged event
    group: Role Permissions
    status: Implemented
    ui: "PageAccessManagementPage History tab"
    api: "PUT /api/page-access/roles/{roleId} (twice)"
    service: "PageAccessService.UpdateAsync"
    permission: "PageAccess.Manage"
    db: "AuthorizationConfigurationEvents"

  - id: F-RBAC-022
    name: The permission-matrix update runs inside a Serializable transaction
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "PUT /api/page-access/roles/{roleId}"
    service: "PageAccessService.UpdateAsync (BeginTransactionAsync(IsolationLevel.Serializable))"
    permission: "PageAccess.Manage"
    db: "RolePermissions, AuthorizationConfigurationEvents"

  - id: F-RBAC-023
    name: A permission held through TWO different roles a user holds is reported once (deduplicated), not twice, in the effective/JWT permission list
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "GET /api/auth/me (or login response)"
    service: "AuthService.LoadAuthorizationAsync (.Distinct().OrderBy)"
    permission: "n/a (authenticated)"
    db: "RolePermissions"

  - id: F-RBAC-024
    name: Removing one of two roles that both grant the same permission leaves the permission in effect (retained through the remaining role)
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "POST /api/role-assignments/{assignmentId}/revoke then GET /api/auth/me"
    service: "AuthService.LoadAuthorizationAsync; RoleAssignmentService.RevokeAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles, RolePermissions"

  - id: F-RBAC-025
    name: "A permission/role change takes effect on the user's NEXT token refresh, not on the already-issued access token - the access token embeds Roles/Permissions as claims at mint time and is not re-evaluated per request"
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "PUT /api/page-access/roles/{roleId} (as admin), then the affected user's already-open session keeps old claims until POST /api/auth/refresh"
    service: "AuthService.IssueTokensAsync (comment: 'Roles and permissions are re-read from the database, so an administrator's change takes effect on the next refresh')"
    permission: "n/a"
    db: "RolePermissions"

  - id: F-RBAC-026
    name: GET /api/auth/me (current-user) re-reads roles/permissions from the database on every call, so it reflects a permission change immediately even while the caller's access token still carries the stale claim set
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "GET /api/auth/me"
    service: "AuthService.GetCurrentUserAsync (calls LoadAuthorizationAsync fresh, independent of the bearer token's own claims)"
    permission: "n/a (authenticated)"
    db: "UserRoles, RolePermissions"

  - id: F-RBAC-027
    name: Only effective-dated role assignments (EffectiveFrom<=today<=EffectiveTo) contribute permissions - a Scheduled or Expired assignment's role is excluded from both the JWT and GET /api/auth/me
    group: Role Permissions
    status: Implemented
    ui: "n/a"
    api: "GET /api/auth/me"
    service: "RoleResolutionService.GetEffectiveRoleIdsAsync"
    permission: "n/a"
    db: "UserRoles"
    ex: ["xU:RoleResolutionServiceTests.Active_assignment_resolves_and_effective_end_date_is_inclusive", "xU:RoleResolutionServiceTests.Future_assignment_does_not_resolve_before_its_start_date", "xU:RoleResolutionServiceTests.Expired_assignment_does_not_resolve"]

  # ── C. User-Role Assignment ────────────────────────────────────────────────────────────────────────────
  - id: F-RBAC-028
    name: List role assignments, paged, filterable by role/status/source/search, ordered by EffectiveFrom desc
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage Assignments tab"
    api: "GET /api/role-assignments"
    service: "RoleAssignmentService.GetAssignmentsAsync"
    permission: "RoleAssignment.View"
    db: "UserRoles, Users, AccountEmployeeCurrentLinks, Employees, UserRoleAssignmentEvents"
    ex: ["xU:RoleAssignmentServiceTests.Assignment_listing_returns_authoritative_statuses_and_server_side_filters"]

  - id: F-RBAC-029
    name: "Status is computed server-side (Active/Scheduled/Expired/Revoked), not stored - Revoked wins over the date-derived status even if EffectiveTo has not yet passed"
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage status Badge"
    api: "GET /api/role-assignments"
    service: "RoleAssignmentService.Map (status computation order: revoked, then Scheduled, then Expired, else Active)"
    permission: "RoleAssignment.View"
    db: "UserRoleAssignmentEvents"

  - id: F-RBAC-030
    name: Search matches the assigned user's name/email OR, via the account's current employee link, the linked employee's code/name
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage Assignments search box"
    api: "GET /api/role-assignments?search="
    service: "RoleAssignmentService.GetAssignmentsAsync"
    permission: "RoleAssignment.View"
    db: "Users, AccountEmployeeCurrentLinks, Employees"

  - id: F-RBAC-031
    name: List candidates for role assignment - active users in the caller's tenant, excluding the caller themselves, with their linked employee's department/designation/location if any
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage AssignDialog user selector"
    api: "GET /api/role-assignments/candidates"
    service: "RoleAssignmentService.GetCandidatesAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "Users, AccountEmployeeCurrentLinks, Employees"
    ex: ["xU:RoleAssignmentServiceTests.Role_management_candidates_are_tenant_scoped_and_do_not_require_link_permissions"]

  - id: F-RBAC-032
    name: Get all role assignments for a specific user
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage AssignmentDetails 'All roles for this user'"
    api: "GET /api/role-assignments/users/{userId}"
    service: "RoleAssignmentService.GetUserAssignmentsAsync"
    permission: "RoleAssignment.View"
    db: "UserRoles"

  - id: F-RBAC-033
    name: Assign a role to a user with explicit EffectiveFrom (required) and optional EffectiveTo; EffectiveTo before EffectiveFrom is rejected
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage AssignDialog"
    api: "POST /api/role-assignments/users/{userId}"
    service: "RoleAssignmentService.AssignAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles, UserRoleAssignmentEvents"
    ex: ["xU:RoleAssignmentServiceTests.Manual_assignment_persists_explicit_dates_actor_reason_and_event"]

  - id: F-RBAC-034
    name: A user can hold the same role in TWO non-overlapping effective periods, or multiple DIFFERENT roles concurrently, without one assignment overwriting another
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage AssignmentDetails 'All roles for this user' list"
    api: "POST /api/role-assignments/users/{userId} (multiple calls)"
    service: "RoleAssignmentService.AssignAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles"
    ex: ["xU:RoleAssignmentServiceTests.User_can_hold_multiple_manual_roles_without_overwriting_assignments"]

  - id: F-RBAC-035
    name: An overlapping assignment of the SAME role to the SAME user (effective periods intersect) is rejected with 409 Conflict
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage AssignDialog error banner"
    api: "POST /api/role-assignments/users/{userId}"
    service: "RoleAssignmentService.AssignAsync (overlap probe before insert, inside a Serializable transaction, retried up to 3 times on deadlock)"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles"
    ex: ["xU:RoleAssignmentServiceTests.Invalid_and_overlapping_periods_are_rejected_but_adjacent_periods_are_allowed"]

  - id: F-RBAC-036
    name: "Employee and Manager roles are system-managed: a manual assign OR revoke of either is rejected (400 Invalid), regardless of the caller's permissions"
    group: Assignment
    status: Implemented
    ui: "AssignDialog role dropdown excludes both (roles.filter(!SYSTEM_ROLES.has))"
    api: "POST /api/role-assignments/users/{userId} (roleId = Employee or Manager's id)"
    service: "RoleAssignmentService.AssignAsync / RevokeAsync (role.Name is RoleNames.Employee or RoleNames.Manager)"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles"
    ex: ["xU:RoleAssignmentServiceTests.System_roles_cannot_be_manually_assigned_or_revoked"]

  - id: F-RBAC-037
    name: Revoking a role that is not currently assigned to that user, or an already-fully-revoked assignment, is reported distinctly (NotFound vs. an idempotent 'already revoked' success) rather than crashing
    group: Assignment
    status: Implemented
    ui: "n/a"
    api: "POST /api/role-assignments/{assignmentId}/revoke"
    service: "RoleAssignmentService.RevokeAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles"

  - id: F-RBAC-038
    name: Revoke accepts an explicit EffectiveTo (defaults to today) that cannot precede the assignment's own EffectiveFrom; it writes a Revoked event and closes the assignment's EffectiveTo
    group: Assignment
    status: Implemented
    ui: "RoleManagementPage RevokeDialog"
    api: "POST /api/role-assignments/{assignmentId}/revoke"
    service: "RoleAssignmentService.RevokeAsync"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoles, UserRoleAssignmentEvents"
    ex: ["xU:RoleAssignmentServiceTests.Revocation_writes_an_immutable_audit_event_and_closes_the_period"]

  - id: F-RBAC-039
    name: Assigning a role with a scope disallowed for that role (e.g. a Department scope on IT/Accounts/SuperHR, which allow none) is rejected; duplicate scope rows (same type+entity) in one request are rejected
    group: Assignment
    status: Implemented
    ui: "AssignDialog scope fieldset (hidden entirely for roles with no allowed scope types)"
    api: "POST /api/role-assignments/users/{userId}"
    service: "RoleAssignmentService.AssignAsync (ScopesAllowed, duplicate GroupBy check)"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoleAssignmentScopes"
    ex: ["xU:RoleAssignmentServiceTests.Invalid_scope_and_duplicate_scope_are_rejected"]

  - id: F-RBAC-040
    name: Only HRBP, Employee Relationship Officer and Time Manager may carry a scope at all (any RoleScopeType value); every other role (including HRAdmin, HRManager, IT, Accounts, SuperHR, AccountLinkAdministrator/Auditor) must be tenant-wide (zero scopes)
    group: Assignment
    status: Implemented
    ui: "AssignDialog SCOPE_TYPES map"
    api: "POST /api/role-assignments/users/{userId}"
    service: "RoleAssignmentService.ScopesAllowed"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoleAssignmentScopes"

  - id: F-RBAC-041
    name: "The frontend's scope-type dropdown for HRBP/ERO/Time Manager offers a NARROWER subset of RoleScopeType than the backend actually accepts (e.g. SubDepartment, Section, SubSection, Function, SubFunction, Country are backend-legal for all three roles but absent from the UI's SCOPE_TYPES map)"
    group: Assignment
    status: Needs clarification
    ui: "RoleManagementPage AssignDialog SCOPE_TYPES constant"
    api: "POST /api/role-assignments/users/{userId} (a UI-unreachable scope type, sent directly)"
    service: "RoleAssignmentService.ScopesAllowed (Enum.GetValues<RoleScopeType>() - all 16 values - for these three roles)"
    permission: "RoleAssignment.AssignmentManage"
    db: "UserRoleAssignmentScopes"
    cr: [CR-67]

  - id: F-RBAC-042
    name: Each requested scope's entity id must exist in the caller's own tenant for its dimension (Department, Grade, WorkLocation, etc.); a nonexistent or cross-tenant id is rejected as Invalid
    group: Assignment
    status: Implemented
