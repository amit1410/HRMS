  - id: F-RBAC-100
    name: "The AccountEmployeeLink carve-out is intentionally separated from the general domain-permission aggregation pattern used elsewhere (SuperAdmin/TenantAdmin get 'everything else' automatically) - but it is enforced only by what RolePermissionMap happens to grant, and PageAccessService.UpdateAsync has no equivalent carve-out logic at all (CR-66), so the separation is a seed-data convention, not a structural guarantee"
