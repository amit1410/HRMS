    permission: "RoleAssignment.AssignmentManage"
    db: "n/a"
    cr: [CR-66]

  - id: F-RBAC-045
    name: Revoking the tenant's LAST currently-effective SuperHR assignment (with an EffectiveTo at or before today) is rejected with 409 - the tenant must always retain at least one effective SuperHR
