    permission: "AccountEmployeeLink.Manage"
    db: "Users, Employees"

  - id: F-RBAC-083
    name: A cross-tenant employeeId (belonging to a different tenant than the caller) resolves as if it does not exist, since Employees.SingleOrDefaultAsync is filtered by the global TenantId query filter
    group: Account Link
    status: Implemented
    ui: "n/a"
