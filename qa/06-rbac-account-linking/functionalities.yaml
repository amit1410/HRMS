  - id: F-RBAC-062
    name: If the newly-assigned manager employee has NO linked account (AccountEmployeeCurrentLinks lookup misses), provisioning is a silent no-op - nothing to grant a role to, and no error surfaces to the employment-change caller
    group: Manager Role
    status: Implemented
