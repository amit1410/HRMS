  - id: F-RBAC-049
    name: An actor CAN assign or revoke a role for themselves (no explicit self-assignment guard exists on RoleAssignmentService.AssignAsync/RevokeAsync, unlike AccountEmployeeLinkService's explicit self-link prohibition) - the only self-protection in this module is SuperHR's own narrower rule (F-RBAC-043)
