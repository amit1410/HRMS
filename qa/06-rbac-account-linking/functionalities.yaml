    cr: [CR-68]

  - id: F-RBAC-050
    name: Assigning/revoking a role for a user in a different tenant, or a nonexistent user, is rejected as NotFound (Account not found) - the tenant filter and an explicit existence check both apply
    group: Assignment
    status: Implemented
