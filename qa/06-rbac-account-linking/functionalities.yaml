  # ── D. Default Employee Role auto-provisioning ────────────────────────────────────────────────────────
  - id: F-RBAC-053
    name: "Linking (or Replacing) an account to an employee auto-provisions the seeded Employee role for that user - System-sourced, effective from today, reason 'Employee account link'"
    group: Employee Role
    status: Implemented
    ui: "n/a (silent side-effect of AccountEmployeeLinksPage's Link/Replace action)"
    api: "POST /api/account-employee-links/users/{userId}/link (or /replace)"
    service: "EmployeeRoleProvisioningService.EnsureForLinkedEmployeeAsync (invoked from AccountEmployeeLinkService.MutateAsync)"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles, UserRoleAssignmentEvents"

  - id: F-RBAC-054
    name: The Employee role is granted at most once per user - a second Link/Replace (e.g. after an intervening unlink-then-relink) does not create a duplicate UserRoles row if the Employee role assignment is still present
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "POST .../link then .../unlink then .../link again"
    service: "EmployeeRoleProvisioningService.EnsureForLinkedEmployeeAsync (UserRoles.AnyAsync guard)"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles"

  - id: F-RBAC-055
    name: Employee-role provisioning is NOT triggered by Employee creation itself, nor by Employment History changes - only by a successful Link or Replace on AccountEmployeeLinkService; creating an Employee row with no linked account grants no role to anyone
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees (create), independently of any link call"
    service: "EmployeeService.CreateAsync (no role-provisioning call anywhere in the Employee create/update path)"
    permission: "Employee.Create"
    db: "UserRoles (unaffected)"

  - id: F-RBAC-056
    name: "Unlinking an account does NOT revoke its previously-provisioned Employee role - the role assignment (and every permission it grants) remains in effect after the link that caused it is gone"
    group: Employee Role
    status: Needs clarification
    ui: "n/a"
    api: "POST /api/account-employee-links/users/{userId}/unlink, then GET /api/role-assignments/users/{userId}"
    service: "AccountEmployeeLinkService.MutateAsync (Unlink branch never calls any *RoleProvisioning service - only Link/Replace do, since target is null on Unlink)"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles (unchanged by Unlink)"
    cr: [CR-69]

  - id: F-RBAC-057
    name: Linking an employee who is ALREADY the AfterEmployeeId of a prior link event for a DIFFERENT (now-unlinked) user does not retroactively touch that other user's roles - provisioning is scoped strictly to the userId of the current Link/Replace call
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "POST /api/account-employee-links/users/{userId}/link"
    service: "EmployeeRoleProvisioningService.EnsureForLinkedEmployeeAsync (tenantId+userId+employeeId scoped)"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles"

  - id: F-RBAC-058
    name: Employee-role provisioning proceeds identically for a terminated/inactive employee's account IF the link itself was already established before termination - provisioning only runs at Link/Replace time, and CR-53's own carry-forward finding means nothing later revokes it (see also CR-69)
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "n/a - not independently re-triggerable after the fact"
    service: "EmployeeRoleProvisioningService.EnsureForLinkedEmployeeAsync"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles"
    cr: [CR-53]

  - id: F-RBAC-059
    name: If the seeded Employee role is somehow missing from the Roles table, provisioning logs a warning and silently returns rather than throwing - a Link/Replace still succeeds, just without granting the role
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "n/a - not reachable against the seeded database; documented defensive branch"
    service: "EmployeeRoleProvisioningService.EnsureForLinkedEmployeeAsync (roleId is null branch)"
    permission: "n/a"
    db: "Roles"

  - id: F-RBAC-060
    name: Employee-role provisioning and the link mutation happen inside the SAME database transaction and the same SaveChangesAsync call as the link event itself - an audit-write failure rolls back both together
    group: Employee Role
    status: Implemented
    ui: "n/a"
    api: "POST /api/account-employee-links/users/{userId}/link"
    service: "AccountEmployeeLinkService.MutateAsync (single BeginTransactionAsync .. SaveChangesAsync .. CommitAsync wrapping both the link event and the role provisioning)"
    permission: "AccountEmployeeLink.Manage"
    db: "UserRoles, AccountEmployeeLinkEvents, AccountEmployeeCurrentLinks"
    ex: ["xU:AccountEmployeeLinkServiceTests.Audit_failure_rolls_back_the_event_and_current_state_together"]

  # ── E. Manager Role auto-provisioning ─────────────────────────────────────────────────────────────────
  - id: F-RBAC-061
    name: "Recording an employment change with a ManagerId provisions the seeded Manager role for that manager's LINKED account - System-sourced, effective today, reason 'Reporting manager assignment' - ONLY if the manager is presently a current (non-superseded, not-yet-ended) manager on at least one EmployeeEmploymentHistory row"
