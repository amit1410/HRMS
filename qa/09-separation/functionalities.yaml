    service: "SeparationService.GetNoticeAsync / GetNoticeHistoryAsync"
    permission: "Separation.ViewHistory"
    db: "EmployeeSeparations, EmployeeSeparationEvents"

  - id: F-SEP-053
    name: Invalid date range at HR approval - approved LWD before request date, before DateOfJoining, before notice start, or after Employee.DateOfLeaving is rejected
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
    service: "SeparationService.HrApproveAsync"
    permission: "Separation.HrReview"
