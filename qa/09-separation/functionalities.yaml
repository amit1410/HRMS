    status: Implemented
    api: "POST /api/separation/{id}/notice/waive"
    service: "SeparationService.ApplyNoticeWaiverAsync"
    permission: "Separation.NoticeWaive"
    db: "EmployeeSeparations"

  - id: F-SEP-049
    name: "Full shortfall waived sets NoticeDisposition=CompanyWaived; partial sets Waived; unwaived shortfall>0 sets Recoverable; no shortfall sets None"
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/notice/waive"
    service: "SeparationService.ApplyNoticeWaiverAsync"
    permission: "Separation.NoticeWaive"
    db: "EmployeeSeparations"

