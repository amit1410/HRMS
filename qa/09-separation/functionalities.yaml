    name: "Approved LWD (ApprovedLastWorkingDate) is stamped only at HrApproveAsync from ProposedLastWorkingDate and becomes the authoritative date for every downstream module"
    group: Last Working Date
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
