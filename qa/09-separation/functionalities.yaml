    group: State Machine
    status: Implemented
    api: "POST /api/separation/{id}/manager-approve"
    service: "SeparationService.ManagerApproveAsync"
    permission: "Separation.ManagerReview"
    db: "EmployeeSeparations, EmployeeSeparationEvents"

  - id: F-SEP-026
    name: "ManagerReview -> Rejected (ManagerReject)"
