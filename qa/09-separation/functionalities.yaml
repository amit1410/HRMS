  # ═══════════════════════════════ C. NOTICE PERIOD ═══════════════════════════════
  - id: F-SEP-039
    name: Required notice days are snapshotted only at HR-approval time from EmployeeEmployment.NoticePeriod/NoticePeriodUnit, not at creation
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
    service: "SeparationService.HrApproveAsync"
    permission: "Separation.HrReview"
    db: "EmployeeSeparations, EmployeeEmployments"

  - id: F-SEP-040
    name: HR approval requires a positive, day-based (NoticePeriodUnit=='Days') employment notice period, else Conflict
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
    service: "SeparationService.HrApproveAsync"
    permission: "Separation.HrReview"
    db: "EmployeeEmployments"

  - id: F-SEP-041
    name: "Notice start = NoticeStartDate ?? RequestDate; expected end = start + required - 1"
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
    service: "SeparationService.HrApproveAsync"
    permission: "Separation.HrReview"
    db: "EmployeeSeparations"

  - id: F-SEP-042
    name: "Served days = max(0, ApprovedLastWorkingDate - NoticeStartDate + 1)"
    group: Notice Period
    status: Implemented
    api: "GET /api/separation/{id}/notice"
    service: "SeparationService.GetNoticeAsync"
    permission: "Separation.ViewHistory"
    db: "EmployeeSeparations"

  - id: F-SEP-043
    name: "Shortfall = max(0, required - served - waived); Extension = max(0, served - required)"
    group: Notice Period
    status: Implemented
    api: "GET /api/separation/{id}/notice"
    service: "SeparationService.GetNoticeAsync"
    permission: "Separation.ViewHistory"
    db: "EmployeeSeparations"

  - id: F-SEP-044
    name: Zero-day / shortened notice (approved LWD close to notice start) is fully supported by the same served/shortfall formulas - no special-case code exists
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/hr-approve"
    service: "SeparationService.HrApproveAsync"
    permission: "Separation.HrReview"
    db: "EmployeeSeparations"

  - id: F-SEP-045
