    name: Pre-approval LWD change (ReviseLwdAsync) is HrReview-status-only and only validates NewLastWorkingDate >= RequestDate - no upper bound / no DateOfLeaving check
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/revise-lwd"
    service: "SeparationService.ReviseLwdAsync"
    permission: "Separation.ReviseLastWorkingDate"
    db: "EmployeeSeparations, EmployeeSeparationEvents"

  - id: F-SEP-055
    name: Backdated pre-approval LWD revision (earlier than an already-set Employee.DateOfLeaving) is silently accepted - no such check exists in ReviseLwdAsync
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/revise-lwd"
    service: "SeparationService.ReviseLwdAsync"
    permission: "Separation.ReviseLastWorkingDate"
    db: "EmployeeSeparations"

  - id: F-SEP-056
    name: Future-dated LWD (well beyond notice requirement) is accepted at both creation and any revision point - no maximum-notice validation exists
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/me, /revise-lwd, /revise-approved-lwd"
    service: "SeparationService.cs"
    permission: "varies"
    db: "EmployeeSeparations"

  # ═══════════════════════════════ E. LAST WORKING DATE ═══════════════════════════════
  - id: F-SEP-057
    name: Requested LWD (ProposedLastWorkingDate) is captured at creation and mutable pre-approval via ReviseLwdAsync
    group: Last Working Date
    status: Implemented
    api: "POST /api/separation/me, /revise-lwd"
