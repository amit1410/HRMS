    status: Implemented
    api: "POST /api/separation/{id}/revise-approved-lwd"
    service: "SeparationService.ReviseApprovedLwdAsync"
    permission: "Separation.ReviseApprovedLastWorkingDate"
    db: "EmployeeSeparations, EmployeeEmployments"

  - id: F-SEP-046
    name: Notice waiver is additive-only (WaivedNoticeDays += WaiverDays), capped at the CURRENT remaining shortfall recomputed each call (supports multiple partial waivers)
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/notice/waive"
    service: "SeparationService.ApplyNoticeWaiverAsync"
    permission: "Separation.NoticeWaive"
    db: "EmployeeSeparations, EmployeeSeparationEvents"

  - id: F-SEP-047
    name: WaiverDays must be > 0, else Invalid; waiver exceeding remaining shortfall is Invalid
    group: Notice Period
    status: Implemented
    api: "POST /api/separation/{id}/notice/waive"
    service: "SeparationService.ApplyNoticeWaiverAsync"
    permission: "Separation.NoticeWaive"
    db: "EmployeeSeparations"

  - id: F-SEP-048
    name: Notice waiver is Approved-status-only and requires the notice snapshot to already exist
