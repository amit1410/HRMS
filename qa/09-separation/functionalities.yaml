# Functionality registry for Module 9 - Separation / Exit Management (Initiation, State Machine, Notice
# Period, Last Working Date, Approval Workflow, Employment/Account Integration, Manager/Leave/Attendance
# Impact, Clearance, Benefits/Recoveries, Exit Interview, Documents, Exit/Offboarding Completion, Final
# Settlement Handoff, Settlement State Machine, Authorization/Scope, Tenant Isolation/Audit/Reports,
# Concurrency/Provider Parity, Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id. IDs are allocated in one global sequence (F-SEP-001...) in
# the order the case files below were authored - group boundaries are noted with a comment banner.
#
# Discovered implementation (authoritative source, read directly across 6 parallel research passes against
# current code; docs/phase-8a...8h.md were read where they exist and current code wins wherever they
# diverge, per CLAUDE.md):
#   Backend/HRMS.API/Controllers/SeparationController.cs, SeparationClearanceController.cs,
#     SeparationBenefitsController.cs, SeparationExitInterviewController.cs, SeparationDocumentController.cs,
#     SeparationExitController.cs, SeparationSettlementController.cs
#   Backend/HRMS.Application/Services/SeparationService.cs, ClearanceService.cs, SeparationBenefitsService.cs,
#     ExitInterviewService.cs, SeparationDocumentService.cs, SeparationExitService.cs,
#     SeparationSettlementOrchestrationService.cs, PayrollRetroSettlementService.cs (Payroll-side settlement)
#   Backend/HRMS.Domain/Entities/EmployeeSeparation.cs, Separation/SeparationClearance.cs, SeparationBenefits.cs,
#     Separation/SeparationExitInterview.cs, Separation/SeparationDocument.cs, Separation/SeparationExitExecution.cs,
#     Separation/SeparationSettlementOrchestration.cs
#   Backend/HRMS.Domain/Enums/SeparationEnums.cs, SeparationClearanceEnums.cs, SeparationBenefitEnums.cs,
#     SeparationExitInterviewEnums.cs, SeparationDocumentEnums.cs, SeparationSettlementEnums.cs
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Separation.*, Payroll.SeparationBenefits.*)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap Separation-family slice)
#   Frontend/HRMS.Web/src/pages/separation/*.tsx (16 pages), src/pages/payroll/SeparationBenefitsPage.tsx,
#     src/api/separation.ts, separationBenefits.ts, separationDocuments.ts, separationExit.ts
#   Existing xUnit (~45 classes touching this surface, none previously classified in
#     qa/tools/existing_test_layers.yaml before this module) and Vitest - see README.md's mapping.
#
# ── Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) ──
# CR-53 is CONFIRMED FIXED here, not merely re-exposed: SeparationExitService.ExecuteAsync is the one and
# only place in the codebase that ever sets EmployeeSeparationStatus.Closed, and it atomically-in-sequence
# (four separately-committed, individually-idempotent checkpoints) sets Employee.Status=Terminated,
# User.IsActive=false, revokes every active RefreshToken, and end-dates every current UserRole - all wired to
# real AuthService.SignIn/RefreshToken checks. CR-66 reconfirms directly: PageAccess.Manage can self-grant
# every Separation-family and Payroll.SeparationBenefits.* permission with no carve-out. CR-77 recurs as (at
# least) a 6th independent, and INTERNALLY DISAGREEING, scope mechanism: SeparationService.GetTeamAsync uses
# IEmployeeManagerResolver while ClearanceService.GetInboxAsync uses the raw legacy Employee.ReportingManagerId
# column in the same module. CR-110 does NOT extend to Comp-Off/Overtime (Separation never reads them) but a
# sibling gap was found: SeparationBenefitsService.CalculateLeaveAsync reads EmployeeLeaveBalances for
# encashment and never marks any quantity reserved/consumed (CR-158). Four EmployeeSeparationStatus values
# (Submitted, NoticePeriod, Exited, Cancelled) are declared but never reachable by any code path (CR-129).

functionalities:
  # ═══════════════════════════════ A. INITIATION ═══════════════════════════════
  - id: F-SEP-001
