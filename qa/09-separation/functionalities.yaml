  # ═══════════════════════════════ B. STATE MACHINE ═══════════════════════════════
  - id: F-SEP-021
    name: "EmployeeSeparationStatus declared order: Draft, Submitted, ManagerReview, HrReview, Approved, Rejected, Withdrawn, NoticePeriod, ReadyForExit, Exited, Cancelled, Closed"
    group: State Machine
    status: Implemented
    api: "n/a (enum)"
    service: "Backend/HRMS.Domain/Enums/SeparationEnums.cs"
    permission: "n/a"
    db: "EmployeeSeparations.Status"

  - id: F-SEP-022
    name: "Submitted, NoticePeriod, Exited, and Cancelled are never assigned by any code path in the repository - dead/unreachable states"
    group: State Machine
    status: Implemented
    api: "n/a"
    service: "Backend/HRMS.Application/Services/SeparationService.cs (repo-wide reachability)"
    permission: "n/a"
    db: "EmployeeSeparations.Status"

  - id: F-SEP-023
