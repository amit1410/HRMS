      - "[GET /api/attendance/employees/{E1}/roster/2026-03-15] => [200] resolved via the D1 rule (S1) - historical dimension used"
      - "[GET /api/attendance/employees/{E1}/roster/2026-04-15] => [200] the D1 rule no longer matches - resolution reflects E1's current D2 dimension"
