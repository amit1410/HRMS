    pri: P1
    steps:
      - "[Setup] Rule R, EffectiveFrom=2026-08-01, EffectiveTo=2026-08-31 => created"
      - "[GET /api/attendance/employees/{matchedEmployeeId}/roster/2026-08-01] => [200] rule applies (inclusive start)"
      - "[GET /api/attendance/employees/{matchedEmployeeId}/roster/2026-08-31] => [200] rule applies (inclusive end)"
      - "[GET /api/attendance/employees/{matchedEmployeeId}/roster/2026-09-01] => [200] rule no longer applies, falls through to next precedence level"
    auto: API

  - id: ATT-APPLIC-016
    func: [F-ATT-027]
    sc: Resolution uses the employee's HISTORICAL effective employment snapshot on the resolution date, not current employment
    t: Resolving a past date uses the department/dimensions the employee held on that date, not today's
