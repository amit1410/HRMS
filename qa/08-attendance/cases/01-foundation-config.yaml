  - id: ATT-UPLOAD-011
    func: [F-ATT-048]
    sc: A batch that fails commit mid-loop due to a scope change since validation is left permanently stuck at Validated
    t: If an employee's authorization scope narrows between validate and commit, commit fails and the batch can never be committed or retried
    src: ["AttendanceFoundationService.CommitRosterUploadAsync"]
    type: Integration-Concurrency
    pri: P1
    role: MANAGER
    perm: "Attendance.RosterUpload"
    steps:
      - "[POST /api/attendance/roster/upload/validate] a manager validates a batch covering employee E1, currently in their scope => [200] batch.Status=Validated"
