      - "[POST /api/attendance/roster/upload/{batchId}/commit] => [403 or Failure] commit fails on E1's row; nothing from this batch is persisted (SaveChanges never reached)"
      - "[POST /api/attendance/roster/upload/{batchId}/commit] retry, same conditions => [403 or Failure] fails identically every time - batch remains stuck at Validated with no repair path"
    auto: DB-assisted
    cr: [CR-92]

