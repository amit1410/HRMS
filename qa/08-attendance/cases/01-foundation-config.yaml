  # ---------- Calendar Overrides ----------
  - id: ATT-CAL-001
    func: [F-ATT-051]
    sc: If the working-day calendar resolver is not wired, Holiday/WeeklyOff signals silently disappear
    t: With no calendar resolver, a configured Holiday date resolves as a plain unmatched day, not as Holiday
    src: ["AttendanceFoundationService.CalendarDayTypeAsync"]
    type: Boundary
    pri: P2
    tags: [Environment]
    steps:
      - "[Manual/Config] Deploy/run against a host where IWorkingDayCalendarResolver is not registered (e.g. a minimal test harness) => the forced condition is established"
      - "[GET /api/attendance/employees/{id}/roster/{holidayDate}] no rule/default matches => [200] resolves to 'NotConfigured', NOT 'Holiday' - the calendar signal is silently absent rather than erroring"
    auto: DB-assisted
    cr: [CR-91]

  - id: ATT-CAL-002
    func: [F-ATT-052]
    sc: Removing an override does not distinguish a calendar override from a plain manual assignment
    t: Removing either type of override uses the identical code path and message
    src: ["AttendanceFoundationService.RemoveRosterAsync"]
    type: Positive
    pri: P2
    steps:
      - "[Setup] date D is a configured Holiday; assign a working Shift to E1 on D (a genuine calendar override, IsCalendarOverride=true) => [200]"
      - "[DELETE /api/attendance/roster/{E1}/{D}] => [200] 'Roster override removed; calendar/automatic resolution will apply.' - identical message to removing a plain non-override manual assignment"
      - "[GET /api/attendance/employees/{E1}/roster/{D}] => [200] resolves back to Holiday"
    auto: API

  # ---------- Effective Dating / cross-cutting ----------
  - id: ATT-CAL-003
    func: [F-ATT-053]
    sc: Period-lock guard coverage is inconsistent across Foundation-management endpoints
    t: Shift, Applicability, and Roster are all blocked by a closed period intersecting their effective range; Shift Pattern create is not
    src: ["AttendanceFoundationService"]
    type: Contract
    pri: P2
    steps:
      - "[Setup] Close the Attendance period covering 2026-09 => [200] Closed"
      - "[POST /api/attendance/shifts] EffectiveFrom inside 2026-09 => [409] period-lock Conflict"
      - "[POST /api/attendance/applicability] EffectiveFrom inside 2026-09 => [409] period-lock Conflict"
      - "[POST /api/attendance/roster/assign] date inside 2026-09 => [409] period-lock Conflict"
