# Functionality registry for Module 8 - Attendance Management (Foundation/Configuration, Self-View,
# Punch/Event Ingestion, Daily Derivation, Monthly Processing, Exceptions, Regularization, On Duty,
# Overtime, Admin Corrections, Manager/HR Scope, Reports, Devices/Ingestion, Leave/Calendar Integration,
# Concurrency/Provider Parity, Authorization/Tenant Security, Frontend).
# Every test case references one or more of these ids; the builder fails if a functionality has zero
# cases or a case references an unknown id. IDs are allocated in one global sequence (F-ATT-001...) in
# the order the case files below were authored - group boundaries are noted with a comment banner.
#
# Discovered implementation (authoritative source, read directly by 8 parallel research passes against
# current code; docs/phase-6*.md were read where they exist and current code wins wherever they diverge,
# per CLAUDE.md - Attendance Foundation itself has NO design doc at all, only source + tests):
#   Backend/HRMS.API/Controllers/AttendanceFoundationController.cs, AttendanceReadController.cs,
#     AttendanceWorkflowController.cs, AttendanceOperationsController.cs,
#     AttendanceAdminCorrectionsController.cs, AttendanceMonthlyController.cs, AttendanceReportController.cs,
#     AttendanceDevicesController.cs, OvertimeController.cs
#   Backend/HRMS.Application/Services/AttendanceFoundationService.cs, AttendanceReadService.cs,
#     AttendancePunchIngestionService.cs, AttendanceDayProcessor.cs, AttendanceBusinessDateResolver.cs,
#     AttendanceBusinessTimeZoneProvider.cs, AttendanceMonthlyProcessor.cs, AttendancePeriodLockService.cs,
#     AttendanceAdminCorrectionService.cs, AttendancePayrollSnapshotResolver.cs, AttendanceWorkflowService.cs,
#     OvertimeService.cs, AttendanceOperationsService.cs, AttendanceReportService.cs,
#     AttendanceAuthorizationService.cs, AttendanceDeviceIntegrationService.cs, AttendanceDeviceHealthService.cs,
#     AttendanceDeviceLeaseService.cs, AttendanceDeviceOperationsService.cs, AttendanceDeviceSyncRecoveryService.cs,
#     RoleScopeResolver.cs, EmployeeAccessScopeService.cs (compared for the CR-57/CR-77 matrix)
#   Backend/HRMS.Infrastructure/Attendance/AttendanceDevicePullWorker.cs
#   Backend/HRMS.Domain/Entities/AttendanceFoundation.cs, AttendanceWorkflow.cs, AttendanceAdminCorrection.cs,
#     AttendanceDeviceIntegration.cs, Overtime.cs
#   Backend/HRMS.Domain/Enums/AttendanceEnums.cs, AttendanceDeviceEnums.cs, OvertimeEnums.cs
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Attendance.*, Attendance.Overtime.*, AttendanceDevice.*)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (RolePermissionMap - see CR-109, CR-111, CR-112, CR-113)
#   Frontend/HRMS.Web/src/pages/attendance/*.tsx, src/api/attendance*.ts, overtime.ts, compOff.ts,
#     attendanceDevices.ts
#   Existing xUnit (~150 classes/nested classes touching this surface, none previously classified in
#     qa/tools/existing_test_layers.yaml before this module) and Vitest - see README.md's mapping.
#
# ── Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) ──
# CR-57 is NOT a carry-forward here - Attendance IS its origin: EmployeeAccessScopeService's narrowing is
# literally keyed off Attendance.MonthlyViewTeam/MonthlyViewAll. CR-77 recurs as Attendance's OWN 4th/5th
# independent scope mechanism (AttendanceAuthorizationService), reusing only EmployeeAccessScopeService's
# role-scope arm and reproducing Leave's "legacy/null-DI fallback has no role-scope path" gap independently.
# CR-53 has a genuine, real gate here (SubmitRegularization/SubmitOnDuty block on Employee.Status/DateOfLeaving)
# unlike the pure read-side gaps found elsewhere - but history/queue/approval/monthly-processing remain exposed
# exactly like every other module. CR-66 and CR-82 (Leave's CompOff.Operations missing [HasPermission]) both
# reconfirm directly against Attendance's own permission set.

