# Functionality registry for Module 17 - Payroll Analytics / Reconciliation / Variance / Anomaly
# Controls (phase "Payroll Analytics, Reconciliation & Operational Controls", docs/phase-7s-payroll-
# analytics-reconciliation-controls.md). This is a READ/EVIDENCE layer over already-persisted
# PayrollRun/PayrollResult/PayrollResultComponent/BankAdvice/PayrollJournal/Statutory/Reimbursement/
# Loan/VariablePay/PayrollAdjustment/FinalSettlement records. It never recalculates payroll, never
# rewrites a PayrollResult, payslip, bank advice, accounting journal, or statutory register, and
# never performs an automatic correction. Every test case references one or more of these ids; the
# builder fails the build if a functionality has zero cases or a case references an unknown id. IDs
# are allocated in one global sequence (F-PYA-001...) in the order the groups below were authored -
# group boundaries are noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): this module covers exactly
# Backend/HRMS.Application/Services/PayrollAnalyticsService.cs (interface IPayrollAnalyticsService,
# ~30 public/private methods, read in full across two passes) and its four controllers, all in
# Backend/HRMS.API/Controllers/PayrollAnalyticsController.cs: PayrollAnalyticsController (route
# api/payroll/analytics - overview/summary/control-totals/department/cost-center/variance/
# components/findings + 4 CSV exports), PayrollExceptionsController (route api/payroll/exceptions -
# list + export.csv), PayrollReconciliationController (route api/payroll/reconciliation - pre/post
# generate, get, acknowledge/resolve/accept-exception), and PayrollAnalyticsControlsController
# (route api/payroll/analytics-controls - list/create/update of PayrollVarianceControl rows). This
# module explicitly does NOT cover: payroll-run creation/calculation/approval itself (qa/10-payroll's
# own surface - Analytics only reads a run's Status/PayrollPeriod and persisted PayrollResults),
# bank advice generation/approval/export itself (qa/15's own surface - Analytics only reads
# BankAdviceBatches/BankAdvicePayments as source evidence), GL journal generation/lifecycle itself
# (qa/16's own surface - Analytics only reads PayrollJournalBatches/Lines/LineSources as source
# evidence, mirroring qa/16's own reconciliation-integration-boundary scope note), statutory return
# generation itself (qa/13's own surface - Analytics only reads PayrollStatutoryResults/
# PayrollStatutoryReturnSources as source evidence), reimbursement/loan/variable-pay/adjustment/
# final-settlement CALCULATION itself (qa/11, qa/12, and the not-yet-numbered
# reimbursement/gratuity/leave-encashment/notice-settlement/final-settlement modules - Analytics only
# reads their already-persisted, already-finalized rows as source evidence).
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc):
#   Backend/HRMS.API/Controllers/PayrollAnalyticsController.cs (all 4 controllers, every action read)
#   Backend/HRMS.Application/Abstractions/IPayrollAnalyticsService.cs (read in full, 21 methods)
#   Backend/HRMS.Application/Services/PayrollAnalyticsService.cs (read in full, all ~400 lines,
#     across two passes)
#   Backend/HRMS.Application/DTOs/Payroll/PayrollAnalyticsDtos.cs (read in full, 11 DTOs)
#   Backend/HRMS.Domain/Entities/PayrollAnalytics.cs (PayrollVarianceControl/
#     PayrollAnalyticsSnapshot/PayrollReconciliation/PayrollReconciliationFinding/
#     PayrollAnomalyFlag - 5 entities, read in full)
#   Backend/HRMS.Domain/Enums/PayrollEnums.cs (PayrollAnalyticsSnapshotType, PayrollControlScope [8
#     members], PayrollControlMetric [9 members], PayrollFindingSeverity, PayrollControlAction [4
#     members], PayrollReconciliationType, PayrollReconciliationStatus [3 members],
#     PayrollFindingStatus, PayrollAnomalyType [14 members] - every enum member cross-checked against
#     actual service code for live vs. dead usage)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/PayrollAnalyticsConfiguration.cs (all 4
#     EF configurations, every index/FK, read in full - explicitly checked for .IsConcurrencyToken()
#     on the ConcurrencyVersion properties, see CR-290)
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Payroll.Analytics*/Reconciliation*/Exceptions*
#     block, 8 permissions, read in full)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (full-file grep for all 8 permission
#     constants - matches only in the permission-id-assignment dictionary, ids 190-197; every role's
#     RolePermissionMap array grepped, see CR-291)
#   Migration pair AddPayrollAnalyticsPhase7S confirmed present in both
#     Backend/HRMS.Infrastructure/Persistence/Migrations (SQL Server, 20260922050332) and
#     Backend/HRMS.Infrastructure.MySqlMigrations/Migrations (MySQL, 20260922050406); the follow-up
#     AddHistoricalPayrollDimensionsPhase7S migration pair confirmed present in both chains (SQL
#     Server 20260922081107, MySQL 20260922081130)
#   docs/phase-7s-payroll-analytics-reconciliation-controls.md (read in full - the only phase doc
#     whose body ends with contradictory "NOT COMPLETE" / "COMPLETE" verification-log entries; the
#     final entry claims SQL Server operator reverification passed and status COMPLETE, so this
#     module treats the feature as shipped and tests the code as found)
#   Frontend/HRMS.Web/src/pages/payroll/PayrollAnalyticsPage.tsx (+ its .test.tsx, read in full - a
#     single summary-tile page, no route params beyond a raw ?runId= query string, no drill-down UI)
#   Frontend/HRMS.Web/src/api/payrollAnalytics.ts (read in full - wraps only 2 of the 22 backend
#     endpoints: overview and employee variance; see CR-296)
#   Frontend/HRMS.Web/src/App.tsx (route registration grepped - /payroll/analytics is registered and
#     permission-gated), Frontend/HRMS.Web/src/layout/navigation.ts (grepped for
#     "Analytics"/"Reconciliation"/"Exceptions" - zero matches, see CR-296), full-repo grep for
#     "payroll/analytics" confirms no other page links to the route
#   Frontend/HRMS.Web/src/auth/permissions.ts (mirror confirmed present and complete for all 8
#     permission constants) and permissions.mirror.test.ts (confirmed it parses Permissions.cs
#     directly, so the mirror cannot silently drift)
#   Existing xUnit inventory read in full: PayrollAnalyticsTests.cs, PayrollAnalyticsConcurrencyTests.cs
#     (188 lines), PayrollAnalyticsLargeDataTests.cs (102 lines), PayrollAnalyticsProviderAcceptance.cs
#     (shared SQL Server/MySQL helper), PayrollAnalyticsReportingTests.cs, PayrollAnalyticsSourceReconciliationTests.cs
#     (536 lines, the full 8-source matrix), MySqlPayrollAnalyticsIntegrationTests.cs,
#     SqlServerPayrollAnalyticsIntegrationTests.cs (referenced narratively per the qa/8-16 precedent,
#     not individually classified via `ex:` - no ex: references are used in this module, matching
#     qa/10-16's own precedent for the Payroll phase)
#
# -- Headline findings that shape this whole module's cases (full detail in clarifications.yaml) --
# CR-290: CONFIRMED - PayrollVarianceControl.ConcurrencyVersion and PayrollReconciliation.
# ConcurrencyVersion are both declared as if they were optimistic-concurrency tokens (matching the
# ConcurrencyVersion-as-IsConcurrencyToken() convention used by AttendanceMonthly/AttendanceWorkflow/
# BankAdvice/CompOff/etc. elsewhere in this codebase) but PayrollAnalyticsConfiguration.cs never calls
# .IsConcurrencyToken() on either property - both are plain, unenforced integers that are also never
# incremented by application code. Two concurrent writers silently last-write-wins with no conflict
# ever raised.
# CR-291: a full grep of SeedData.cs's RolePermissionMap for all 8 Payroll.Analytics*/Reconciliation*/
# Exceptions* constants returns zero matches in any role array except the blanket
# DomainPermissions.All grant to SuperAdmin/TenantAdmin - identical shape to qa/15's CR-263 and
# qa/16's CR-274.
# CR-292: CONFIRMED - Payroll.Exceptions.Manage is declared and seeded (permission id 197) but no
# controller action anywhere requires it; PayrollExceptionsController's only two actions (List,
# Export) both require Payroll.Exceptions.View, and no code path ever mutates a PayrollAnomalyFlag
# (acknowledge/resolve) at all - Exceptions.Manage has zero corresponding functionality.
# CR-293: CONFIRMED - PayrollControlScope has 8 members (PayrollRun/Employee/Component/Department/
# CostCenter/Statutory/BankAdvice/Accounting) and CreateControlAsync/UpdateControlAsync accept any of
# them without validation, but GenerateReconciliationAsync's control-evaluation loop only ever reads
# `controls.Where(x => x.Scope == PayrollControlScope.PayrollRun)` - the other 7 scopes can be saved
# and listed but are never evaluated against anything, ever.
# CR-294: CONFIRMED - PayrollControlMetric has 9 members; a PayrollRun-scoped control's `actual` value
# is computed by a switch that implements exactly 6 (GrossPay/NetPay/TotalDeduction/EmployeeCount/Tax/
# EmployerContribution) with `_ => 0m` for the remaining 3 (ComponentAmount/BankAdviceTotal/GLTotal) -
# a control configured with one of those 3 metrics always compares its threshold against a hard-coded
# zero, not the real value its name implies.
# CR-295: CONFIRMED - PayrollControlAction has 4 members (Informational/RequireAcknowledgement/
# BlockApproval/BlockFinalization); a full-repo grep of PayrollRunService.cs and PayrollApprovalGuard.cs
# for "PayrollVarianceControl"/"PayrollControlAction"/"BlockApproval"/"BlockFinalization" returns zero
# matches - BlockApproval and BlockFinalization are stored, returned in the DTO, and never enforced by
# the payroll lifecycle anywhere in this codebase; a Critical, BlockApproval-tagged finding cannot
# actually block anything.
# CR-296: the frontend PayrollAnalyticsPage.tsx wires only 2 of this module's 22 backend endpoints
# (overview via a summary-tile grid, and employee variance via payrollAnalytics.ts's
# getPayrollVariance - which the page itself never calls). Control totals, department/cost-center
# summaries, component variance, findings list, all 4 CSV exports, reconciliation generate/get/
# acknowledge/resolve/accept-exception, the exceptions register, and analytics-control CRUD have zero
# UI. The one page that exists takes its payroll run only from a raw `?runId=` query-string parameter
# with no run picker, and layout/navigation.ts has no sidebar entry linking to it from anywhere -
# grepping the whole frontend for the literal route path confirms no other page ever links to it.
# CR-297: CONFIRMED - PayrollReconciliation.Status is declared with 3 members (Generated/Acknowledged/
# Superseded) and defaults to Generated, but a full grep of PayrollAnalyticsService.cs for
# "ReconciliationStatus." finds zero assignments anywhere - Acknowledged and Superseded can never be
# reached; every reconciliation row, including one whose every finding has since been Resolved, or one
# superseded by a newer version, reports Status=Generated forever.
# CR-298: CONFIRMED - PayrollAnomalyType has 14 members; PayrollAnalyticsService only ever constructs
# an Anomaly() with AnomalyType.NegativeNetPay or AnomalyType.ZeroNetPay (both inside
# GenerateReconciliationAsync's post-payroll branch) - the other 12 (HighGrossVariance/
# HighNetVariance/HighDeductionVariance/PopulationMismatch/BankMismatch/AccountingMismatch/
# StatutoryMismatch/DuplicateSettlement/MissingConfiguration/MissingSource/UnexpectedEmployee/
# MissingEmployee) are declared but never constructed anywhere, despite several having an
# obvious literal match to an already-implemented PayrollReconciliationFinding control code (e.g.
# "BankMismatch" vs. the finding codes "MissingBankAdvice"/"BankAdviceAmountMismatch") - findings and
# the exceptions register are two structurally similar but functionally disjoint mechanisms.
# CR-299: CONFIRMED - PayrollVarianceRowDto.Flags is typed IReadOnlyList<string> and
# PayrollVarianceRowDto.Classification suggests a real variance-severity classification, but the
# private Variance() helper hard-codes Flags to `[]` on every row (never populated from any threshold
# or anomaly) and Classification to exactly one of 2 literal strings ("NewValue" for a zero/absent
# prior value, "NormalComparable" otherwise) - regardless of how large the gross/net/deduction delta
# actually is. A 1000% gross-pay increase and a 0.01% increase both classify as "NormalComparable".
# CR-300: CONFIRMED - every list endpoint on IPayrollAnalyticsService binds the shared PagedQuery,
# whose SortBy/SortDescending fields are documented as "must be one of the endpoint's supported
# fields", but Variance/Findings/Exceptions/ListControls never read query.SortBy or
# query.SortDescending anywhere - each hard-codes its own fixed ordering and silently ignores any
# sortBy/sortDescending value a caller sends, valid or not (no 400, no error, no visible effect).
functionalities:
  # =========================== A. RUN OVERVIEW ===========================
  - id: F-PYA-001
    name: GetOverviewAsync requires an authenticated tenant context and a run that exists in that tenant, else Unauthorized/NotFound
    group: Run Overview
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/overview"
    service: "PayrollAnalyticsService.GetOverviewAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRuns (TenantId+Id filter)"

  - id: F-PYA-002
    name: Overview aggregates persisted employee count and gross/deduction/net/employer-contribution/tax totals from current, Calculated PayrollResults only
    group: Run Overview
    status: Implemented
    service: "PayrollAnalyticsService.GetOverviewAsync -> Results/Totals"
    permission: "Payroll.Analytics.View"
    db: "PayrollResults (IsCurrent && Status=Calculated filter)"

  - id: F-PYA-003
    name: Overview separately sums active (non-Cancelled) BankAdviceBatches.TotalAmount and active (non-Cancelled) PayrollJournalBatches debit/credit totals for the same run
    group: Run Overview
    status: Implemented
    service: "PayrollAnalyticsService.GetOverviewAsync"
    permission: "Payroll.Analytics.View"
    db: "BankAdviceBatches, PayrollJournalBatches"

  - id: F-PYA-004
    name: Overview reports OpenFindings/CriticalFindings counts from PayrollReconciliationFindings with Status=Open (Critical additionally filtered by Severity=Critical)
    group: Run Overview
    status: Implemented
    service: "PayrollAnalyticsService.GetOverviewAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollReconciliationFindings"

  - id: F-PYA-005
    name: Overview reports AnomalyCount from PayrollAnomalyFlags with Status=Open, scoped to the run
    group: Run Overview
    status: Implemented
    service: "PayrollAnalyticsService.GetOverviewAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollAnomalyFlags"

  # =========================== B. RUN SUMMARY & CONTROL TOTALS ===========================
  - id: F-PYA-006
    name: GetRunSummaryAsync returns run type/status plus the full PayrollControlTotalsDto and, when present, bank-advice/accounting debit/credit totals as nullable (null, not zero, when no active batch/journal exists)
    group: Run Summary & Control Totals
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/summary"
    service: "PayrollAnalyticsService.GetRunSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRuns, BankAdviceBatches, PayrollJournalBatches"

  - id: F-PYA-007
    name: GetControlTotalsAsync computes distinct-employee count, result count, and Earnings/Deduction/Gross/Net/EmployerContribution/Tax totals from persisted PayrollResults
    group: Run Summary & Control Totals
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/control-totals"
    service: "PayrollAnalyticsService.GetControlTotalsAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollResults"

  - id: F-PYA-008
    name: "Control totals derive Reimbursement/LoanRecovery/VariablePay/Adjustment sub-totals from PayrollResultComponents.CalculationSource via a case-insensitive substring match, not an exact enum/type match"
    group: Run Summary & Control Totals
    status: Implemented
    service: "PayrollAnalyticsService.GetControlTotalsAsync -> Source(name)"
    permission: "Payroll.Analytics.View"
    db: "PayrollResultComponents.CalculationSource"

  - id: F-PYA-009
    name: Control totals' Tax field is always a hard-coded 0m (Totals() returns a fixed 0m for Tax regardless of persisted statutory data)
    group: Run Summary & Control Totals
    status: Implemented
    service: "PayrollAnalyticsService.Totals (static helper)"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-010
    name: Both GetRunSummaryAsync and GetControlTotalsAsync require the run to resolve for the caller's tenant first, else the same NotFound/Unauthorized propagates
    group: Run Summary & Control Totals
    status: Implemented
    service: "PayrollAnalyticsService.LoadRunAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRuns"

  - id: F-PYA-011
    name: SummaryCsv and ControlTotalsCsv export the same computed values as their JSON counterparts as single-data-row CSV files with a UTF-8 BOM and RFC 4180 escaping
    group: Run Summary & Control Totals
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/summary.csv, /control-totals.csv"
    service: "PayrollAnalyticsService.ExportRunSummaryAsync, ExportControlTotalsAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  # =========================== C. DIMENSION SUMMARIES (DEPARTMENT / COST CENTER) ===========================
  - id: F-PYA-012
    name: GetDepartmentSummaryAsync and GetCostCenterSummaryAsync join PayrollRunEmployees to current Calculated PayrollResults, grouping by the run-employee's own DepartmentId/CostCenterId
    group: Dimension Summaries
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/departments, /cost-centers"
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRunEmployees, PayrollResults"

  - id: F-PYA-013
    name: Department/CostCenter dimension ids and names are read from PayrollRunEmployee's own historical snapshot columns, never from the employee's current Department/CostCenter assignment
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRunEmployees.DepartmentId/CostCenterId (historical snapshot)"

  - id: F-PYA-014
    name: "A null historical dimension groups together under a synthetic 'UNCLASSIFIED' code / 'Historical dimension unavailable' name row, rather than being dropped or erroring"
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-015
    name: "A historical dimension id that no longer resolves to a live Department/CostCenter row (deleted/renamed since the run) still falls back to the same UNCLASSIFIED code/name pair rather than the dimension's own stale id"
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "Departments, CostCenters"

  - id: F-PYA-016
    name: Dimension summary rows are ordered by Code ascending, with UNCLASSIFIED sorting per ordinary string comparison (no special-cased placement)
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-017
    name: Each dimension row reports its own distinct-employee count, result count, and Earnings/Gross/Deduction/Net/EmployerContribution totals; the sum across all dimension rows reconciles exactly to the run's overall control totals
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-018
    name: "PayrollDimensionSummaryDto's EarningsTotal and GrossTotal are always equal for every row (both are populated from the same GrossEarnings sum) - there is no separate earnings-vs-gross distinction at the dimension level"
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.GetDimensionSummaryAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-019
    name: Both dimension summary endpoints require the run to resolve for the caller's tenant first, else NotFound/Unauthorized
    group: Dimension Summaries
    status: Implemented
    service: "PayrollAnalyticsService.LoadRunAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  # =========================== D. EMPLOYEE VARIANCE ===========================
  - id: F-PYA-020
    name: GetVarianceAsync computes a per-employee row comparing the requested run's current PayrollResult against a comparison run's prior PayrollResult, joined by EmployeeId
    group: Employee Variance
    status: Implemented
    api: "GET /api/payroll/analytics/runs/{runId}/variance"
    service: "PayrollAnalyticsService.GetVarianceAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollResults"

  - id: F-PYA-021
    name: "When compareRunId is omitted, the comparison run defaults to the most recent OTHER non-Cancelled run of the SAME RunType for the tenant, ordered by PayrollPeriod.EndDate descending - regardless of that run's own Status (Draft/Prepared/Processing all qualify, not just Calculated+)"
    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.GetVarianceAsync"
    permission: "Payroll.Analytics.View"
    db: "PayrollRuns"

  - id: F-PYA-022
    name: An explicit compareRunId is used as-is with no validation that it belongs to the same tenant, the same RunType, or resolves to any PayrollResults at all
    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.GetVarianceAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"
    ui: "n/a"

  - id: F-PYA-023
    name: An employee present in the current run but absent from the comparison run's results is classified Classification=NewValue with null Base* fields; GrossDelta/DeductionDelta/NetDelta are computed against an implicit 0 prior
    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.Variance (static helper)"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-024
    name: "Percent() returns null (not an error, not Infinity) when the prior/base value is exactly zero, and rounds to 6 decimal places otherwise"
    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.Percent (static helper)"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-025
    name: "Free-text search on the variance list matches EmployeeCode or EmployeeName case-insensitively, applied AFTER the full current-run/comparison-run join is materialized in memory (not pushed to SQL)"
    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.GetVarianceAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  - id: F-PYA-026
    name: The variance list is always ordered by EmployeeCode ascending and paged with the shared PagedQuery Page/PageSize (default 20, max 100), independent of any SortBy value supplied
