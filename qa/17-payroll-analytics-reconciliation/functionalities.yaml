    permission: "n/a"
    db: "n/a"

  - id: F-PYA-124
    name: Two concurrent acknowledge calls against the same finding both report Succeeded=true (the terminal-state guard only rejects a call arriving after Resolved/AcceptedException, not after another Acknowledged) and leave one final, auditable Acknowledged state with the last writer's actor/timestamp
    group: Concurrency & Idempotency
    status: Implemented
    service: "PayrollAnalyticsService.ActOnFindingAsync"
    permission: "n/a"
    db: "n/a"

  - id: F-PYA-125
    name: "A PayrollVarianceControl Update racing a reconciliation Generate for the same tenant does not corrupt either row - exactly one control row and the expected reconciliation row(s) exist afterward, though which control values (pre- or post-update) the race's Generate actually evaluated is not guaranteed"
