  # =========================== S. CONCURRENCY & IDEMPOTENCY ===========================
  - id: F-PYA-121
    name: "The unique (TenantId, PayrollRunId, ReconciliationType, Version) index guarantees that two concurrent GenerateReconciliationAsync calls for the same run/type cannot both persist the same version - the DB, not application logic, is the sole race guard, and the losing caller surfaces an unhandled DbUpdateException rather than a graceful Conflict"
    group: Concurrency & Idempotency
    status: Implemented
    service: "PayrollAnalyticsService.GenerateReconciliationAsync"
    permission: "n/a"
    db: "PayrollReconciliations unique index"


  - id: F-PYA-122
    name: "Every successful GenerateReconciliationAsync call inserts exactly one matching PayrollAnalyticsSnapshot row at the same DataVersion, so the reconciliation-row count and snapshot-row count for a run+type always stay equal even under a race"
