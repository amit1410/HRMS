  - id: F-PYA-028
    name: VarianceCsv exports every matching row (PageSize forced to 50000 internally) with the same 15 columns as the JSON shape, RFC 4180 escaped, named payroll-variance-{runId:N}.csv
    group: Employee Variance
    status: Implemented
