    status: Implemented
    service: "PayrollAnalyticsService.GenerateReconciliationAsync"
    permission: "n/a"
    db: "n/a"

  - id: F-PYA-123
    name: "PayrollReconciliationFinding rows carry no concurrency token at all (not even the unenforced ConcurrencyVersion int that PayrollReconciliation/PayrollVarianceControl declare) - two concurrent ActOnFindingAsync calls against the SAME finding (e.g. acknowledge vs. resolve) never raise a conflict; the later SaveChangesAsync call silently overwrites the earlier one's Status/timestamps (see CR-290)"
    group: Concurrency & Idempotency
    status: Implemented
