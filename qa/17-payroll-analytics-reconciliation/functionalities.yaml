    group: Employee Variance
    status: Implemented
    service: "PayrollAnalyticsService.LoadRunAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  # =========================== E. COMPONENT VARIANCE ===========================
  - id: F-PYA-030
