    service: "PayrollAnalyticsService.LoadRunAsync"
    permission: "Payroll.Analytics.View"
    db: "n/a"

  # =========================== F. RECONCILIATION GENERATION - PRE-PAYROLL ===========================
  - id: F-PYA-035
    name: GenerateReconciliationAsync(PrePayroll) creates a new versioned PayrollReconciliation row, version = prior-max-version-for-this-type + 1 (1 if none exists)
    group: Reconciliation Generation
    status: Implemented
    api: "POST /api/payroll/reconciliation/runs/{runId}/pre"
    service: "PayrollAnalyticsService.GenerateReconciliationAsync"
    permission: "Payroll.Reconciliation.Generate"
    db: "PayrollReconciliations (unique TenantId+PayrollRunId+Type+Version)"

  - id: F-PYA-036
    name: "Pre-payroll with zero persisted PayrollResults raises a single Critical, BlockApproval-tagged NoPayrollResults finding"
    group: Reconciliation Generation
    status: Implemented
    service: "PayrollAnalyticsService.GenerateReconciliationAsync"
    permission: "Payroll.Reconciliation.Generate"
    db: "n/a"

  - id: F-PYA-037
    name: Every reconciliation generation call (pre or post) also inserts exactly one PayrollAnalyticsSnapshot row capturing the persisted totals/employee count/currency at that DataVersion
