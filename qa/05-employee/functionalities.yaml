  # ── D. Contact Details ─────────────────────────────────────────────────────
  - id: F-EMP-041
    name: Read/upsert (one row per employee) the Contact record - official/personal/alternate email, official/personal phone, emergency number, same-as-current-address flag
    group: Contact
    status: Implemented
    ui: "ContactDetailsForm"
    api: "GET/PUT /api/employees/{id}/contact"
