# Functionality registry for Module 5 - Employee Management.
# Every test case references one or more of these ids; the builder fails if a functionality has zero cases
# or a case references an unknown id.
#
# Discovered implementation (authoritative source: EmployeesController, EmployeeSubResourcesController,
# EmployeeService, EmployeeEmploymentService, EmployeeSupervisorService, EmployeeAddressService,
# EmployeeContactService, EmployeeBankDetailService, EmployeeAccessScopeService, EmployeeManagerResolver,
# every EmployeeXxxRequestValidator, the Employee/EmployeeEmployment/EmployeeEmploymentHistory/
# EmployeeSupervisor/EmployeeAddress/EmployeeContact/EmployeeBankDetail/EmployeeFamily/EmployeeEducation/
# EmployeePreviousEmployment/EmployeeAdditionalInfo/EmployeeDocument entities and EF configurations,
# Domain/Authorization/Permissions.cs, SeedData.RolePermissionMap, and the frontend EmployeesPage.tsx/
# EmployeeFormPage.tsx/EmployeeDetailPage.tsx/EmployeeProfileSidebar.tsx/PersonalDetailsForm.tsx/
# ContactDetailsForm.tsx/AddressDetailsForm.tsx/BankDetailsForm.tsx/EmploymentSectionForm.tsx/
# SupervisorSectionForm.tsx):
#
# ELEVEN sub-resources exist under /api/employees/{id}: Contact, Addresses (Current/Permanent),
# Family, Education, Previous Employment, Bank Details, Supervisor (L1-L5/Time/ERO/CHRO), Additional
# Info, Employment (joining/contractual, 1:1) + Employment History (effective-dated, append-only),
# Documents, and an Audit Log. EIGHT have a frontend tab (Personal, Contact, Address, Family, Bank,
# Previous Employment, Employment, Supervisor - confirmed present in both EmployeeFormPage.tsx's and
# EmployeeDetailPage.tsx's TABS list); Education, Additional Info, Documents and the Audit Log have NO
# frontend surface at all - their api/employeeSubsections.ts functions (getEducationRecords/
# getDocuments/getAdditionalInfo/getAuditLog) are called nowhere outside that api module (F-EMP-162,
# F-EMP-164, F-EMP-165, F-EMP-166, F-EMP-170, CR-52).
#
# Employee creation has TWO write paths: the legacy full EmployeeRequest (POST/PUT /api/employees,
# department/designation/manager all optional, client-supplied EmployeeCode required) and the modern
# Personal-Details-only path (POST/PUT /api/employees/personal-details, no department/designation/email/
# code - those come from Contact and Initial Employment). Only the modern path defers Employee Code
# assignment to Initial Employment (F-EMP-013..016); the legacy path requires and validates a client
# code immediately and never touches Employment History.
#
# Employment History is the single append-only, effective-dated source of truth for department,
# designation, grade, manager and 9 other organizational FKs (F-EMP-067..088). Employee's own
# DepartmentId/DesignationId/Status/ReportingManagerId/EmployeeTypeId/CostCenterId columns are a
# denormalized snapshot, synced ONLY when a new history record's effective date is today or earlier
# (CreateChangeAsync's `isEffectiveToday` gate) - never for a future-dated record, and never by the
# legacy full-edit endpoint's own direct writes to those same columns (CR-47). EFFECTIVE DATES MAY
# NEVER BE IN THE PAST: CreateChangeAsync rejects any EffectiveFrom earlier than today's business date
# for every ChangeReason, including Correction - so a "backdated correction" is not possible through
# this endpoint; only same-day (Correction, superseding a same-day record) or future-dated changes are
# accepted (F-EMP-078, CR-51).
#
# The direct (L1) manager is resolved from CURRENT Employment History only (EmployeeManagerResolver);
# EmployeeSupervisor.L1ManagerId is a read-only compatibility mirror the Employment engine keeps in sync
# and SupervisorSectionForm/the API both refuse to let a caller set L1 directly once Employment has an
# opinion (F-EMP-089..092). L2-L5/Time/ERO/CHRO are freely-assigned peer fields with only a
# not-self/must-be-active-in-tenant check - no cross-level consistency and no circular-hierarchy check
# among themselves (only the direct L1/ReportingManagerId graph is cycle-checked, in both the legacy
# EmployeeService.WouldCreateReportingCycleAsync and EmployeeEmploymentService.WouldCreateManagerCycleAsync).
#
# Employee Export (GET /api/employees/export) and Import (the generic ImportBatchController, gated by
# the SAME Employee.Import permission) are separate risk surfaces: Export filters/sorts by the Employee
# entity's own snapshot columns (ApplyFilters/ApplySort) rather than the effective-history-aware logic
# List uses (ApplyEffectiveFilters/ApplyEffectiveSort) - the two agree only while no legacy full-edit has
# ever diverged the snapshot from history (CR-47) - and Export/​GetSensitiveDetailsAsync do not apply the
# EmployeeAccessScopeService scope predicate that GetAsync/GetByIdAsync do (CR-48/CR-49). Import is
# scaffolding only: ImportBatchService.ImportAsync creates a batch row and never parses or processes a
# file (CR-50).

functionalities:
  # ── A. Employee List / Search / Filter ────────────────────────────────────
  - id: F-EMP-001
    name: List employees, paged, with default sort by employee code
    group: List
    status: Implemented
    ui: "EmployeesPage initial load"
    api: "GET /api/employees"
    service: "EmployeeService.GetAsync (ApplyEffectiveSort defaults to employeeCode ascending, ThenBy Id)"
    permission: "Employee.View"
    db: "Employees, EmployeeEmploymentHistory (tenant-filtered)"

  - id: F-EMP-002
    name: Paging bounds - page >= 1, pageSize 1-100, default pageSize 20
    group: List
    status: Implemented
    ui: "Pagination control (page size selector)"
    api: "GET /api/employees?page=&pageSize="
    service: "PagedQueryValidator (Page >= 1, PageSize InclusiveBetween(1,100)); PagedQuery.DefaultPageSize=20, MaxPageSize=100"
    permission: "Employee.View"
    db: "n/a (validated before query)"

  - id: F-EMP-003
    name: A page number beyond the last page returns an empty item list, not an error
    group: List
    status: Implemented
    ui: "n/a"
    api: "GET /api/employees?page=999"
    service: "EmployeeService.GetAsync (ToPagedResultAsync Skip/Take)"
    permission: "Employee.View"
    db: "Employees"

  - id: F-EMP-004
    name: Search matches employee code, first name, last name and email (official email when Contact exists)
    group: List
    status: Implemented
    ui: "EmployeesPage search box ('Search name, code or email')"
    api: "GET /api/employees?search="
    service: "EmployeeService.ApplyEffectiveFilters (case-insensitive Contains on EmployeeCode/FirstName/LastName/Contact.OfficialEmail-or-Email)"
    permission: "Employee.View"
    db: "Employees, EmployeeContacts"
    ex: ["xU:EmployeeServiceTests.Search_matches_code_name_and_email"]

  - id: F-EMP-005
    name: Search text is capped at 100 characters
    group: List
    status: Implemented
    ui: "n/a (input has no maxlength; server enforces)"
    api: "GET /api/employees?search="
    service: "PagedQueryValidator.Search MaximumLength(100)"
    permission: "Employee.View"
    db: "none"

  - id: F-EMP-006
    name: Filter by department, designation, status and reporting manager, individually and combined
    group: List
    status: Implemented
    ui: "EmployeesPage department/designation/status <select> (reporting-manager filter is API-only - no UI control renders it, CR-53)"
    api: "GET /api/employees?departmentId=&designationId=&status=&reportingManagerId="
    service: "EmployeeService.ApplyEffectiveFilters (each filter ORs a current-history match with a no-history-yet fallback to the Employee row's own snapshot field)"
    permission: "Employee.View"
    db: "Employees, EmployeeEmploymentHistory"
    ex: ["xU:EmployeeServiceTests.Get_filters_by_department_designation_status_and_manager"]

  - id: F-EMP-007
    name: An invalid Status filter value is rejected with 400, not silently ignored
    group: List
    status: Implemented
    ui: "n/a (EmployeesPage's asStatus() drops an unrecognized value from a hand-edited URL before it reaches the API)"
    api: "GET /api/employees?status=NotARealStatus"
    service: "EmployeeQueryValidator (Status.IsInEnum())"
    permission: "Employee.View"
    db: "none"

  - id: F-EMP-008
    name: Sort by any of the 9 whitelisted fields, ascending or descending; an unlisted field is rejected
    group: List
    status: Implemented
    ui: "EmployeesPage column headers (Code/Name/Department/Designation/Joined/Status)"
    api: "GET /api/employees?sortBy=&sortDescending="
    service: "EmployeeQuery.SortFields (employeeCode, firstName, lastName, email, department, designation, status, dateOfJoining, createdDate); PagedQueryValidator.SortBy whitelist check"
    permission: "Employee.View"
    db: "Employees"

  - id: F-EMP-009
    name: Sorting by department/designation/status orders by the CURRENT employment-history record, falling back to the Employee row only when no history exists yet
    group: List
    status: Implemented
    ui: "n/a"
    api: "GET /api/employees?sortBy=department"
    service: "EmployeeService.ApplyEffectiveSort (history-aware branches for department/designation/status; every other field falls through to the plain ApplySort)"
    permission: "Employee.View"
    db: "Employees, EmployeeEmploymentHistory"

  - id: F-EMP-010
    name: List item projection carries the joined department/designation names and an isCurrentlyEmployed flag
    group: List
    status: Implemented
    ui: "EmployeesPage table columns"
    api: "GET /api/employees"
    service: "EmployeeService.GetAsync (EmployeeListItemDto: id, employeeCode, fullName, email, departmentName, designationName, status, dateOfJoining, isCurrentlyEmployed)"
    permission: "Employee.View"
    db: "Employees, EmployeeEmploymentHistory, Department, Designation"
    ex: ["xU:EmployeeServiceTests.List_items_carry_the_joined_department_and_designation_names"]

  - id: F-EMP-011
    name: Empty result is distinguished from an empty filter by the UI (list is genuinely empty vs filters exclude everyone)
    group: List
    status: Implemented
    ui: "EmployeesPage empty state ('No employees yet' vs 'Nobody matches those filters')"
    api: "GET /api/employees"
    service: "n/a (frontend decides from list.isFiltered)"
    permission: "Employee.View"
    db: "none"

  - id: F-EMP-012
    name: The list is scoped to the caller's own tenant and, where an employment-scope role assignment exists, further restricted to that scope
    group: List
    status: Implemented
    ui: "n/a"
    api: "GET /api/employees (as Tenant B, or as a scoped Manager/HR role)"
    service: "EmployeeService.GetAsync (_accessScope.BuildPredicateAsync applied before paging, in addition to the EF TenantId global filter)"
    permission: "Employee.View"
    db: "Employees, UserRoles, RoleScopes"
    ex: ["xU:EmployeeServiceTests.Get_returns_only_the_callers_own_employees"]

  # ── B. Create Employee (two paths) ────────────────────────────────────────
  - id: F-EMP-013
    name: Legacy full create (POST /api/employees) requires a client-supplied Employee Code and accepts department/designation/manager immediately
    group: Create
    status: Implemented
    ui: "n/a (no frontend calls this endpoint directly; PersonalDetailsForm always uses the personal-details path)"
    api: "POST /api/employees"
    service: "EmployeeService.CreateAsync"
    permission: "Employee.Create + EmployeeSensitive.Edit"
    db: "Employees, EmployeeContacts (a placeholder-linked Contact row is created alongside)"
    ex: ["xU:EmployeeServiceTests.Create_stamps_the_authenticated_tenant_and_returns_the_joined_record"]

  - id: F-EMP-014
    name: Modern create (POST /api/employees/personal-details) is Personal-Details-only - no department, designation, manager, email or Employee Code
    group: Create
    status: Implemented
    ui: "PersonalDetailsForm 'Save' on a new employee (only the personal tab is shown, per F-EMP-147)"
    api: "POST /api/employees/personal-details"
    service: "EmployeeService.CreatePersonalDetailsCoreAsync (EmployeeCode=null, a uniqueness-safe placeholder email, DepartmentId/DesignationId/ReportingManagerId left null)"
    permission: "Employee.Create"
    db: "Employees"
    ex: ["xU:EmployeePersonalDetailsTests.Create_creates_with_no_department_or_designation", "xU:EmployeePersonalDetailsTests.Create_leaves_auto_employee_code_pending_until_initial_employment"]

  - id: F-EMP-015
    name: Personal-Details create does not require EmployeeSensitive.Edit; without it, sensitive fields (PF/UAN/Aadhaar/PAN/ESIC/Mediclaim) sent in the request are silently dropped rather than rejected
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees/personal-details (caller holds Employee.Create only)"
    service: "EmployeeService.CreatePersonalDetailsAsync (canEditSensitive computed from the caller's own EmployeeSensitive.Edit claim); ApplyPersonalDetails (canEditSensitive guards every sensitive field write)"
    permission: "Employee.Create"
    db: "Employees (sensitive columns stay null)"
    ex: ["xU:EmployeePersonalDetailsTests.Create_personal_details_does_not_require_sensitive_edit_permission", "xU:EmployeePersonalDetailsTests.Create_without_sensitive_permission_does_not_persist_sensitive_values_but_authorized_create_does"]

  - id: F-EMP-016
    name: The Personal-Details create does not touch the Employee Code sequence/version counter at all
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees/personal-details"
    service: "EmployeeService.CreatePersonalDetailsCoreAsync (no EmployeeCodeConfigVersion read/write); code assignment is deferred entirely to EmployeeEmploymentService.CreateChangeAsync at Initial Employment"
    permission: "Employee.Create"
    db: "EmployeeCodeConfigVersions (unchanged)"
    ex: ["xU:EmployeePersonalDetailsTests.Create_does_not_consume_employee_code_sequence"]

  - id: F-EMP-017
    name: Legacy create rejects a department/designation/manager id that does not exist or belongs to another tenant
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees"
    service: "EmployeeService.ValidateReferencesAsync (tenant-filtered lookup; a foreign id is indistinguishable from a nonexistent one)"
    permission: "Employee.Create"
    db: "Departments, Designations, Employees"
    ex: ["xU:EmployeeServiceTests.Create_rejects_a_department_belonging_to_another_tenant", "xU:EmployeeServiceTests.Create_rejects_a_designation_belonging_to_another_tenant", "xU:EmployeeServiceTests.Create_rejects_a_manager_belonging_to_another_tenant", "xU:EmployeeServiceTests.Create_rejects_a_nonexistent_department"]

  - id: F-EMP-018
    name: Legacy create rejects an inactive department/designation and a manager who has left the organization
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees"
    service: "EmployeeService.ValidateReferencesAsync (IsActive/Status checks apply only on CREATE and on a CHANGED reference - an unchanged reference to an already-retired master is left alone on update, F-EMP-107)"
    permission: "Employee.Create"
    db: "Departments, Designations, Employees"
    ex: ["xU:EmployeeServiceTests.Create_rejects_a_retired_department", "xU:EmployeeServiceTests.Create_rejects_a_manager_who_has_left_the_organization"]

  - id: F-EMP-019
    name: Legacy create rejects a duplicate Employee Code or email, case-insensitively, within the tenant; another tenant may reuse the same values
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees"
    service: "EmployeeService.FindConflictAsync (ToLowerInvariant comparison; a race lost on SaveChangesAsync's unique index is caught and reported as the same Conflict, not a 500)"
    permission: "Employee.Create"
    db: "Employees (TenantId, EmployeeCode) and (TenantId, Email) unique indexes"
    ex: ["xU:EmployeeServiceTests.Create_rejects_a_duplicate_employee_code_regardless_of_case", "xU:EmployeeServiceTests.Create_rejects_a_duplicate_email_regardless_of_case", "xU:EmployeeServiceTests.Another_tenant_may_reuse_an_employee_code_and_email"]

  - id: F-EMP-020
    name: Birth country/state/city must cascade correctly (state requires country, city requires state, each must belong to its stated parent)
    group: Create
    status: Implemented
    ui: "PersonalDetailsForm birth-location cascading MasterDropdowns"
    api: "POST /api/employees, POST /api/employees/personal-details"
    service: "EmployeeService.ValidateReferencesAsync / ValidateBirthLocationAsync (shared logic; the FluentValidation layer only checks shape - that a state/city id without its parent id is rejected - the service checks the parent-child DB relationship)"
    permission: "Employee.Create"
    db: "Countries, States, Cities"

  - id: F-EMP-021
    name: Legacy create request-shape validation (code format/length, name/email/phone format, date-of-birth vs date-of-joining age floor, ESIC-number-required-when-applicable)
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees"
    service: "EmployeeRequestValidator"
    permission: "Employee.Create"
    db: "none"

  - id: F-EMP-022
    name: A DateOfLeaving is forbidden for an Active employee and required for any non-Active status, and must not precede DateOfJoining
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees, PUT /api/employees/{id}"
    service: "EmployeeRequestValidator (DateOfLeaving Null()/NotNull() cross-checks against Status)"
    permission: "Employee.Create"
    db: "none"

  - id: F-EMP-023
    name: Employee Status defaults to Active server-side when the request omits it (sends the enum default)
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees"
    service: "EmployeeService.CreateAsync ('request.Status == default ? EmployeeStatus.Active : request.Status')"
    permission: "Employee.Create"
    db: "Employees.Status"

  - id: F-EMP-024
    name: Employee create runs inside a single SaveChangesAsync; a uniqueness race is caught and turned into a Conflict rather than surfacing a raw database exception
    group: Create
    status: Implemented
    ui: "n/a"
    api: "POST /api/employees, POST /api/employees/personal-details"
    service: "EmployeeService.CreateAsync (DbUpdateException catch re-probes FindConflictAsync before rethrowing)"
    permission: "Employee.Create"
    db: "Employees"

  # ── C. Personal Details fields ────────────────────────────────────────────
  - id: F-EMP-025
    name: First name and last name are required, max 100 characters each
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm First/Last name inputs"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.FirstName/LastName"

  - id: F-EMP-026
    name: Middle name, salutation, religion, caste, citizenship, language known are optional free text with no length limit enforced beyond the underlying column
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm optional fields"
    api: "POST/PUT .../personal-details"
    service: "EmployeeService.ApplyPersonalDetails (Normalize: trims, blank becomes null)"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees"

  - id: F-EMP-027
    name: Gender, blood group, marital status are validated as recognized enum members
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm <select> controls"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator (Gender.IsInEnum()); BloodGroup/MaritalStatus accepted as any defined value including Unspecified"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.Gender/BloodGroup/MaritalStatus"

  - id: F-EMP-028
    name: Date of joining is required, must be within 1 year in the future and no more than 100 years in the past
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm 'Date of joining'"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator (Cascade(Stop): default check, then the two Must() date-window checks)"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.DateOfJoining"

  - id: F-EMP-029
    name: Date of birth, when supplied, must be in the past and no more than 120 years ago, and the employee must be at least 14 on the date of joining
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm 'Date of birth'"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator (age check is against DateOfJoining, not today, so an old record never becomes invalid merely because time passed)"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.DateOfBirth"

  - id: F-EMP-030
    name: Aadhaar (12 digits), PAN (5 letters+4 digits+1 letter), UAN (12 digits) are format-validated only when supplied - all three are optional
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm sensitive-identifier inputs (rendered only with EmployeeSensitive.Edit)"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator (Matches regex, When !string.IsNullOrWhiteSpace)"
    permission: "Employee.Create / Employee.Edit + EmployeeSensitive.Edit (to actually persist them, F-EMP-015)"
    db: "Employees.AadhaarNumber/PanNumber/UanNumber"

  - id: F-EMP-031
    name: ESIC Number is required when ESIC Applicable is true, optional otherwise, max 50 characters
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm 'ESIC applicable' toggle + 'ESIC number'"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator (NotEmpty().When(EsicApplicable))"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.EsicNumber/EsicApplicable"
    ex: ["xU:EmployeePersonalDetailsTests.Create_requires_esic_number_when_esic_is_applicable"]

  - id: F-EMP-032
    name: Sensitive identifiers (PF/UAN/Aadhaar/PAN) are returned masked on every read; a blank/omitted value on edit means keep-the-stored-value, not clear-it
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm (edit mode never shows the raw value it would overwrite)"
    api: "GET /api/employees/{id}, PUT .../personal-details"
    service: "EmployeeDto.MaskAadhaar/MaskPan/MaskNumericId; EmployeeService.OverwriteOrKeep (preserveSensitive=true on UpdatePersonalDetailsAsync)"
    permission: "Employee.View / Employee.Edit"
    db: "Employees (masking is projection-only, not stored)"
    ex: ["xU:EmployeePersonalDetailsEndToEndTests.Edit_with_blank_sensitive_ids_keeps_the_stored_values"]

  - id: F-EMP-033
    name: Raw (unmasked) sensitive identifiers are exposed only through GET /api/employees/{id}/sensitive-details, gated by an additional EmployeeSensitive.View permission
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm edit screen (fetches sensitive-details only when authorized)"
    api: "GET /api/employees/{id}/sensitive-details"
    service: "EmployeeService.GetSensitiveDetailsAsync"
    permission: "Employee.View + EmployeeSensitive.View"
    db: "Employees.AadhaarNumber/PanNumber/UanNumber/PfNumber/EsicNumber/MediclaimNumber (raw)"
    ex: ["xU:EmployeeSensitiveDataEndpointsTests.General_reads_are_masked_and_raw_statutory_values_require_narrow_permissions"]

  - id: F-EMP-034
    name: GetSensitiveDetailsAsync does not apply the employment-scope access predicate GetAsync/GetByIdAsync use
    group: Personal Details
    status: Needs clarification
    ui: "n/a"
    api: "GET /api/employees/{id}/sensitive-details (as a scope-restricted role holding EmployeeSensitive.View, targeting an employee id outside that scope)"
    service: "EmployeeService.GetSensitiveDetailsAsync (only checks _tenantContext.TenantId - no _accessScope.CanAccessEmployeeAsync call, unlike GetByIdAsync)"
    permission: "Employee.View + EmployeeSensitive.View"
    db: "Employees (tenant-filtered only, not scope-filtered)"

  - id: F-EMP-035
    name: Personal Details update preserves every field it does not itself own (department, designation, manager, contact, address, bank, employment)
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm save (only personal-details endpoint is called)"
    api: "PUT /api/employees/{id}/personal-details"
    service: "EmployeeService.ApplyPersonalDetails (touches only the Personal Details field subset)"
    permission: "Employee.Edit"
    db: "Employees (partial column update)"
    ex: ["xU:EmployeePersonalDetailsTests.Update_updates_only_personal_fields_on_an_existing_employee"]

  - id: F-EMP-036
    name: Unicode names (non-Latin scripts, diacritics) round-trip unchanged through create/update/read
    group: Personal Details
    status: Implemented
    ui: "PersonalDetailsForm text inputs (no charset restriction)"
    api: "POST/PUT .../personal-details"
    service: "EmployeeService.ApplyPersonalDetails (Trim only; no charset filtering anywhere in the validator or service)"
    permission: "Employee.Create / Employee.Edit"
    db: "Employees.FirstName/LastName/MiddleName (nvarchar/utf8mb4 per provider)"

  - id: F-EMP-037
    name: Whitespace-only first/last name is rejected by NotEmpty (FluentValidation trims before the check)
    group: Personal Details
    status: Implemented
    ui: "n/a"
    api: "POST/PUT .../personal-details"
    service: "EmployeePersonalDetailsRequestValidator.FirstName/LastName NotEmpty()"
    permission: "Employee.Create"
    db: "none"

  - id: F-EMP-038
    name: Personal Details GET/PUT on a nonexistent or cross-tenant employee id returns 404
    group: Personal Details
    status: Implemented
    ui: "n/a"
    api: "GET/PUT /api/employees/{id}/personal-details"
