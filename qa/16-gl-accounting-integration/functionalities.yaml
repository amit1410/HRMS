# Functionality registry for Module 16 - GL / Accounting Integration (phase "Payroll Accounting GL
# Posting"): GL chart-of-accounts master data, effective-dated accounting configuration
# versions, GL mapping rules (salary component / statutory / loan / reimbursement / gratuity /
# leave-encashment / notice-pay sources), payroll-to-GL journal generation from an
# approved/finalized payroll run, a SEPARATE final-settlement journal generation path (gratuity,
# leave encashment, notice pay/recovery, loan final-settlement recovery, reimbursement), the
# Generated->Validated->Approved->Posted lifecycle, CSV export, append-only (but API-invisible)
# history, the payroll-analytics reconciliation integration boundary, Authorization/Scope, Tenant
# Isolation, Concurrency/Idempotency, SQL Server/MySQL Provider Parity, Large Data/Paging, and
# Frontend. Every test case references one or more of these ids; the builder fails the build if a
# functionality has zero cases or a case references an unknown id. IDs are allocated in one global
# sequence (F-GLACC-001...) in the order the groups below were authored - group boundaries are
# noted with a comment banner.
#
# SCOPE NOTE (read before extending this module): this module covers exactly
# Backend/HRMS.Application/Services/PayrollAccountingService.cs (interface
# IPayrollAccountingService) and its controller (PayrollAccountingController in
# Backend/HRMS.API/Controllers/PayrollOutputsController.cs, route prefix api/payroll/accounting),
# plus the 6 GL-specific reconciliation findings that
# Backend/HRMS.Application/Services/PayrollAnalyticsService.cs independently re-derives about it
# (tested here only as an integration-boundary check, not as full coverage of the
# analytics/reconciliation engine itself - that engine, together with the general
# PayrollReconciliation/PayrollVarianceControls/PayrollAnomalyFlags surface and the non-GL
# dimension-summary/control-totals endpoints on PayrollAnalyticsService, has no dedicated qa module
# yet and is explicitly out of scope here, following the qa/15 precedent for BankAdvice's own
# reconciliation-boundary scoping). Also explicitly out of scope: payroll-run creation/
# calculation/approval itself (qa/10-payroll's own surface - this module only tests the
# Approved/Finalized status GATE that Generate reads), final-settlement case creation/calculation/
# approval/finalization itself (owned by PayrollRetroSettlementController/
# IPayrollRetroSettlementService - this module only tests the Finalized status GATE that
# GenerateFinalSettlementAsync reads, and reads the already-persisted LoanRepayments/
# ReimbursementSettlements/GratuityCalculations/LeaveEncashmentCalculations/
# NoticeSettlementCalculations rows those other modules produce, purely as source data), bank
# advice / salary disbursement (BankAdviceService/BankAdviceController - a separate,
# already-distinct service with no PayrollAccounting/Journal reference of any kind, confirmed by
# qa/15's own scope note), and loan/reimbursement/gratuity/leave-encashment/notice-settlement
# CALCULATION itself (owned by their respective services - this module only tests that GL mapping
# and journal generation correctly consumes their already-persisted, already-finalized output rows).
#
# Discovered implementation (authoritative source, read directly - not assumed from any design doc;
# no docs/phase-*.md file specifically describing GL accounting was found in this repository at
# authoring time - current code is the sole source of truth here, per CLAUDE.md):
#   Backend/HRMS.API/Controllers/PayrollOutputsController.cs (PayrollAccountingController, every
#     route under api/payroll/accounting plus the two /accounting/generate routes nested under
#     api/payroll/runs/{runId} and api/payroll/final-settlements/{id} - every action read)
#   Backend/HRMS.Application/Abstractions/IPayrollAccountingService.cs (read in full, 17 methods)
#   Backend/HRMS.Application/Services/PayrollAccountingService.cs (read in full, all ~200 lines)
#   Backend/HRMS.Application/DTOs/Payroll/PayrollAccountingDtos.cs (read in full)
#   Backend/HRMS.Domain/Entities/PayrollAccounting.cs (PayrollGLAccount/PayrollAccountingConfiguration/
#     PayrollAccountingConfigurationVersion/PayrollGLMapping/PayrollJournalBatch/PayrollJournalLine/
#     PayrollJournalLineSource/PayrollJournalHistory - 8 entities, read in full)
#   Backend/HRMS.Domain/Enums/PayrollEnums.cs (PayrollGLAccountType, PayrollAccountingConfiguration
#     VersionStatus, PayrollGLMappingType [23 members], PayrollJournalAggregationMode,
#     PayrollJournalStatus, PayrollJournalHistoryChangeType, PayrollControlScope.Accounting,
#     PayrollControlMetric.GLTotal, FinalSettlementStatus)
#   Backend/HRMS.Infrastructure/Persistence/Configurations/PayrollAccountingConfiguration.cs (all 8
#     EF configurations, every index and FK, read in full)
#   Backend/HRMS.Application/Services/PayrollApprovalGuard.cs (the shared opt-in
#     self-approval/reason-required guard, re-read for its RequireMakerChecker/PreventSelfApproval
#     fields, used here by Approve and Post)
#   Migration pair AddPayrollAccountingGLPosting confirmed present in both
#     Backend/HRMS.Infrastructure/Persistence/Migrations (SQL Server, 20260920033921) and
#     Backend/HRMS.Infrastructure.MySqlMigrations/Migrations (MySQL, 20260920033934); migration pair
#     AddFinalSettlementAccountingJournalSql/MySql confirmed present in both chains (SQL Server
#     20260921030615, MySQL 20260921030628)
#   Backend/HRMS.Domain/Authorization/Permissions.cs (Payroll.Accounting* block, 8 permissions,
#     read in full)
#   Backend/HRMS.Infrastructure/Persistence/Seed/SeedData.cs (full-file grep for all 8 Accounting
#     permission constants and RolePermissionMap arrays for SuperAdmin/TenantAdmin/HRAdmin/
#     HRManager/SuperHR/Accounts/IT/Manager/Employee, every role read)
#   Backend/HRMS.Application/Services/PayrollAnalyticsService.cs (AddSourceFindingsAsync's 6
#     GL-specific findings, lines ~193-216, read in full for the integration-boundary group; the
#     overview/summary endpoints' AccountingDebitTotal/AccountingCreditTotal/GLTotal wiring, lines
#     ~13-42, read for the integration-boundary group only)
#   Backend/HRMS.Application/Services/SeparationService.cs (full grep for "Accounting"/"Journal"/
#     "GL" - zero matches; final-settlement accounting is instead driven entirely from
#     PayrollAccountingService's own GenerateFinalSettlementAsync reading FinalSettlementCases/
#     LoanRepayments/ReimbursementSettlements/GratuityCalculations/LeaveEncashmentCalculations/
#     NoticeSettlementCalculations directly)
#   Frontend/HRMS.Web/src/pages/payroll/PayrollAccountingPage.tsx (no .test.tsx exists for this
#     page - confirmed by directory listing), PayrollAccountingConfigurationPage.tsx (+ its
#     .test.tsx, read in full), src/api/payroll.ts's Accounting section (read in full, lines
#     392-408), src/auth/permissions.ts's mirror (read in full); App.tsx and layout/navigation.ts
#     grepped for route/nav registration
#   Existing xUnit inventory (PayrollAccountingTests, SqlServerPayrollAccountingIntegrationTests,
#     MySqlPayrollAccountingIntegrationTests, PayrollAccountingProviderAcceptance,
#     PayrollFinalSettlementAccountingTests, ReimbursementAccountingTests - 6 files, referenced
#     narratively per the qa/8-15 precedent, not individually classified; test method names surveyed
#     but not read in full)
#
# -- Headline findings that shape this whole module's cases (see clarifications.yaml for full detail) --
# CR-274: a full grep of SeedData.cs's RolePermissionMap for all 8 Payroll.Accounting* constants
# returns zero matches in any role array except the blanket Permissions.All grant to
# SuperAdmin/TenantAdmin - identical shape to qa/15's CR-263 for BankAdvice.
# CR-275: CONFIRMED - PayrollJournalStatus.Cancelled/PayrollJournalHistoryChangeType.Cancelled are
# declared, and GenerateAsync's own active-journal guard explicitly excludes Cancelled status
# (implying a cancel-then-regenerate design), but IPayrollAccountingService has no CancelAsync (or
# any reversal) method anywhere - a generated journal can never be cancelled or regenerated for the
# same payroll run/final settlement, full stop.
# CR-276: CONFIRMED - PayrollJournalStatus.Exported/PayrollJournalHistoryChangeType.Exported are
# declared and ExportAsync's own precondition explicitly allows status Exported, but ExportAsync
# never transitions status to Exported, stamps ExportedAtUtc/ExportedByUserId, or records an
# Exported history event - export is a stateless read-only CSV download.
# CR-277: CONFIRMED - PayrollJournalHistoryChangeType.Reversed is declared with zero corresponding
# functionality; PayrollAnalyticsService's own BrokenAccountingReversalLinkage finding looks for a
# PayrollJournalLineSource.SourceType containing "Reversal", a value AddLine can never produce
# (only "EmployeeLoan"/"FinalSettlement").
# CR-278: CONFIRMED - PayrollJournalDto carries no History field at all, and neither
# GetAsync nor ListAsync ever Include(x => x.History) - journal history is captured (and, unlike
# qa/15's BankAdvice CR-272, its ActorUserId IS populated) but is completely unreachable through
# any exposed API, despite a dedicated Payroll.Accounting.ViewHistory permission being declared and
# seeded.
functionalities:
  # =========================== A. GL ACCOUNT MASTER DATA ===========================
  - id: F-GLACC-001
    name: ListAccountsAsync requires an authenticated tenant context, else Unauthorized
    group: GL Account Master Data
    status: Implemented
    api: "GET /api/payroll/accounting/accounts"
    service: "PayrollAccountingService.ListAccountsAsync"
    permission: "Payroll.Accounting.View"
    db: "n/a"

  - id: F-GLACC-002
    name: CreateAccountAsync requires a non-blank Code and Name, else Invalid
    group: GL Account Master Data
    status: Implemented
    api: "POST /api/payroll/accounting/accounts"
    service: "PayrollAccountingService.CreateAccountAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLAccounts.Code, Name

  - id: F-GLACC-003
    name: "Account Code is upper-cased and trimmed before persistence/duplicate checking; the tenant-scoped unique (TenantId, Code) index blocks a duplicate code with Conflict, but an identical code is allowed for a different tenant"
    group: GL Account Master Data
    status: Implemented
    service: "PayrollAccountingService.CreateAccountAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: "PayrollGLAccounts unique (TenantId, Code)"

  - id: F-GLACC-004
    name: UpdateAccountAsync requires the account to exist in the tenant, else NotFound
    group: GL Account Master Data
    status: Implemented
    api: "PUT /api/payroll/accounting/accounts/{id}"
    service: "PayrollAccountingService.UpdateAccountAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLAccounts (TenantId filter)

  - id: F-GLACC-005
    name: UpdateAccountAsync re-checks the unique code constraint excluding the account's own row, else Conflict
    group: GL Account Master Data
    status: Implemented
    service: "PayrollAccountingService.UpdateAccountAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: "PayrollGLAccounts unique (TenantId, Code)"

  - id: F-GLACC-006
    name: AccountType is one of exactly Expense, Liability, Asset, Clearing (PayrollGLAccountType, stored as int)
    group: GL Account Master Data
    status: Implemented
    service: "PayrollGLAccountConfiguration (HasConversion<int>)"
    permission: "n/a"
    db: PayrollGLAccounts.AccountType

  - id: F-GLACC-007
    name: ListAccountsAsync is ordered by Code ascending and follows the shared PagedQuery paging contract (page size clamped to MaxPageSize=100)
    group: GL Account Master Data
    status: Implemented
    service: "PayrollAccountingService.ListAccountsAsync"
    permission: "Payroll.Accounting.View"
    db: PayrollGLAccounts.Code

  - id: F-GLACC-008
    name: "CONFIRMED GAP - there is no delete/deactivate endpoint for a PayrollGLAccount itself (only IsActive can be toggled false via UpdateAccountAsync); an account already referenced by posted journal lines can still have IsActive flipped to false through the same UpdateAccountAsync path used for any other edit, with no reference-check guarding it"
    group: GL Account Master Data
    status: Implemented
    service: "Backend/HRMS.Application/Abstractions/IPayrollAccountingService.cs (full interface - no DeleteAccount/DeactivateAccount method)"
    permission: "n/a"
    db: PayrollGLAccounts.IsActive

  # =========================== B. ACCOUNTING CONFIGURATION & VERSIONING ===========================
  - id: F-GLACC-009
    name: ListConfigurationsAsync eagerly includes each configuration's Versions, newest EffectiveFrom first, on every page row
    group: Accounting Configuration & Versioning
    status: Implemented
    api: "GET /api/payroll/accounting/configurations"
    service: "PayrollAccountingService.ListConfigurationsAsync"
    permission: "Payroll.Accounting.View"
    db: PayrollAccountingConfigurations, PayrollAccountingConfigurationVersions

  - id: F-GLACC-010
    name: CreateConfigurationAsync requires non-blank Code/Name and a tenant-unique upper-cased Code, else Invalid/Conflict
    group: Accounting Configuration & Versioning
    status: Implemented
    api: "POST /api/payroll/accounting/configurations"
    service: "PayrollAccountingService.CreateConfigurationAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: "PayrollAccountingConfigurations unique (TenantId, Code)"

  - id: F-GLACC-011
    name: CreateVersionAsync requires the parent configuration to exist and be IsActive=true in the tenant, else NotFound
    group: Accounting Configuration & Versioning
    status: Implemented
    api: "POST /api/payroll/accounting/configurations/{id}/versions"
    service: "PayrollAccountingService.CreateVersionAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurations (TenantId, IsActive filter)

  - id: F-GLACC-012
    name: CreateVersionAsync rejects EffectiveTo earlier than EffectiveFrom, else Invalid
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "PayrollAccountingService.CreateVersionAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions.EffectiveFrom, EffectiveTo

  - id: F-GLACC-013
    name: "CreateVersionAsync rejects a date range that overlaps any other Active version of the same configuration (open-ended EffectiveTo treated as DateOnly.MaxValue), else Conflict"
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "PayrollAccountingService.CreateVersionAsync (overlap AnyAsync)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions.EffectiveFrom, EffectiveTo, Status

  - id: F-GLACC-014
    name: A new version always starts at Status=Active (there is no Draft-first workflow for versions themselves, unlike journals)
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "PayrollAccountingService.CreateVersionAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions.Status

  - id: F-GLACC-015
    name: AggregationMode (Account/AccountAndCostCenter/EmployeeDetail) is stored verbatim on the version as requested
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "PayrollAccountingService.CreateVersionAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions.AggregationMode

  - id: F-GLACC-016
    name: "CONFIRMED DEAD CONFIGURATION FIELD - AggregationMode is never read anywhere in GenerateAsync or GenerateFinalSettlementAsync (full grep of PayrollAccountingService.cs); every journal is generated at one fixed per-employee, per-component, per-account granularity regardless of which of the 3 aggregation modes is configured"
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "Backend/HRMS.Application/Services/PayrollAccountingService.cs (GenerateAsync, GenerateFinalSettlementAsync - full grep for AggregationMode, zero references outside CreateVersionAsync/the DTO)"
    permission: "n/a"
    db: PayrollAccountingConfigurationVersions.AggregationMode

  - id: F-GLACC-017
    name: "The active configuration version used by Generate is resolved by EffectiveFrom<=PeriodEndDate/SettlementDate AND (EffectiveTo IS NULL OR EffectiveTo>=that date) AND Status=Active, taking the single row with the latest EffectiveFrom - if none matches, Generate is Conflict (\"No active accounting configuration applies\")"
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync, GenerateFinalSettlementAsync (version resolution query)"
    permission: "Payroll.Accounting.Generate"
    db: PayrollAccountingConfigurationVersions.EffectiveFrom, EffectiveTo, Status

  - id: F-GLACC-018
    name: "CONFIRMED GAP - there is no endpoint to retire/deactivate a PayrollAccountingConfiguration or a PayrollAccountingConfigurationVersion once created (IPayrollAccountingService's full interface has no such method); PayrollAccountingConfigurationVersionStatus.Retired is a declared enum member with no code path that ever assigns it"
    group: Accounting Configuration & Versioning
    status: Implemented
    service: "Backend/HRMS.Application/Abstractions/IPayrollAccountingService.cs (full interface, no retire/deactivate-configuration or deactivate-version method); PayrollAccountingService.cs (full grep for PayrollAccountingConfigurationVersionStatus.Retired - zero assignments)"
    permission: "n/a"
    db: PayrollAccountingConfigurationVersions.Status

  # =========================== C. GL MAPPING RULES ===========================
  - id: F-GLACC-019
    name: CreateMappingAsync/UpdateMappingAsync both funnel through one private SaveMappingAsync; the target configuration version must exist, be Active status, and belong to the tenant, else NotFound
    group: GL Mapping Rules
    status: Implemented
    api: "POST /api/payroll/accounting/versions/{id}/mappings, PUT /api/payroll/accounting/mappings/{id}"
    service: "PayrollAccountingService.SaveMappingAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions (TenantId, Status filter)

  - id: F-GLACC-020
    name: "A mapping must specify at least one of: SalaryComponentId, StatutoryType, MappingType=NetPayable, or one of 15 explicitly-supported non-component MappingType values (loan/reimbursement/gratuity/leave/notice sources) - else Invalid (\"A salary component, statutory type, or supported source is required.\")"
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (supportedMapping check)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings.SalaryComponentId, StatutoryType, MappingType

  - id: F-GLACC-021
    name: Every non-null account id on the request (Debit/Credit/EmployerContribution) must reference an Active PayrollGLAccount belonging to the tenant, else Conflict ("All mapped GL accounts must be active and belong to the tenant.")
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (accountIds validation)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLAccounts (TenantId, IsActive filter)

  - id: F-GLACC-022
    name: "A duplicate ACTIVE mapping (same ConfigurationVersionId+SalaryComponentId+StatutoryType+MappingType, excluding the row being updated) is rejected with Conflict (\"Duplicate accounting mapping.\")"
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (duplicate AnyAsync)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings (TenantId, ConfigurationVersionId, SalaryComponentId, StatutoryType, MappingType, IsActive)

  - id: F-GLACC-023
    name: Priority is stored verbatim and is the ordering key GenerateAsync uses to pick among multiple active candidate mappings for the same component (OrderBy(Priority).FirstOrDefault)
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync, GenerateAsync (OrderBy Priority)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings.Priority

  - id: F-GLACC-024
    name: DeactivateMappingAsync sets IsActive=false on the mapping (tenant-scoped, NotFound if absent) - this is the ONLY way to remove a mapping from consideration; there is no hard-delete endpoint
    group: GL Mapping Rules
    status: Implemented
    api: "DELETE /api/payroll/accounting/mappings/{id}"
    service: "PayrollAccountingService.DeactivateMappingAsync"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings.IsActive

  - id: F-GLACC-025
    name: "The 23-member PayrollGLMappingType enum spans ordinary salary-component earnings/deductions (Earnings/EmployeeDeduction/EmployerContribution/StatutoryLiability/NetPayable) and 18 special-purpose source types for loans, reimbursements, gratuity, leave encashment, and notice pay/recovery"
    group: GL Mapping Rules
    status: Implemented
    service: "Backend/HRMS.Domain/Enums/PayrollEnums.cs (PayrollGLMappingType)"
    permission: "n/a"
    db: PayrollGLMappings.MappingType

  - id: F-GLACC-026
    name: A mapping's DebitAccountId/CreditAccountId/EmployerContributionAccountId are each independently optional at save time - only Generate-time mapping RESOLUTION enforces which of the three must be non-null for a given usage
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (no per-MappingType required-account validation)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings.DebitAccountId, CreditAccountId, EmployerContributionAccountId

  - id: F-GLACC-027
    name: "CONFIRMED GAP - EmployerContributionAccountId is a settable field on every mapping request/DTO, but a full grep of GenerateAsync/GenerateFinalSettlementAsync/AddLine shows the field is NEVER read anywhere in journal generation - only DebitAccountId/CreditAccountId ever produce a line; a separately-designated employer-contribution account has no effect on the generated journal"
    group: GL Mapping Rules
    status: Implemented
    service: "Backend/HRMS.Application/Services/PayrollAccountingService.cs (full grep for EmployerContributionAccountId - only ever read into the accountIds resolution set, never used to choose a line's account)"
    permission: "n/a"
    db: PayrollGLMappings.EmployerContributionAccountId

  - id: F-GLACC-028
    name: A cross-tenant configuration version id on CreateMapping is NotFound, not Forbidden
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (TenantId filter)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollAccountingConfigurationVersions (TenantId filter)

  - id: F-GLACC-029
    name: UpdateMappingAsync resolves the mapping's own ConfigurationVersionId from the existing row - the caller cannot move a mapping to a different configuration version via update
    group: GL Mapping Rules
    status: Implemented
    service: "PayrollAccountingService.SaveMappingAsync (target?.ConfigurationVersionId ?? versionId)"
    permission: "Payroll.Accounting.ManageConfiguration"
    db: PayrollGLMappings.ConfigurationVersionId

  - id: F-GLACC-030
    name: Cost-center/department/location dimensions have no representation anywhere in the mapping model - PayrollGLMappingRequest/PayrollGLMapping have no CostCenterId, DepartmentId, or LocationId field of any kind
    group: GL Mapping Rules
    status: Implemented
    service: "Backend/HRMS.Application/DTOs/Payroll/PayrollAccountingDtos.cs, Backend/HRMS.Domain/Entities/PayrollAccounting.cs (PayrollGLMapping, full field list)"
    permission: "n/a"
    db: PayrollGLMappings (full column list)

  # =========================== D. JOURNAL GENERATION FROM PAYROLL RUN ===========================
  - id: F-GLACC-031
    name: GenerateAsync requires an authenticated tenant context, else Unauthorized
    group: Journal Generation from Payroll Run
    status: Implemented
    api: "POST /api/payroll/runs/{runId}/accounting/generate"
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: "n/a"

  - id: F-GLACC-032
    name: GenerateAsync requires the target PayrollRun (with its PayrollPeriod) to exist in the tenant, else NotFound
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: PayrollRuns, PayrollPeriods (TenantId filter)

  - id: F-GLACC-033
    name: GenerateAsync requires PayrollRun.Status to be Approved or Finalized, else Conflict - Draft/Prepared/Processing/Calculated/Cancelled are all rejected
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: PayrollRuns.Status

  - id: F-GLACC-034
    name: "GenerateAsync blocks a second generation while a non-Cancelled journal already exists for the same PayrollRunId, else Conflict - but since Cancelled is unreachable (CR-275), this guard in practice permanently blocks any second Generate call for a run once one has ever succeeded"
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync (AnyAsync guard)"
    permission: "Payroll.Accounting.Generate"
    db: PayrollJournalBatches (TenantId, PayrollRunId, Status)
    cr: [CR-275]

  - id: F-GLACC-035
    name: GenerateAsync sources rows strictly from PayrollResults where IsCurrent=true AND Status=Calculated for the run, including each result's Components collection - Failed or superseded rows never contribute a line
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: PayrollResults.IsCurrent, Status; PayrollResultComponents

  - id: F-GLACC-036
    name: GenerateAsync requires at least one eligible PayrollResult row, else Conflict ("No calculated payroll results are available.")
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: PayrollResults

  - id: F-GLACC-037
    name: "Each PayrollResultComponent with CalculatedAmount != 0 is mapped to a candidate PayrollGLMapping by CalculationSource: \"LoanRecovery\" -> LoanPayrollRecovery mapping type; \"TaxableReimbursement\"/\"NonTaxableReimbursement\" -> TaxableReimbursementExpense/ReimbursementExpense; everything else -> the active mapping whose SalaryComponentId matches the component's own SalaryComponentId, chosen by lowest Priority"
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync (mapping selection)"
    permission: "Payroll.Accounting.Generate"
    db: PayrollGLMappings.MappingType, SalaryComponentId, Priority

  - id: F-GLACC-038
    name: 'A component with no matching mapping, or a matching mapping missing a required Debit/Credit account, or referencing an inactive/nonexistent account, is Conflict ("MissingGLMapping for component {code}.") - no journal is persisted'
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync"
    permission: "Payroll.Accounting.Generate"
    db: PayrollGLMappings, PayrollGLAccounts

  - id: F-GLACC-039
    name: "For an ordinary (non-LoanRecovery) component: IsEarning or IsEmployerContribution produces a Debit line on the mapping's DebitAccountId; IsDeduction or IsEmployerContribution produces a Credit line on the CreditAccountId - a component flagged as employer-contribution therefore produces BOTH a debit and a credit line on the same amount"
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync (AddLine calls)"
    permission: "Payroll.Accounting.Generate"
    db: PayrollJournalLines.Debit, Credit

  - id: F-GLACC-040
    name: 'A LoanRecovery-sourced component produces a single Credit-only line on the mapping''s CreditAccountId, sourced/traced to the LoanInstallmentId (falling back to EmployeeLoanId, then the component''s own Id) via a "LoanRepayment" PayrollJournalLineSource'
    group: Journal Generation from Payroll Run
    status: Implemented
    service: "PayrollAccountingService.GenerateAsync (LoanRecovery branch)"
    permission: "Payroll.Accounting.Generate"
    db: PayrollJournalLines, PayrollJournalLineSources (SourceType=LoanRepayment)

  - id: F-GLACC-041
