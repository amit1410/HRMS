sheet: GLAcc_Journal_Lifecycle
submodule: Journal Lifecycle - Validate, Approve & Post
defaults:
  tenant: "T1 (DEMO01)"
  reg: true

cases:
  - id: GLACC-LC-001
    func: [F-GLACC-061]
    sc: Validate requires Status=Generated
    t: ValidateAsync succeeds only from Generated; any other status is Conflict
    src: "PayrollAccountingService.TransitionAsync (Validated, Generated)"
    type: Negative
    tags: [Boundary]
    pri: P0
    sev: High
    pre: "J1 is at Status=Validated already (having been validated once)"
    role: HRAdmin (custom role holding Accounting.Validate)
    perm: Payroll.Accounting.Validate
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J1}/validate] a second time => [409] Conflict (Invalid journal transition from Validated to Validated.)"
    auto: API

  - id: GLACC-LC-002
    func: [F-GLACC-062]
    sc: Validate performs no independent balance re-check
    t: Because Generate already guarantees a balanced journal, Validate always succeeds on a Generated journal with no ability to independently discover an imbalance
    src: "PayrollAccountingService.TransitionAsync"
    type: Contract
    tags: []
    pri: P2
    sev: Low
    pre: "J2 is at Status=Generated, balanced (as guaranteed by Generate)"
    role: HRAdmin (custom role holding Accounting.Validate)
    perm: Payroll.Accounting.Validate
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J2}/validate] => [200] Status=='Validated' unconditionally - no separate balance/mapping check is performed beyond the status gate"
    auto: API
    cr: [CR-280]

  - id: GLACC-LC-003
    func: [F-GLACC-063]
    sc: Approve requires Status=Validated
    t: ApproveAsync succeeds only from Validated; Generated/Approved/Posted are all Conflict
    src: "PayrollAccountingService.TransitionAsync (Approved, Validated)"
    type: Negative
    tags: [Boundary]
    pri: P0
    sev: High
    pre: "J3 is at Status=Generated (never validated)"
    role: HRAdmin (custom role holding Accounting.Approve)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J3}/approve] => [409] Conflict (Invalid journal transition from Generated to Approved.)"
    auto: API

  - id: GLACC-LC-004
    func: [F-GLACC-064]
    sc: Approve/Post defense-in-depth balance re-check
    t: An already-unbalanced row (simulated via direct DB manipulation of TotalDebit) is rejected by Approve and Post even if it somehow reached the right status
    src: "PayrollAccountingService.TransitionAsync (balance re-check)"
    type: Negative
    tags: [Boundary]
    pri: P1
    sev: Medium
    pre: "J4 is at Status=Validated but its TotalDebit has been directly corrupted in the DB to differ from TotalCredit (simulating drift)"
    role: HRAdmin (custom role holding Accounting.Approve)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J4}/approve] => [409] Conflict (Unbalanced journals cannot be approved or posted.)"
    auto: DB-assisted
    db: "Directly set TotalDebit != TotalCredit on J4 before calling Approve"

  - id: GLACC-LC-005
    func: [F-GLACC-065]
    sc: Opt-in self-approval guard on Approve and Post
    t: When RequireMakerChecker and PreventSelfApproval are both enabled, the journal's own generator cannot approve or post it
    src: "PayrollAccountingService.TransitionAsync -> PayrollApprovalGuard.ValidateAsync"
    type: Authorization
    tags: [Negative, Security]
    pri: P1
    sev: Medium
    pre: "T1's PayrollControlConfiguration has RequireMakerChecker=true, PreventSelfApproval=true; J5 (Validated) was generated by user U1, who also holds Accounting.Approve"
    role: U1 (generator, also holds Accounting.Approve)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J5}/approve] as U1 => [409 or 403] rejected by the self-approval guard"
      - "[POST /api/payroll/accounting/{J5}/approve] as a different user U2 holding Accounting.Approve => [200] succeeds"
    auto: API
    secc: true

  - id: GLACC-LC-006
    func: [F-GLACC-066]
    sc: Approve stamps ApprovedAtUtc and increments concurrency version
    t: A successful Approve sets ApprovedAtUtc and increments ConcurrencyVersion by exactly 1
    src: "PayrollAccountingService.TransitionAsync (Approved branch)"
    type: Positive
    tags: []
    pri: P1
    sev: Medium
    pre: "J6 is Validated, ConcurrencyVersion=1"
    role: HRAdmin (custom role holding Accounting.Approve)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J6}/approve] => [200] Status=='Approved', ApprovedAtUtc is set"
    auto: DB-assisted
    db: "Assert ConcurrencyVersion incremented from 1 to 2"

  - id: GLACC-LC-007
    func: [F-GLACC-067]
    sc: ApprovedByUserId/PostedByUserId are never populated
    t: After a successful Approve then Post, the entity's ApprovedByUserId and PostedByUserId columns remain null despite an acting user being present
    src: "PayrollAccountingService.TransitionAsync"
    type: Negative
    tags: [Boundary]
    pri: P2
    sev: Low
    pre: "J7 is Validated"
    role: HRAdmin (custom role holding Accounting.Approve, Post)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J7}/approve] => [200] Approved"
      - "[POST /api/payroll/accounting/{J7}/post] => [200] Posted"
    auto: DB-assisted
    db: "Assert PayrollJournalBatches.ApprovedByUserId IS NULL and PostedByUserId IS NULL despite ApprovedAtUtc/PostedAtUtc being set"
    cr: [CR-288]

  - id: GLACC-LC-008
    func: [F-GLACC-068]
    sc: Post requires Status=Approved
    t: PostAsync succeeds only from Approved; Generated/Validated/Posted are all Conflict, and success stamps PostedAtUtc
    src: "PayrollAccountingService.TransitionAsync (Posted, Approved)"
    type: Negative
    tags: [Boundary]
    pri: P0
    sev: High
    pre: "J8 is at Status=Validated (not yet Approved)"
    role: HRAdmin (custom role holding Accounting.Post)
    perm: Payroll.Accounting.Post
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J8}/post] => [409] Conflict (Invalid journal transition from Validated to Posted.)"
    auto: API

  - id: GLACC-LC-009
    func: [F-GLACC-069]
    sc: Post history message confirms internal-only posting
    t: A successful Post's history Message is exactly "Payroll journal posted within HRMS."
    src: "PayrollAccountingService.PostAsync"
    type: Contract
    tags: []
    pri: P3
    sev: Low
    pre: "J9 is Approved"
    role: HRAdmin (custom role holding Accounting.Post)
    perm: Payroll.Accounting.Post
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J9}/post] => [200] response Message == \"Payroll journal posted within HRMS.\""
    auto: API

  - id: GLACC-LC-010
    func: [F-GLACC-070]
    sc: Concurrent transitions race correctly
    t: Two concurrent Approve calls on the same Validated journal - only one succeeds, the loser gets Conflict, never a 500
    src: "PayrollAccountingService.TransitionAsync (ExecuteUpdateAsync compare-and-swap)"
    type: Integration-Concurrency
    tags: [Negative]
    pri: P0
    sev: High
    pre: "J10 is Validated, ConcurrencyVersion=1"
    role: HRAdmin (custom role holding Accounting.Approve)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J10}/approve] fired twice concurrently with the same starting ConcurrencyVersion => [200] exactly one call succeeds; [409] Conflict (\"changed by another operation\") for the other; no 500"
    auto: DB-assisted
    db: "Assert final ConcurrencyVersion incremented by exactly 1, not 2"

  - id: GLACC-LC-011
    func: [F-GLACC-071]
    sc: History event and fresh-read on every transition
    t: Each of Validate/Approve/Post appends its own history event with a populated ActorUserId, and the response reflects a freshly-reloaded row
    src: "PayrollAccountingService.TransitionAsync"
    type: Positive
    tags: [Contract]
    pri: P1
    sev: Medium
    pre: "J11 is at Generated"
    role: HRAdmin (custom role holding Accounting.Validate, Approve, Post)
    perm: Payroll.Accounting.Validate
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J11}/validate] => [200] Validated"
      - "[POST /api/payroll/accounting/{J11}/approve] => [200] Approved"
      - "[POST /api/payroll/accounting/{J11}/post] => [200] Posted"
    auto: DB-assisted
    db: "Assert PayrollJournalHistories has exactly 4 rows (Generated, Validated, Approved, Posted), each ActorUserId populated, ChangedAtUtc strictly increasing"

  - id: GLACC-LC-012
    func: [F-GLACC-072]
    sc: No skip-ahead or backward transition is possible
    t: A Generated journal cannot be directly Approved or Posted (skipping Validate), and a Posted journal cannot be reverted to any earlier status
    src: "PayrollAccountingService.ValidateAsync, ApproveAsync, PostAsync"
    type: Negative
    tags: [Boundary]
    pri: P1
    sev: Medium
    pre: "J12 is Generated; J13 is Posted"
    role: HRAdmin (custom role holding Accounting.Validate, Approve, Post)
    perm: Payroll.Accounting.Approve
    tenant: "T1 (DEMO01)"
    data: none
    steps:
      - "[POST /api/payroll/accounting/{J12}/approve] (skipping validate) => [409] Conflict"
      - "[POST /api/payroll/accounting/{J12}/post] (skipping validate and approve) => [409] Conflict"
      - "[POST /api/payroll/accounting/{J13}/validate] (already Posted, attempting to go backward) => [409] Conflict"
    auto: API
